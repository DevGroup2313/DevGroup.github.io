    /* the Guidebook */
    ["guide.search", "Search the Guidebook", "Chercher dans le guide", "Chèche nan gid la"], ["guide.searchPh", "Search", "Chercher", "Chèche"], ["guide.none", "No article matches.", "Aucun article ne correspond.", "Pa gen atik ki koresponn."],
    ["guide.start.t", "Getting started", "Pour commencer", "Pou kòmanse"],
    ["guide.start.b", "Lakay keeps the store's stock, sales and reports on this device. It works with no connection.\nBegin with the first steps on Home: set the sales tax, add your items, receive their stock, ring up a sale, and save a backup.\nEach page has small tip keys beside the controls. Press one when something is not clear.", "Lakay garde le stock, les ventes et les rapports du magasin sur cet appareil. Il fonctionne sans connexion.\nCommencez par les premiers pas de l'Accueil : la taxe, les articles, la réception du stock, une vente, puis une sauvegarde.\nChaque page a de petites touches de conseil à côté des commandes. Appuyez sur l'une d'elles quand quelque chose n'est pas clair.", "Lakay kenbe stòk, vant ak rapò magazen an sou aparèy sa a. Li mache san entènèt.\nKòmanse ak premye pa yo sou Akèy: mete taks la, ajoute atik ou yo, resevwa stòk yo, fè yon vant, epi fè yon kopi sekirite.\nChak paj gen ti bouton konsèy bò kote kontwòl yo. Peze youn lè yon bagay pa klè."],
    ["guide.start.tip", "Work through the first steps in order. Each one takes only a minute.", "Suivez les premiers pas dans l'ordre. Chacun ne prend qu'une minute.", "Fè premye pa yo nan lòd. Chak pran yon minit sèlman."],
    ["guide.door.t", "The door and your password", "La porte et votre mot de passe", "Pòt la ak modpas ou"],
    ["guide.door.b", "The door is the first page. The owner's password opens the books.\nThe store locks itself after the minutes you choose in Settings, and when you press Lock now. A sale in progress is kept while it is locked.\nAfter five wrong passwords, the door asks you to wait a little before trying again.", "La porte est la première page. Le mot de passe du propriétaire ouvre les livres.\nLe magasin se verrouille après les minutes choisies dans les Réglages, et quand vous appuyez sur Verrouiller. Une vente en cours est gardée.\nAprès cinq mots de passe erronés, la porte demande d'attendre un peu.", "Pòt la se premye paj la. Modpas mèt la louvri liv yo.\nMagazen an fèmen pou kont li apre kantite minit ou chwazi nan Reglaj, epi lè w peze Fèmen kounye a. Vant k ap fèt la rete.\nApre senk move modpas, pòt la mande w tann yon ti moman."],
    ["guide.door.tip", "Lock the store whenever you step away from the counter.", "Verrouillez le magasin chaque fois que vous quittez le comptoir.", "Fèmen magazen an chak fwa w kite kontwa a."],
    ["guide.master.t", "The Master Key", "La Clé maîtresse", "Kle Mèt la"],
    ["guide.master.b", "The Master Key is a code of 52 characters shown once, when the store is set up. It opens the books if the password is forgotten, and lets you choose a new password.\nKeep the printed card in a safe, away from the store's computers. Anyone who holds it can open the books.\nYou can make a new Master Key in Settings. The old card stops working once the new key is confirmed.", "La Clé maîtresse est un code de 52 caractères affiché une seule fois, à la configuration. Elle ouvre les livres si le mot de passe est oublié et permet d'en choisir un nouveau.\nGardez la carte imprimée dans un coffre, loin des ordinateurs du magasin. Quiconque la détient peut ouvrir les livres.\nVous pouvez créer une nouvelle Clé maîtresse dans les Réglages. L'ancienne carte cesse de fonctionner dès que la nouvelle est confirmée.", "Kle Mèt la se yon kòd 52 karaktè ki parèt yon sèl fwa, lè yo prepare magazen an. Li louvri liv yo si yo bliye modpas la, epi li pèmèt ou chwazi yon nouvo modpas.\nKenbe kat enprime a nan yon kòf, lwen òdinatè magazen an. Nenpòt moun ki gen l ka louvri liv yo.\nOu ka fè yon nouvo Kle Mèt nan Reglaj. Ansyen kat la sispann mache depi nouvo kle a konfime."],
    ["guide.master.tip", "Never keep the Master Key on a phone or a computer.", "Ne gardez jamais la Clé maîtresse sur un téléphone ou un ordinateur.", "Pa janm kenbe Kle Mèt la nan yon telefòn oswa yon òdinatè."],
    ["guide.sale.t", "Ringing up a sale", "Enregistrer une vente", "Fè yon vant"],
    ["guide.sale.b", "Open the Register. Scan a barcode, or type part of a name and choose the item. Each press adds one more.\nChange a quantity with the minus and plus keys, or type it. The cross removes a line.\nPress Take cash. Type the cash received, or press a quick amount. Lakay shows the change to give. Complete the sale, then print the receipt if the customer wants one.", "Ouvrez la Caisse. Scannez un code-barres, ou tapez une partie du nom et choisissez l'article. Chaque appui en ajoute un.\nChangez une quantité avec les touches moins et plus, ou tapez-la. La croix retire une ligne.\nAppuyez sur Encaisser en espèces. Tapez la somme reçue, ou un montant rapide. Lakay affiche la monnaie à rendre. Terminez la vente, puis imprimez le reçu si le client le souhaite.", "Louvri Kès la. Eskane yon kòd ba, oswa tape yon pati nan non an epi chwazi atik la. Chak fwa w peze, li ajoute youn.\nChanje kantite a ak bouton mwens ak plis, oswa tape l. Kwa a retire yon liy.\nPeze Pran lajan kach. Tape lajan ou resevwa a, oswa peze yon kantite rapid. Lakay montre monnen pou remèt la. Fini vant lan, epi enprime resi a si kliyan an vle l."],
    ["guide.sale.tip", "With a barcode scanner, keep the search box selected: each scan adds the item.", "Avec un lecteur de code-barres, gardez la recherche sélectionnée : chaque lecture ajoute l'article.", "Ak yon eskanè kòd ba, kite bwat rechèch la seleksyone: chak eskanè ajoute atik la."],
    ["guide.items.t", "Adding items", "Ajouter des articles", "Ajoute atik"],
    ["guide.items.b", "In Inventory, press Add an item. Give it a name, a category and a price. The cost is what you paid for one. It is needed to work out profit.\nA barcode lets the scanner find the item. The reorder level puts the item on the low stock list when it falls that low.\nUse Save and add another to enter many items quickly.", "Dans l'Inventaire, appuyez sur Ajouter un article. Donnez un nom, une catégorie et un prix. Le coût est ce que vous avez payé pour un article. Il sert à calculer le bénéfice.\nUn code-barres permet au lecteur de trouver l'article. Le seuil de commande place l'article dans le stock bas quand il descend jusque-là.\nUtilisez Enregistrer et en ajouter un autre pour saisir vite beaucoup d'articles.", "Nan Envantè, peze Ajoute yon atik. Ba l yon non, yon kategori ak yon pri. Pri achte a se sa ou peye pou youn. Li nesesè pou kalkile benefis.\nYon kòd ba pèmèt eskanè a jwenn atik la. Nivo pou kòmande a mete atik la nan stòk ki ba lè li desann rive la.\nSèvi ak Anrejistre epi ajoute yon lòt pou antre anpil atik vit."],
    ["guide.items.tip", "Enter the cost for every item. Without it, the profit of that item is not counted.", "Saisissez le coût de chaque article. Sans lui, le bénéfice de l'article n'est pas compté.", "Mete pri achte pou chak atik. San li, benefis atik sa a pa konte."],
    ["guide.receive.t", "Receiving stock", "Recevoir du stock", "Resevwa stòk"],
    ["guide.receive.b", "When a delivery arrives, open the item and press Receive stock. Type how many arrived and what each one cost.\nLakay keeps the average cost of what is on the shelf, so profit stays right when prices change.\nThe supplier and the invoice number help later, when you check a delivery.", "À l'arrivée d'une livraison, ouvrez l'article et appuyez sur Recevoir du stock. Tapez combien sont arrivés et le coût de chacun.\nLakay garde le coût moyen de ce qui est en rayon, pour que le bénéfice reste juste quand les prix changent.\nLe fournisseur et le numéro de facture aident plus tard, pour vérifier une livraison.", "Lè yon livrezon rive, louvri atik la epi peze Resevwa machandiz. Tape konbyen ki rive ak pri achte chak.\nLakay kenbe pri mwayen sa ki sou etajè a, pou benefis la rete jis lè pri yo chanje.\nFounisè a ak nimewo fakti a ede pita, lè w ap verifye yon livrezon."],
    ["guide.receive.tip", "Receive stock on the day it arrives, so the books always match the shelves.", "Recevez le stock le jour de son arrivée, pour que les livres correspondent toujours aux rayons.", "Resevwa stòk la jou li rive a, pou liv yo toujou menm ak etajè yo."],
    ["guide.correct.t", "Correcting stock", "Corriger le stock", "Korije stòk"],
    ["guide.correct.b", "When the shelf and the books disagree, open the item and press Correct the stock. Choose to remove or to add, how many, and the reason.\nEvery correction stays in the item's history with the person, the time and the reason. Removals are counted as losses in the reports.\nNothing is ever deleted: a mistake is put right by a new correction.", "Quand le rayon et les livres ne concordent pas, ouvrez l'article et appuyez sur Corriger le stock. Choisissez retirer ou ajouter, la quantité et la raison.\nChaque correction reste dans l'historique avec la personne, l'heure et la raison. Les retraits comptent comme pertes dans les rapports.\nRien n'est jamais effacé : une erreur se corrige par une nouvelle correction.", "Lè etajè a ak liv yo pa dakò, louvri atik la epi peze Korije stòk la. Chwazi retire oswa ajoute, konbyen, ak rezon an.\nChak koreksyon rete nan istwa atik la ak moun nan, lè a ak rezon an. Sa yo retire konte kòm pèt nan rapò yo.\nAnyen pa janm efase: yon erè korije ak yon nouvo koreksyon."],
    ["guide.correct.tip", "Count a few shelves every week. Small differences found early are easy to explain.", "Comptez quelques rayons chaque semaine. Les petits écarts trouvés tôt s'expliquent facilement.", "Konte kèk etajè chak semèn. Ti diferans ou jwenn bonè fasil pou eksplike."],
    ["guide.reports.t", "Reading the reports", "Lire les rapports", "Li rapò yo"],
    ["guide.reports.b", "Choose a period: today, this week, this month, or any dates. Lakay works out the sales, the tax collected, the cost of what was sold and the gross profit.\nThe tables show the best sellers, the categories, the busy hours, the items that are not selling, and the losses.\nThe CSV keys save files for your accountant. The line at the foot names the build and the last ledger line used.", "Choisissez une période : aujourd'hui, cette semaine, ce mois, ou des dates précises. Lakay calcule les ventes, la taxe perçue, le coût des articles vendus et le bénéfice brut.\nLes tableaux montrent les meilleures ventes, les catégories, les heures chargées, les articles qui ne se vendent pas et les pertes.\nLes touches CSV enregistrent des fichiers pour votre comptable. La ligne du bas indique le build et la dernière ligne du registre utilisée.", "Chwazi yon peryòd: jodi a, semèn sa a, mwa sa a, oswa nenpòt dat. Lakay kalkile vant yo, taks ou ranmase, pri achte sa ki vann ak benefis brit la.\nTablo yo montre sa ki vann plis, kategori yo, lè ki gen plis moun, atik ki pa vann ak pèt yo.\nBouton CSV yo anrejistre fichye pou kontab ou. Liy anba a bay build la ak dènye liy rejis la yo itilize."],
    ["guide.reports.tip", "Look at the items that are not selling once a month. They hold money that could buy what does sell.", "Regardez une fois par mois les articles qui ne se vendent pas. Ils immobilisent de l'argent qui pourrait acheter ce qui se vend.", "Gade atik ki pa vann yo yon fwa pa mwa. Yo kenbe lajan ki ta ka achte sa ki vann."],
    ["guide.backup.t", "Backups", "Sauvegardes", "Kopi sekirite"],
    ["guide.backup.b", "In Settings, Save a backup now writes one sealed file with all the books. It opens only with the password or the Master Key that were valid that day.\nKeep backups on a USB key, and another copy outside the store. A backup can bring the store back on a new computer.\nRestoring checks every line of the backup before anything on the device is replaced.", "Dans les Réglages, Sauvegarder maintenant écrit un fichier scellé avec tous les livres. Il ne s'ouvre qu'avec le mot de passe ou la Clé maîtresse valables ce jour-là.\nGardez les sauvegardes sur une clé USB, et une autre copie hors du magasin. Une sauvegarde peut ramener le magasin sur un nouvel ordinateur.\nLa restauration vérifie chaque ligne avant de remplacer quoi que ce soit.", "Nan Reglaj, Fè yon kopi kounye a ekri yon fichye sele ak tout liv yo. Li louvri sèlman ak modpas la oswa Kle Mèt ki te bon jou sa a.\nKenbe kopi sou yon kle USB, ak yon lòt kopi andeyò magazen an. Yon kopi ka remete magazen an sou yon nouvo òdinatè.\nLè w ap remete l, Lakay verifye chak liy anvan li ranplase anyen."],
    ["guide.backup.tip", "Save a backup at closing time, every day.", "Faites une sauvegarde à la fermeture, chaque jour.", "Fè yon kopi lè w ap fèmen, chak jou."],
    ["guide.sealed.t", "What is sealed", "Ce qui est scellé", "Sa ki sele"],
    ["guide.sealed.b", "Every item, price, cost, stock figure, sale, receipt, setting and ledger line is sealed with the store's key, which only your password or the Master Key can open.\nNot sealed: the store's name shown at the door, the build number, and the technical facts needed to open the seal.\nThere is no Lakay server. Your books stay on your devices.", "Chaque article, prix, coût, stock, vente, reçu, réglage et ligne du registre est scellé avec la clé du magasin, que seuls votre mot de passe ou la Clé maîtresse peuvent ouvrir.\nNon scellés : le nom du magasin affiché à la porte, le numéro de build et les données techniques nécessaires pour ouvrir le sceau.\nIl n'y a pas de serveur Lakay. Vos livres restent sur vos appareils.", "Chak atik, pri, pri achte, stòk, vant, resi, reglaj ak liy rejis sele ak kle magazen an, epi se sèlman modpas ou oswa Kle Mèt la ki ka louvri l.\nSa ki pa sele: non magazen an ki parèt sou pòt la, nimewo build la, ak enfòmasyon teknik ki nesesè pou louvri sele a.\nPa gen sèvè Lakay. Liv ou yo rete sou aparèy ou yo."],
    ["guide.sealed.tip", "Choose a long password. It is the lock on everything.", "Choisissez un mot de passe long. C'est la serrure de tout.", "Chwazi yon modpas ki long. Se li ki kadna tout bagay."],
    ["guide.verify.t", "Verifying the books", "Vérifier les livres", "Verifye liv yo"],
    ["guide.verify.b", "Every change is one line in the ledger, and each line carries the fingerprint of the line before it. Changing an old line would break the chain.\nIn Settings, Verify the books reads every line, checks every fingerprint, and works out each stock figure again from the start.\nIf a problem is found, save a backup and ask for help before changing anything.", "Chaque changement est une ligne du registre, et chaque ligne porte l'empreinte de la précédente. Modifier une ancienne ligne romprait la chaîne.\nDans les Réglages, Vérifier les livres lit chaque ligne, contrôle chaque empreinte et recalcule chaque stock depuis le début.\nSi un problème apparaît, faites une sauvegarde et demandez de l'aide avant de changer quoi que ce soit.", "Chak chanjman se yon liy nan rejis la, e chak liy pote anprent liy anvan l. Si yo chanje yon ansyen liy, chèn nan ta kase.\nNan Reglaj, Verifye liv yo li chak liy, tcheke chak anprent, epi refè kalkil chak stòk depi nan kòmansman.\nSi gen yon pwoblèm, fè yon kopi epi mande èd anvan w chanje anyen."],
    ["guide.verify.tip", "Verify the books once a week, and before an audit.", "Vérifiez les livres une fois par semaine, et avant un audit.", "Verifye liv yo yon fwa pa semèn, ak anvan yon odit."],
    ["guide.display.t", "Language and display", "Langue et affichage", "Lang ak afichaj"],
    ["guide.display.b", "Lakay speaks English, French and Kreyòl. Change the language at the door or in Settings, at any time.\nDay, Night and Auto change the light of every page at once. Auto follows the device.\nIn Settings you can make the text larger, and turn on Calm mode: no motion, quieter colours and larger keys.", "Lakay parle anglais, français et kreyòl. Changez de langue à la porte ou dans les Réglages, à tout moment.\nJour, Nuit et Auto changent la lumière de toutes les pages à la fois. Auto suit l'appareil.\nDans les Réglages, vous pouvez agrandir le texte et activer le mode calme : sans animation, couleurs plus douces, touches plus grandes.", "Lakay pale angle, franse ak kreyòl. Chanje lang lan sou pòt la oswa nan Reglaj, nenpòt lè.\nJou, Lannwit ak Otomatik chanje limyè tout paj yo an menm tan. Otomatik swiv aparèy la.\nNan Reglaj ou ka fè tèks la pi gwo, epi limen Mòd kalm: san mouvman, koulè pi dous ak bouton pi gwo."],
    ["guide.display.tip", "Each person at the register can choose the language they read best.", "Chaque personne à la caisse peut choisir la langue qu'elle lit le mieux.", "Chak moun nan kès la ka chwazi lang li li pi byen."],
    ["guide.build.t", "Which build am I running", "Quel build est-ce que j'utilise", "Ki build m ap itilize"],
    ["guide.build.b", "Every version of Lakay has a build number. It is on the door, in the menu, in About, on every receipt and at the foot of every report.\nEach release on GitHub lists the fingerprint of every file, so you can check that a download is exactly what was built.", "Chaque version de Lakay a un numéro de build. Il figure sur la porte, dans le menu, dans À propos, sur chaque reçu et au bas de chaque rapport.\nChaque publication sur GitHub indique l'empreinte de chaque fichier, pour vérifier qu'un téléchargement est exactement ce qui a été construit.", "Chak vèsyon Lakay gen yon nimewo build. Li sou pòt la, nan meni an, nan Konsènan, sou chak resi ak anba chak rapò.\nChak piblikasyon sou GitHub bay anprent chak fichye, pou w ka verifye sa w telechaje a se egzakteman sa ki te konstwi a."],
    ["guide.build.tip", "When you report a problem, give the build number.", "Quand vous signalez un problème, donnez le numéro de build.", "Lè w ap rapòte yon pwoblèm, bay nimewo build la."],
    ["guide.limits.t", "What Lakay does not do", "Ce que Lakay ne fait pas", "Sa Lakay pa fè"],
    ["guide.limits.b", "Lakay does not file taxes, move money, or replace the systems of RIA, CAM, Unitransfer or Boss Revolution. It keeps the store's own records.\nWhile the store is open, anyone at the device can see the screen. Lock it when you step away.\nNo program is proof against every attack. Keep the computer up to date, and do not install unknown programs on it.", "Lakay ne déclare pas les impôts, ne transfère pas d'argent et ne remplace pas les systèmes de RIA, CAM, Unitransfer ou Boss Revolution. Il tient les registres du magasin.\nQuand le magasin est ouvert, toute personne devant l'appareil voit l'écran. Verrouillez-le quand vous vous éloignez.\nAucun programme n'est à l'abri de toutes les attaques. Tenez l'ordinateur à jour et n'y installez pas de programmes inconnus.", "Lakay pa deklare taks, li pa voye lajan, li pa ranplase sistèm RIA, CAM, Unitransfer oswa Boss Revolution. Li kenbe dosye magazen an.\nLè magazen an louvri, nenpòt moun devan aparèy la ka wè ekran an. Fèmen l lè w ap deplase.\nPa gen pwogram ki pwoteje kont tout atak. Kenbe òdinatè a ajou, epi pa enstale pwogram ou pa konnen sou li."],
    ["guide.limits.tip", "Ask your accountant to read the first month's reports with you.", "Demandez à votre comptable de lire avec vous les rapports du premier mois.", "Mande kontab ou li rapò premye mwa a avè w."],

    ["studio.foot", "Everything here is yours to change. Each change is kept on this device, written in the ledger, and carried in backups and in Export all. The originals can always be put back.", "Tout ici peut être changé. Chaque changement est gardé sur cet appareil, inscrit au registre, et suit les sauvegardes et Tout exporter. Les originaux peuvent toujours être rétablis.", "Tout bagay isit la, ou ka chanje l. Chak chanjman kenbe sou aparèy sa a, ekri nan rejis la, epi li ale nan kopi sekirite yo ak nan Ekspòte tout. Ou ka toujou remete sa ki te la anvan."],
    ["studio.names.intro", "The app's name shows at the door, in the menu, in the window's title and on receipts. The software's own name and build stay in small print, for audits.", "Le nom de l'application paraît à la porte, dans le menu, dans le titre de la fenêtre et sur les reçus. Le nom du logiciel et son build restent en petit, pour les audits.", "Non aplikasyon an parèt sou pòt la, nan meni an, nan tit fenèt la ak sou resi yo. Non lojisyèl la ak build li rete an ti lèt, pou odit yo."],

    ["studio.receipt.thanks", "The thank you", "Le remerciement", "Mèsi a"], ["studio.sampleItem", "Pâté (sample)", "Pâté (exemple)", "Pate (egzanp)"],
    ["studio.safe.intro", "Keep a copy of your choices, bring them to another device, or put back every original.", "Gardez une copie de vos choix, emportez-les sur un autre appareil, ou rétablissez tous les originaux.", "Kenbe yon kopi chwa ou yo, pote yo sou yon lòt aparèy, oswa remete tout sa ki te la."],
    ["studio.safe.export", "One file with the names, words, look and receipt. It holds none of the store's books.", "Un fichier avec les noms, les mots, l'apparence et le reçu. Il ne contient aucun des livres du magasin.", "Yon fichye ak non yo, mo yo, aparans lan ak resi a. Pa gen anyen nan liv magazen an ladan."],
    ["studio.safe.import", "Use the choices saved in such a file. Everything in it is checked first.", "Utiliser les choix gardés dans un tel fichier. Tout y est vérifié d'abord.", "Sèvi ak chwa ki nan yon fichye konsa. Tout sa ki ladan verifye anvan."],
    ["studio.importFile", "File", "Fichier", "Fichye"], ["studio.importBad", "This file is not an export of the Author Studio.", "Ce fichier n'est pas un export du Studio d'auteur.", "Fichye sa a pa yon ekspòtasyon Estidyo otè a."],
    ["studio.importConfirmT", "Use the choices in this file?", "Utiliser les choix de ce fichier ?", "Sèvi ak chwa ki nan fichye sa a?"],
    ["studio.importConfirmP", "They replace the names, words, look and receipt chosen now. The store's books are not touched.", "Ils remplacent les noms, les mots, l'apparence et le reçu choisis maintenant. Les livres du magasin ne sont pas touchés.", "Yo ranplase non, mo, aparans ak resi ou chwazi kounye a. Liv magazen an pa chanje."],
    ["studio.importYes", "Use them", "Les utiliser", "Sèvi ak yo"], ["studio.imported", "The choices from the file are in place.", "Les choix du fichier sont en place.", "Chwa ki nan fichye a anplas."],
    ["studio.exported", "The choices are saved in a file.", "Les choix sont enregistrés dans un fichier.", "Chwa yo anrejistre nan yon fichye."],
    ["studio.resetT", "Put back every original?", "Rétablir tous les originaux ?", "Remete tout sa ki te la?"],
    ["studio.resetP", "The app's name, the line under the title, every changed phrase, the look and the receipt lines go back to the originals. The store's name and the books are not touched.", "Le nom de l'application, la ligne sous le titre, chaque phrase modifiée, l'apparence et les lignes du reçu reviennent aux originaux. Le nom du magasin et les livres ne sont pas touchés.", "Non aplikasyon an, liy anba tit la, chak fraz ki chanje, aparans lan ak liy resi yo retounen jan yo te ye. Non magazen an ak liv yo pa chanje."],
    ["studio.resetYes", "Put back the originals", "Rétablir les originaux", "Remete sa ki te la yo"], ["studio.resetDone", "Every original is back.", "Tous les originaux sont rétablis.", "Tout sa ki te la retounen."],
    ["studio.saved", "Saved, and written in the ledger.", "Enregistré, et inscrit au registre.", "Anrejistre, epi ekri nan rejis la."], ["studio.nothing", "Nothing has changed.", "Rien n'a changé.", "Anyen pa chanje."],
    ["tip.studio.t", "The Author Studio", "Le Studio d'auteur", "Estidyo otè a"],
    ["tip.studio.b", "Here Lakay becomes yours: its name, the store's name, every phrase, its colours and the receipt. Changes are data, not code, so the tested build stays the same and every change is in the ledger.", "Ici, Lakay devient le vôtre : son nom, celui du magasin, chaque phrase, ses couleurs et le reçu. Les changements sont des données, pas du code : le build testé reste le même et chaque changement est inscrit au registre.", "Isit la Lakay vin pou ou: non li, non magazen an, chak fraz, koulè li ak resi a. Chanjman yo se done, pa kòd, kidonk build ki teste a rete menm jan an, e chak chanjman ekri nan rejis la."],
    ["guide.studio.t", "The Author Studio", "Le Studio d'auteur", "Estidyo otè a"],
    ["guide.studio.b", "The Author Studio is where Lakay becomes yours. Open it from the menu: Author Studio.\nNames changes the app's name, the store's name and the line under the title, in each language. Words rewrites any phrase on any page. Look chooses a matched set of colours and the size of the keys. Receipt words the top and the foot of the receipt.\nEvery change is kept on this device, written in the ledger, and carried in backups. Safekeeping exports your choices to a file, brings them back, or puts back every original.", "Le Studio d'auteur est l'endroit où Lakay devient le vôtre. Ouvrez-le depuis le menu : Studio d'auteur.\nNoms change le nom de l'application, celui du magasin et la ligne sous le titre, dans chaque langue. Mots réécrit n'importe quelle phrase. Apparence choisit un jeu de couleurs accordé et la taille des touches. Reçu formule le haut et le bas du reçu.\nChaque changement est gardé sur cet appareil, inscrit au registre et suit les sauvegardes. Mise à l'abri exporte vos choix dans un fichier, les reprend, ou rétablit tous les originaux.", "Estidyo otè a se kote Lakay vin pou ou. Louvri l nan meni an: Estidyo otè.\nNon yo chanje non aplikasyon an, non magazen an ak liy anba tit la, nan chak lang. Mo yo reekri nenpòt fraz. Aparans chwazi yon seri koulè ki mache ansanm ak gwosè bouton yo. Resi ekri tèt ak pye resi a.\nChak chanjman kenbe sou aparèy sa a, ekri nan rejis la, epi li ale nan kopi sekirite yo. Sekirite chwa yo ekspòte chwa ou yo nan yon fichye, remete yo, oswa remete tout sa ki te la."],
    ["guide.studio.tip", "Export your choices after a big change, and keep the file with your backups.", "Exportez vos choix après un grand changement, et gardez le fichier avec vos sauvegardes.", "Ekspòte chwa ou yo apre yon gwo chanjman, epi kenbe fichye a ak kopi sekirite ou yo."],

    /* tips */
    ["tip.home.t", "Home", "Accueil", "Akèy"], ["tip.home.b", "The day at a glance: today's sales, the money taken, the profit, and what is running low. The large keys start the most common tasks.", "La journée en un coup d'œil : ventes, encaissements, bénéfice et stock bas. Les grandes touches lancent les tâches courantes.", "Jounen an an yon kout je: vant jodi a, lajan ki antre, benefis la, ak sa k ap fini. Gwo bouton yo kòmanse travay ki pi souvan yo."],
    ["tip.register.t", "The Register", "La Caisse", "Kès la"], ["tip.register.b", "Scan or type to find an item; each press adds one. Check the ticket, then press Take cash. Nothing is recorded until the sale is completed.", "Scannez ou tapez pour trouver un article ; chaque appui en ajoute un. Vérifiez le ticket, puis Encaisser. Rien n'est enregistré avant la fin de la vente.", "Eskane oswa tape pou jwenn yon atik; chak fwa w peze, li ajoute youn. Tcheke tikè a, epi peze Pran lajan kach. Anyen pa anrejistre anvan vant lan fini."],
    ["tip.inventory.t", "Inventory", "Inventaire", "Envantè"], ["tip.inventory.b", "Every item the store sells. Press a name to see its card: stock, history, and the keys to receive or correct stock.", "Tous les articles vendus. Appuyez sur un nom pour voir sa fiche : stock, historique, et les touches pour recevoir ou corriger le stock.", "Tout atik magazen an vann. Peze yon non pou wè kat li: stòk, istwa, ak bouton pou resevwa oswa korije stòk."],
    ["tip.reports.t", "Reports", "Rapports", "Rapò"], ["tip.reports.b", "Choose a period. Every figure is worked out from the sales and stock movements in the books, so it can always be checked.", "Choisissez une période. Chaque chiffre est calculé à partir des ventes et des mouvements de stock, donc toujours vérifiable.", "Chwazi yon peryòd. Chak chif kalkile apati vant ak mouvman stòk ki nan liv yo, kidonk ou ka toujou verifye l."],
    ["tip.currency.t", "Money", "Monnaie", "Lajan"], ["tip.currency.b", "The money the store counts in. Amounts are kept in whole cents, so totals always add up exactly.", "La monnaie du magasin. Les montants sont gardés en centimes entiers, pour que les totaux soient toujours exacts.", "Lajan magazen an konte. Kantite yo kenbe an santim antye, pou total yo toujou egzak."],
    ["tip.password.t", "A good password", "Un bon mot de passe", "Yon bon modpas"], ["tip.password.b", "At least 10 characters. A short sentence works well, for example: Patties are hot at noon! Do not use the store's name or a birthday.", "Au moins 10 caractères. Une courte phrase convient bien, par exemple : Les pâtés sont chauds à midi ! N'utilisez pas le nom du magasin ni une date de naissance.", "Omwen 10 karaktè. Yon ti fraz mache byen, pa egzanp: Pate yo cho a midi! Pa sèvi ak non magazen an ni yon dat fèt."],
    ["tip.price.t", "Price", "Prix", "Pri"], ["tip.price.b", "What the customer pays for one, before tax. Type it as 12.50.", "Ce que paie le client pour un article, hors taxe. Tapez par exemple 12,50.", "Sa kliyan an peye pou youn, san taks. Tape l konsa: 12.50."],
    ["tip.cost.t", "Cost", "Coût", "Pri achte"], ["tip.cost.b", "What the store paid for one. Needed for profit. It is updated as an average each time stock is received.", "Ce que le magasin a payé pour un article. Nécessaire pour le bénéfice. Il est mis à jour en moyenne à chaque réception.", "Sa magazen an peye pou youn. Li nesesè pou benefis. Li chanje an mwayèn chak fwa w resevwa stòk."],
    ["tip.barcode.t", "Barcode", "Code-barres", "Kòd ba"], ["tip.barcode.b", "Click in this box and scan the item: the scanner types the code for you. Two items cannot share a barcode.", "Cliquez dans ce champ et scannez l'article : le lecteur tape le code pour vous. Deux articles ne peuvent pas avoir le même code.", "Klike nan bwat sa a epi eskane atik la: eskanè a tape kòd la pou ou. De atik pa ka gen menm kòd ba."],
    ["tip.reorder.t", "Reorder level", "Seuil de commande", "Nivo pou kòmande"], ["tip.reorder.b", "When the stock falls to this number, the item appears on the low stock list. Leave it empty for items you do not reorder.", "Quand le stock descend à ce nombre, l'article apparaît dans le stock bas. Laissez vide pour les articles non recommandés.", "Lè stòk la desann rive nan nonm sa a, atik la parèt nan lis stòk ki ba. Kite l vid pou atik ou pa kòmande ankò."],
    ["tip.opening.t", "Already on the shelf", "Déjà en rayon", "Deja sou etajè a"], ["tip.opening.b", "How many you have now, when you first add the item. Later deliveries are entered with Receive stock.", "Combien vous en avez maintenant, au premier ajout. Les livraisons suivantes passent par Recevoir du stock.", "Konbyen ou genyen kounye a, lè w ajoute atik la premye fwa. Livrezon apre yo antre ak Resevwa machandiz."],
    ["tip.tax.t", "Sales tax", "Taxe de vente", "Taks sou vant"], ["tip.tax.b", "Choose the rate that applies to this item, or No tax. Rates are set in Settings. Tax is added at the register.", "Choisissez le taux de cet article, ou Sans taxe. Les taux se règlent dans les Réglages. La taxe s'ajoute à la caisse.", "Chwazi to ki aplike pou atik sa a, oswa San taks. To yo regle nan Reglaj. Taks la ajoute nan kès la."],
    ["tip.avgCost.t", "Average cost", "Coût moyen", "Pri mwayen"], ["tip.avgCost.b", "If you paid a different price this time, Lakay mixes it with the cost of what is already on the shelf, so profit stays right.", "Si vous avez payé un autre prix cette fois, Lakay le combine avec le coût de ce qui est déjà en rayon, pour un bénéfice juste.", "Si w peye yon lòt pri fwa sa a, Lakay melanje l ak pri sa ki deja sou etajè a, pou benefis la rete jis."],
    ["tip.reason.t", "Why a reason", "Pourquoi une raison", "Poukisa yon rezon"], ["tip.reason.b", "Every correction keeps its reason, the person and the time. The reports add up losses by reason, so you can see where stock goes.", "Chaque correction garde sa raison, la personne et l'heure. Les rapports totalisent les pertes par raison.", "Chak koreksyon kenbe rezon li, moun nan ak lè a. Rapò yo adisyone pèt yo pa rezon, pou w wè kote stòk la ale."],
    ["tip.archive.t", "Archive", "Archiver", "Achive"], ["tip.archive.b", "An archived item leaves the register and the lists, but its history and its past sales stay in the books. You can bring it back.", "Un article archivé quitte la caisse et les listes, mais son historique et ses ventes restent. Vous pouvez le réactiver.", "Yon atik achive soti nan kès la ak lis yo, men istwa li ak ansyen vant li rete nan liv yo. Ou ka remete l."],
    ["tip.lock.t", "The lock", "Le verrou", "Kadna a"], ["tip.lock.b", "When the store locks, the key to the books is forgotten until the password is typed again.", "Quand le magasin se verrouille, la clé des livres est oubliée jusqu'à ce que le mot de passe soit retapé.", "Lè magazen an fèmen, kle liv yo bliye jiskaske yo tape modpas la ankò."],
    ["tip.backup.t", "Backups", "Sauvegardes", "Kopi sekirite"], ["tip.backup.b", "One sealed file with all the books. Save one every evening and keep copies in two places.", "Un fichier scellé avec tous les livres. Faites-en un chaque soir et gardez des copies à deux endroits.", "Yon fichye sele ak tout liv yo. Fè youn chak aswè epi kenbe kopi nan de kote."],
    ["tip.verify.t", "Verify", "Vérifier", "Verifye"], ["tip.verify.b", "Checks that no line of the ledger was changed and that every stock figure agrees with its history.", "Vérifie qu'aucune ligne du registre n'a été modifiée et que chaque stock concorde avec son historique.", "Tcheke pa gen liy nan rejis la ki chanje, e chak stòk dakò ak istwa li."],
    ["tip.calm.t", "Display", "Affichage", "Afichaj"], ["tip.calm.b", "These choices are kept on this device, for whoever uses it.", "Ces choix sont gardés sur cet appareil, pour qui l'utilise.", "Chwa sa yo rete sou aparèy sa a, pou nenpòt moun ki sèvi avè l."],
    /* Build 3: the introduction door, after Ingenium 6.50's */
    ["intro.light", "Light", "Clair", "Klè"], ["intro.system", "Follow the system", "Suivre le système", "Swiv sistèm nan"], ["intro.dark", "Dark", "Sombre", "Fènwa"],
    ["intro.themeGroup", "Theme: light, follow the system, dark", "Thème : clair, suivre le système, sombre", "Tèm: klè, swiv sistèm nan, fènwa"],
    ["intro.enter", "Enter", "Entrer", "Antre"], ["intro.opening", "Opening…", "Ouverture…", "N ap louvri…"],
    ["intro.preparing", "Setting out the practice store… {n}%", "Mise en place du magasin d'essai… {n} %", "N ap ranje magazen pou pratike a… {n}%"],
    ["crest.press", "The sun rises. Press it.", "Le soleil se lève. Appuyez dessus.", "Solèy la ap leve. Peze l."],
    ["intro.signInKey", "Sign in", "Se connecter", "Konekte"], ["intro.lockOpen", "Sign in", "Se connecter", "Konekte"],
    ["intro.protectAria", "Set up the real store with a sign-in: a name and a password at the door, and the store's books sealed with them", "Créer le vrai magasin avec une connexion : un nom et un mot de passe à la porte, et les livres du magasin scellés avec eux", "Kreye vrè magazen an ak yon koneksyon : yon non ak yon modpas nan pòt la, epi liv magazen an sele avèk yo"],
    
    ["intro.knock", "Knock to enter", "Frappez pour entrer", "Frape pou antre"], ["intro.aria", "Welcome to {app}", "Bienvenue dans {app}", "Byenveni nan {app}"],
    ["intro.lede", "The store's own books, on this device: stock, sales, cash and reports, in English, French and Kreyòl. Everything is sealed here and works with no connection.", "Les livres du magasin, sur cet appareil : stock, ventes, caisse et rapports, en anglais, en français et en kreyòl. Tout est scellé ici et fonctionne sans connexion.", "Liv kont magazen an, sou aparèy sa a: stòk, vant, kès ak rapò, an angle, an franse ak an kreyòl. Tout bagay sele isit la, e li mache san entènèt."],
    ["intro.moving", "Moving from another device?", "Vous venez d'un autre appareil ?", "W ap soti sou yon lòt aparèy?"],
    ["intro.restore", "Bring a store from a backup", "Reprendre un magasin depuis une sauvegarde", "Mete yon magazen ki sou yon kopi sekirite"],
    ["intro.protect", "Set up the real store, with a sign-in", "Créer le vrai magasin, avec une connexion", "Prepare vrè magazen an, ak yon koneksyon"],
    ["intro.protectP", "Enter opens a practice store with sample goods, so that you can try everything first. Its sales are not real.", "Entrer ouvre un magasin d'essai avec des articles d'exemple, pour tout essayer d'abord. Ses ventes ne sont pas réelles.", "Antre louvri yon magazen pou pratike ak machandiz egzanp, pou ou ka eseye tout bagay anvan. Vant li yo pa vre."],
    ["intro.credit", "Designed and built by Yannie D. Forest  ·  © 2026 Yannie D. Forest", "Conçu et réalisé par Yannie D. Forest  ·  © 2026 Yannie D. Forest", "Konsepsyon ak fabrikasyon: Yannie D. Forest  ·  © 2026 Yannie D. Forest"],

    /* Build 3: the sign-in, after Ingenium 6.50's */
    ["ld.aria", "Sign in to {app}", "Connexion à {app}", "Konekte nan {app}"], ["ld.signIn", "Sign in", "Se connecter", "Konekte"],
    ["ld.wrongPair", "That user name and password do not open this store. Check that Caps Lock is off, then try again.", "Ce nom d'utilisateur et ce mot de passe n'ouvrent pas ce magasin. Vérifiez que la touche Verr. Maj est désactivée, puis réessayez.", "Non itilizatè ak modpas sa yo pa louvri magazen sa a. Gade si Caps Lock pa limen, epi eseye ankò."],
    ["ld.yourName", "User name", "Nom d'utilisateur", "Non itilizatè"], ["ld.yourPw", "Password", "Mot de passe", "Modpas"],
    ["ld.cant", "Can't sign in?", "Impossible de se connecter ?", "Ou pa ka konekte?"],
    ["ld.welcomeName", "Welcome back, {name}.", "Bon retour, {name}.", "Byenveni ankò, {name}."], ["ld.welcome", "Welcome back.", "Bon retour.", "Byenveni ankò."],
    ["ld.note", "The books on this device are sealed with your password. Nothing in them opens without it.", "Les livres de cet appareil sont scellés par votre mot de passe. Rien ne s'ouvre sans lui.", "Liv ki sou aparèy sa a sele ak modpas ou. Anyen pa louvri san li."],
    ["ld.practice", "Open the practice store", "Ouvrir le magasin d'essai", "Louvri magazen pou pratike a"],
    ["ld.ways.h", "Can't sign in?", "Impossible de se connecter ?", "Ou pa ka konekte?"],
    ["ld.ways.p", "There are two ways back into the store's books. Neither one needs a connection.", "Il y a deux façons de rouvrir les livres du magasin. Aucune ne demande de connexion.", "Gen de fason pou louvri liv magazen an ankò. Ni youn ni lòt pa bezwen entènèt."],
    ["ld.way1.b", "Use the Master Key", "Utiliser la Clé maîtresse", "Sèvi ak Kle Mèt la"],
    ["ld.way1.s", "The 13 groups on the card made when the store was set up. Then choose a new password.", "Les 13 groupes de la carte faite à la création du magasin. Puis choisissez un nouveau mot de passe.", "13 gwoup ki sou kat yo te fè lè yo te prepare magazen an. Apre sa, chwazi yon nouvo modpas."],
    ["ld.way2.b", "Bring the store from a backup", "Reprendre le magasin depuis une sauvegarde", "Mete magazen an sou yon kopi sekirite"],
    ["ld.way2.s", "A backup file, with the password or the Master Key that was valid when it was saved.", "Un fichier de sauvegarde, avec le mot de passe ou la Clé maîtresse valable à ce moment-là.", "Yon fichye kopi sekirite, ak modpas oswa Kle Mèt ki te bon lè yo te fè l."],
    ["ld.toSignIn", "Back to sign in", "Retour à la connexion", "Retounen nan koneksyon an"],
    ["ld.mk.h", "Use the Master Key", "Utiliser la Clé maîtresse", "Sèvi ak Kle Mèt la"],
    ["ld.mk.p", "Type the 52 characters of the Master Key card. Spaces and dashes do not matter.", "Tapez les 52 caractères de la carte de la Clé maîtresse. Les espaces et les tirets ne comptent pas.", "Tape 52 karaktè ki sou kat Kle Mèt la. Espas ak tirè pa gen enpòtans."],
    ["ld.mk.label", "Master Key", "Clé maîtresse", "Kle Mèt"], ["ld.otherWays", "Other ways", "Autres façons", "Lòt fason"], ["ld.mk.go", "Check the key", "Vérifier la clé", "Verifye kle a"],
    ["ld.pw1", "New password", "Nouveau mot de passe", "Nouvo modpas"], ["ld.pw2", "The same password again", "Le même mot de passe encore", "Menm modpas la ankò"],
    ["ld.np.h", "Choose a new password", "Choisir un nouveau mot de passe", "Chwazi yon nouvo modpas"],
    ["ld.np.p", "The Master Key is right. Choose the new password that will open the store: at least 10 characters. A short sentence works well.", "La Clé maîtresse est bonne. Choisissez le nouveau mot de passe du magasin : au moins 10 caractères. Une courte phrase convient bien.", "Kle Mèt la bon. Chwazi nouvo modpas ki pral louvri magazen an: omwen 10 karaktè. Yon ti fraz mache byen."],
    ["ld.np.go", "Save and open", "Enregistrer et ouvrir", "Anrejistre epi louvri"],

    /* Build 3: protecting the real store with a sign-in */
    ["ld.setup.h", "Set up the real store", "Créer le vrai magasin", "Prepare vrè magazen an"],
    ["ld.setup.p", "The real store keeps its own books, apart from the practice store, sealed with this password. Choose at least 10 characters; a short sentence works well.", "Le vrai magasin a ses propres livres, à part du magasin d'essai, scellés par ce mot de passe. Au moins 10 caractères ; une courte phrase convient bien.", "Vrè magazen an gen pwòp liv pa l, apa magazen pou pratike a, sele ak modpas sa a. Chwazi omwen 10 karaktè; yon ti fraz mache byen."],
    ["ld.storeName", "Store name", "Nom du magasin", "Non magazen an"], ["ld.user", "Your user name", "Votre nom d'utilisateur", "Non itilizatè ou"],
    ["ld.needUser", "Please type a user name.", "Tapez un nom d'utilisateur.", "Tanpri tape yon non itilizatè."],
    ["ld.exists", "This device already holds a real store. Sign in to it instead.", "Cet appareil contient déjà un vrai magasin. Connectez-vous plutôt.", "Aparèy sa a gen yon vrè magazen deja. Konekte nan li pito."],
    ["ld.notNow", "Not now", "Pas maintenant", "Pa kounye a"], ["ld.next", "Next", "Suivant", "Kontinye"],
    ["ld.key.h", "Your Master Key", "Votre Clé maîtresse", "Kle Mèt ou"],
    ["ld.key.p", "It opens the books if the password is ever forgotten, and it is shown only now. Write the 13 groups down, or print the card, and keep it away from the store's computers.", "Elle ouvre les livres si le mot de passe est oublié, et elle n'est affichée que maintenant. Notez les 13 groupes, ou imprimez la carte, et gardez-la loin des ordinateurs du magasin.", "Li louvri liv yo si yon jou ou bliye modpas la, e li parèt sèlman kounye a. Ekri 13 gwoup yo, oswa enprime kat la, epi kenbe l lwen òdinatè magazen an."],
    ["ld.wrote", "I have written it down", "Je l'ai notée", "Mwen ekri l"],
    ["ld.two.h", "Check the Master Key", "Vérifier la Clé maîtresse", "Verifye Kle Mèt la"],
    ["ld.two.p", "Type groups {a} and {b} from your card, to be sure it was copied well.", "Tapez les groupes {a} et {b} de votre carte, pour être sûr qu'elle a été bien copiée.", "Tape gwoup {a} ak {b} ki sou kat ou a, pou nou sèten ou kopye l byen."],
    ["ld.group", "Group {n}", "Groupe {n}", "Gwoup {n}"],
    ["ld.groupsWrong", "These groups do not match the card. Look at it again.", "Ces groupes ne correspondent pas à la carte. Regardez-la de nouveau.", "Gwoup sa yo pa menm ak sa ki sou kat la. Gade l ankò."],
    ["ld.showAgain", "Show the key again", "Revoir la clé", "Gade kle a ankò"], ["ld.seal", "Seal and open", "Sceller et ouvrir", "Sele epi louvri"],
