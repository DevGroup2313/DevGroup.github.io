<style>
/* LAKAY | the living mark (09-crest.js): seven layers at depth, each with its own motion, after Ingenium's seal.
   The whole mark sways and leans toward the pointer; the layers breathe in and out of depth out of step; the engraving
   turns anticlockwise, the halo clockwise, the sparkles orbit anticlockwise; the shell turns slowly like a wheel, against the halo, under a passing gleam. */
.lk-crest { position: relative; display: inline-block; vertical-align: middle; flex: 0 0 auto; width: var(--W, 88px); height: var(--W, 88px); line-height: 0;
  perspective: calc(var(--W, 88px) * 4); --rx: 0deg; --ry: 0deg; --lift: 0px; --sc: 1;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.lk-tilt { position: absolute; inset: 0; display: block; transform-style: preserve-3d;
  transform: rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift)) scale(var(--sc)); transition: transform .4s cubic-bezier(.2, .8, .2, 1); }
.lk-idle { position: absolute; inset: 0; display: block; transform-style: preserve-3d; animation: lkSway 7s ease-in-out infinite; }
.lk-l, .lk-gleam { position: absolute; inset: 0; width: 100%; height: 100%; display: block; max-width: none; margin: 0; pointer-events: none; user-select: none; -webkit-user-drag: none;
  transform: translateZ(calc(var(--W, 88px) * var(--z, 0))) scale(calc(1 - var(--z, 0) / 4)); }
.lk-cast { position: absolute; left: 12%; right: 12%; bottom: -7%; height: 11%; border-radius: 50%; display: block; pointer-events: none;
  background: radial-gradient(closest-side, rgba(42, 30, 90, .32), rgba(42, 30, 90, 0)); filter: blur(calc(var(--W, 88px) * .016));
  transform: translateZ(calc(var(--W, 88px) * -.07)); }
:root[data-theme="night"] .lk-cast { background: radial-gradient(closest-side, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0)); }
.lk-crest.hov { --lift: calc(var(--W, 88px) * -.03); --sc: 1.03; }
.lk-crest.down { --lift: calc(var(--W, 88px) * .015); --sc: .97; }

/* each layer's own motion */
.lk-crest img.lk-l1 { animation: lkCCW 150s linear infinite; }
.lk-crest img.lk-l2 { animation: lkCW 70s linear infinite, lkLift 7s ease-in-out infinite; }
.lk-crest img.lk-l3, .lk-crest img.lk-l4 { animation: lkCCW 120s linear infinite, lkLift 7s ease-in-out -1.75s infinite; }
.lk-crest img.lk-l5 { animation: lkPearl 4.6s ease-in-out infinite, lkLift 7s ease-in-out -3.5s infinite; }
.lk-crest img.lk-l6 { animation: lkCW 46s linear infinite, lkTwinkle 3.2s ease-in-out infinite; }

.key { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: var(--key-h); padding: 7px 14px; white-space: nowrap;
  border-radius: 11px; border: 1px solid var(--line); background: var(--face); color: var(--ink); font: 600 .8125rem/1.25 var(--sans); cursor: pointer;
  box-shadow: var(--pill); transition: transform .1s var(--spring), box-shadow .12s ease, border-color .15s ease, color .15s ease, filter .15s ease; }

.key:active { transform: translateY(1px) scale(.985); box-shadow: var(--press); transition-duration: .06s; }
.key:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: var(--pill); filter: saturate(.6); }

.key.danger.solid { color: #fff; border-color: #4a1414; text-shadow: 0 1px 1px rgba(40, 0, 0, .35); background: linear-gradient(180deg, #b04646, #8c2f2f);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 2px 0 #2a0a0a, 0 4px 6px rgba(0, 0, 0, .25); }

.key.sm { min-height: 28px; padding: 3px 10px; font-size: .75rem; border-radius: 9px; }

.key .emo { font-size: 1rem; }
.key.lg .emo { font-size: 1.1rem; }
.key .ico { width: 15px; height: 15px; }
.icon-key { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--face); color: var(--ink-2); cursor: pointer; flex: none; box-shadow: var(--pill); transition: transform .1s var(--spring), box-shadow .12s ease, color .15s; padding: 0; }
.icon-key:hover { transform: translateY(-2px); box-shadow: var(--pill-hi); color: var(--pri-text); }

.icon-key .ico { width: 15px; height: 15px; }

  text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(var(--pri-rgb), .35); }

.link.danger { color: var(--danger); }

.tip-key:hover { transform: translateY(-2px) rotate(-8deg); box-shadow: var(--pill-hi); }
.tip-key:active { transform: translateY(1px); box-shadow: var(--press); }
.chip { min-height: 30px; border: 1px solid var(--line); background: var(--face); color: var(--ink-2); border-radius: 999px; padding: 0 12px;
  font: 600 .78rem/1 var(--sans); cursor: pointer; box-shadow: var(--pill); display: inline-flex; gap: .4em; align-items: center; white-space: nowrap;
  transition: transform .1s var(--spring), box-shadow .12s ease, color .15s; }

.chips.static .chip { cursor: default; }
/* a choice of a few: Ingenium's segmented well, the chosen one raised out of it */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sunk); border: 1px solid var(--line); box-shadow: var(--inset); }
.seg button { border: 1px solid transparent; background: transparent; color: var(--muted); min-height: 26px; padding: 0 11px; border-radius: 999px; font: 600 .75rem/1 var(--sans); cursor: pointer;
  display: inline-flex; gap: .35em; align-items: center; transition: color .15s ease, background .15s ease; }
.seg button:hover { color: var(--pri-text); }
.seg button .ico { width: 14px; height: 14px; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--pri-text); font-weight: 700; border-color: var(--line); box-shadow: var(--pill); }
:root[data-theme="night"] .seg button[aria-checked="true"] { background: #29243b; }
.badge { display: inline-block; min-width: 2em; padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: .68rem; letter-spacing: .04em; text-align: center; background: var(--pri-soft); color: var(--pri-text); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--danger-soft); color: var(--danger); }

/* ---------- fields: Ingenium's wells ---------- */
.field { display: flex; flex-direction: column; gap: .3rem; margin: .65rem 0; min-width: 0; }
.label-row { display: flex; align-items: center; gap: .45rem; }
label, .label { font-weight: 600; font-size: .8rem; color: var(--ink-2); margin: 0; }
input[type=text], input[type=password], input[type=search], input[type=number], input[type=date], input[type=time], textarea {
  font: .875rem/1.4 var(--sans); color: var(--ink); background: var(--field); border: 1px solid var(--field-line); border-radius: var(--radius-s);
  padding: .55rem .75rem; min-height: 40px; width: 100%; box-shadow: var(--well); transition: border-color .15s, box-shadow .15s; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
textarea { resize: vertical; }
input:focus, textarea:focus { border-color: var(--pri); outline: none; box-shadow: var(--well), 0 0 0 3px var(--pri-soft); }
input[aria-invalid="true"], textarea[aria-invalid="true"], .sel[aria-invalid="true"] { border-color: var(--danger); animation: wiggle .3s ease; }
input[type=date]::-webkit-calendar-picker-indicator, input[type=time]::-webkit-calendar-picker-indicator { opacity: .6; cursor: pointer; }
:root[data-theme="night"] input[type=date]::-webkit-calendar-picker-indicator { filter: invert(.85); }
.err { color: var(--danger); font-weight: 600; font-size: .8rem; margin: 0; }
.err:empty { display: none; }
.check { display: flex; align-items: center; gap: .55rem; font-weight: 500; font-size: .86rem; margin: .5rem 0; cursor: pointer; color: var(--ink); }
.check input { width: 18px; height: 18px; accent-color: var(--pri); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.1rem; }
.form-grid .span2 { grid-column: 1 / -1; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.advice { margin: 0; font-weight: 600; font-size: .8rem; }
.advice.ok { color: var(--ok); } .advice.bad { color: var(--danger); }
.preview { font-weight: 600; color: var(--pri-text); min-height: 1.4em; font-size: .86rem; }
.inline { display: flex; align-items: flex-end; gap: .7rem; flex-wrap: wrap; }
.inline .field { flex: 1 1 240px; margin: 0; }
.search-row { display: flex; align-items: center; gap: .5rem; background: var(--field); border: 1px solid var(--field-line); border-radius: 999px; padding: 0 .4rem 0 .95rem; color: var(--muted); box-shadow: var(--well); }
.search-row input { border: 0; background: transparent !important; outline: none; min-height: 40px; padding-left: .1rem; font-size: .9rem; box-shadow: none !important; }
.search-row:focus-within { border-color: var(--pri); box-shadow: var(--well), 0 0 0 3px var(--pri-soft); }

/* ---------- the choosers drawn by Emporium itself (never the system's grey lists) ---------- */
.sel { position: relative; display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 40px; padding: .5rem .7rem .5rem .8rem;
  font: 500 .875rem/1.3 var(--sans); color: var(--ink); text-align: left; cursor: pointer; background: var(--face); border: 1px solid var(--field-line); border-radius: var(--radius-s);
  box-shadow: var(--pill); transition: transform .1s var(--spring), box-shadow .12s ease, border-color .15s; }
.sel:hover { border-color: var(--pri-ring); box-shadow: var(--pill-hi); transform: translateY(-1px); }
.sel:active { transform: translateY(1px); box-shadow: var(--press); }
.sel[aria-expanded="true"] { border-color: var(--pri); box-shadow: var(--pill), 0 0 0 3px var(--pri-soft); transform: none; }
.sel-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sel-chev { flex: none; width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; color: var(--pri-text); background: var(--pri-soft); transition: transform .2s var(--spring); }
.sel-chev .ico { width: 12px; height: 12px; stroke-width: 2.4; }
.sel[aria-expanded="true"] .sel-chev { transform: rotate(180deg); }
.sel-pop { position: fixed; z-index: 3000; min-width: 180px; max-height: min(320px, 60vh); overflow-y: auto; padding: 6px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--key3d-hi); animation: selIn .16s var(--ease) both; scrollbar-width: thin; }
@keyframes selIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
.sel-opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 9px; background: transparent; color: var(--ink);
  font: 500 .86rem/1.3 var(--sans); text-align: left; cursor: pointer; }
.sel-opt .sel-tick { flex: none; width: 16px; color: var(--pri-text); opacity: 0; }
.sel-opt[aria-selected="true"] { font-weight: 700; color: var(--pri-text); }
.sel-opt[aria-selected="true"] .sel-tick { opacity: 1; }
.sel-opt.active, .sel-opt:hover { background: var(--pri-soft); }
.toolbar .sel { width: auto; min-width: 200px; }
/* a file is chosen with one of Emporium's own keys; the system's box stays hidden */
.filepick { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border-radius: 14px; border: 1px dashed var(--field-line); background: var(--sunk); }
.filepick .file-name { flex: 1 1 160px; min-width: 0; font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.filepick .file-name.chosen { color: var(--ink); font-weight: 600; }
input[type=file] { position: absolute !important; width: 1px !important; height: 1px !important; opacity: 0 !important; overflow: hidden; clip: rect(0 0 0 0); pointer-events: none; }


/* ---------- the top keys: Carpe Diem's own capsule, at its own measures (pills 21px high, 11px words), in Lakay's colours ---------- */
.cl-cluster { position: fixed; top: calc(4px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); z-index: 100; display: flex; align-items: center; gap: 3px;
  padding: 2px 4px; border-radius: 999px; background: var(--bar-bg); border: 1px solid rgba(0, 0, 0, .06); box-shadow: 0 8px 24px rgba(20, 18, 50, .18); max-width: calc(100vw - 16px); }
:root[data-theme="night"] .cl-cluster { border-color: rgba(255, 255, 255, .08); box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
.cl-cluster.folded > :not(.cl-fold) { display: none; }
.cl-key { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 21px; min-width: 0; padding: 0 7px; border-radius: 999px; flex: none;
  border: 1px solid rgba(var(--pri-rgb), .7); background: transparent; color: var(--ink-2); font: 400 11px/11px var(--sans); white-space: nowrap; cursor: pointer;
  box-shadow: inset 0 -1.5px 0 rgba(30, 28, 70, .16), 0 1px 0 rgba(30, 28, 70, .32), 0 3px 3px rgba(30, 28, 70, .2), 0 6px 8px rgba(30, 28, 70, .11);
  transition: transform .12s var(--spring), color .14s ease, box-shadow .12s ease; }
:root[data-theme="night"] .cl-key { color: var(--ink-2); border-color: rgba(var(--pri-rgb), .5);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), inset 0 -1.5px 0 rgba(0, 0, 0, .4), 0 1px 0 rgba(0, 0, 0, .5), 0 3px 3px rgba(0, 0, 0, .35), 0 6px 8px rgba(0, 0, 0, .25); }
.cl-key:hover { transform: translateY(-2px); color: var(--pri-text); }
.cl-key:active { transform: translateY(2px) scale(.96); box-shadow: inset 0 2px 3px rgba(30, 28, 70, .26); transition-duration: .05s; }
.cl-key:focus-visible { outline: 2px solid var(--pri-ring); outline-offset: 2px; }
.cl-key .pdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #2d9a52; }
.cl-key.practice .pdot { background: #c98a1d; }
.cl-key .cnt { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: #c5443b; border: 1.5px solid var(--bar-bg); }
.cl-key.lang { font-weight: 700; letter-spacing: .03em; padding: 0 7px; }
.cl-fold { order: -1; width: 26px; height: 21px; flex: none; padding: 0 5px; margin: 0 -3px 0 0; border-radius: 7px; border: 1px solid rgba(0, 0, 0, .08); background: rgba(255, 255, 255, .72); color: var(--ink-2);
  font: 700 15px/1 var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  box-shadow: inset 0 -1.5px 0 rgba(30, 28, 70, .16), 0 1px 0 rgba(30, 28, 70, .32), 0 3px 3px rgba(30, 28, 70, .2), 0 6px 8px rgba(30, 28, 70, .11); transition: transform .12s var(--spring), color .12s; }
:root[data-theme="night"] .cl-fold { background: rgba(28, 30, 60, .72); border-color: rgba(255, 255, 255, .10); }
.cl-fold:hover { transform: translateY(-2px); color: var(--pri-text); }
.cl-fold:active { transform: translateY(2px) scale(.96); }
/* the one language key shows a flag at the size of an emoji (drawn, so that it shows on every device) */
.flag { display: inline-block; width: 16px; height: 11px; border-radius: 2px; overflow: hidden; flex: none; line-height: 0; position: relative; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .25); }
.flag svg { display: block; width: 100%; height: 100%; }
.flag::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .25), rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, .06)); pointer-events: none; }
/* the emblem and the name, at the head of the side menu (as Build 2 and the Forge keep them) */
.dock-brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 10px 8px; min-height: 48px; }
button.brand { position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; padding: 2px 6px 2px 2px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-family: inherit; text-align: left; }
.brand .lk-crest { flex: none; }
button.brand:active .lk-crest { --sc: .94; }
button.brand:focus-visible { outline: none; }
button.brand:focus-visible .lk-crest { outline: 2.5px solid var(--pri-ring); outline-offset: 3px; }
.brand .bname { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.brand .wordmark { font: 600 13.5px/1.1 var(--serif); letter-spacing: .18em; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-theme="night"] .brand .wordmark { color: #f5f2fd; }
.brand .storename { font: italic 500 11.5px/1.2 var(--serif); color: var(--brass-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; }
.cl-chev { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 6px; cursor: pointer; padding: 0; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  box-shadow: var(--pill); font: 600 13px/1 var(--sans); display: inline-flex; align-items: center; justify-content: center; transition: transform .1s ease, border-color .12s ease, color .12s ease; }
.cl-chev:hover { transform: translateY(-1px); border-color: var(--pri-text); color: var(--pri-text); }

/* ---------- the shell: the side menu of plain words, and the room ---------- */
.shell { display: flex; align-items: flex-start; padding: 0 calc(76px + env(safe-area-inset-right, 0px)) 0 calc(clamp(10px, 1.6vw, 40px) + env(safe-area-inset-left, 0px)); }
.dock { position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 50; align-self: flex-start; width: 206px; flex: 0 0 206px; max-height: calc(100vh - 16px);
  overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; padding: 4px 8px 18px 2px; margin-top: 8px; scrollbar-width: none; }
.dock::-webkit-scrollbar { display: none; }
.grp-label { display: block; font: 600 10px/1.5 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 12px 6px 5px; }
.nav-btn { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; margin: 2px 0; border: 1px solid transparent; border-radius: 9px;
  background: transparent; cursor: pointer; color: var(--ink-2); font: 500 .875rem/1.25 var(--sans); text-align: left;
  transition: transform .14s var(--spring), background .14s ease, color .14s ease; }
.nav-btn .ico { width: 17px; height: 17px; opacity: .85; }
.nav-btn:hover { transform: translateY(-1px); color: var(--pri-text); background: rgba(var(--pri-rgb), .06); }
.nav-btn:active { transform: translateY(0); transition-duration: .04s; }
.nav-btn[aria-current="page"] { color: var(--pri-text); font-weight: 700; }
.nav-btn[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3.5px; border-radius: 2px; background: var(--pri-text); }
.nav-btn[aria-current="page"]:hover { transform: none; background: transparent; }
.nav-btn .nav-count { margin-left: auto; font: 700 .66rem/1 var(--sans); padding: 3px 6px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.dock-foot { margin-top: 14px; padding: 10px 12px 0; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: .7rem; letter-spacing: .04em; }
:root[data-fold="1"] .dock { width: 58px; flex-basis: 58px; }
:root[data-fold="1"] .dock .grp-label, :root[data-fold="1"] .nav-btn .long, :root[data-fold="1"] .nav-btn .nav-count, :root[data-fold="1"] .dock-foot, :root[data-fold="1"] .brand .bname { display: none; }
:root[data-fold="1"] .nav-btn { justify-content: center; padding: 9px 0; }
:root[data-fold="1"] .dock-brand { flex-direction: column; gap: 8px; padding-left: 2px; }
.main { flex: 1; min-width: 0; max-width: 100%; padding: 40px 8px 40px; outline: none; }
.main > * { max-width: 1680px; margin-left: auto; margin-right: auto; }
#room > * { animation: rise .32s var(--ease) both; }
#room > *:nth-child(2) { animation-delay: .03s; } #room > *:nth-child(3) { animation-delay: .06s; } #room > *:nth-child(4) { animation-delay: .09s; }
#room > *:nth-child(5) { animation-delay: .12s; } #room > *:nth-child(n+6) { animation-delay: .15s; }

/* ---------- the column of round keys on the right (Ingenium's rail): new sale, day or night, the lock ---------- */
.fabs { position: fixed; right: calc(15px + env(safe-area-inset-right, 0px)); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); z-index: 130; display: flex; flex-direction: column; gap: 12px; }
.fab { position: relative; width: 48px; height: 48px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;
  transition: transform .12s cubic-bezier(.34, 1.35, .64, 1), opacity .15s ease; }
.fab > .emo { font-size: 34px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(40, 22, 68, .30)) drop-shadow(0 3px 5px rgba(40, 22, 68, .24)) drop-shadow(0 8px 12px rgba(40, 22, 68, .14)); }
:root[data-theme="night"] .fab > .emo { filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .6)) drop-shadow(0 3px 6px rgba(0, 0, 0, .45)); }
.fab:hover { transform: translateY(-3px) scale(1.07); }
.fab:active { transform: translateY(1px) scale(.95); transition-duration: .05s; }
.fab:focus-visible { outline: 2.5px solid var(--pri-ring); outline-offset: 2px; border-radius: 50%; }
.fab::after { content: attr(data-tip); position: absolute; right: 56px; top: 50%; transform: translateY(-50%) translateX(6px); white-space: nowrap; pointer-events: none; opacity: 0;
  padding: 5px 9px; border-radius: 8px; font: 600 11.5px/1.2 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--pill);
  transition: opacity .15s ease, transform .15s ease; }
.fab:hover::after, .fab:focus-visible::after { opacity: 1; transform: translateY(-50%); }

/* ---------- the rooms: Ingenium's page title and its lede ---------- */
.room-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem 1rem; flex-wrap: wrap; margin: 0 0 4px; }
.room-title { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; min-width: 0; }
h1.page-title { font: 600 1.56rem/1.5 var(--serif); letter-spacing: .045em; color: var(--ink); margin: 2px 0 0; }
:root[data-theme="night"] h1.page-title { color: #f5f2fd; }
.room-tools { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding-top: 6px; }
p.lede { color: var(--ink-2); max-width: 64ch; margin: 0 0 16px; font-size: .875rem; line-height: 1.55; }
.room-sub { color: var(--muted); margin: .3rem 0 0; font-size: .84rem; flex-basis: 100%; }
.mast { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; justify-content: flex-end; }
.kbd-hint { color: var(--muted); font-size: .74rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--sh-card); padding: 14px 16px 12px; min-width: 0; }
.card.inset { box-shadow: var(--inset); background: var(--sunk); }
.card.slab { background: var(--slab-face); border-radius: 18px; box-shadow: var(--slab); padding: 18px 18px 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: .7rem; margin-bottom: .45rem; flex-wrap: wrap; }
.card-head h2 { display: flex; align-items: center; gap: .45rem; }
.card-head .label-caps { margin: 0; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.banner { display: flex; gap: .6rem; align-items: center; background: var(--brass-soft); border: 1px solid rgba(184, 138, 58, .35); color: var(--ink); padding: .6rem .9rem; border-radius: 12px; font-weight: 600; font-size: .84rem; margin-bottom: 12px; }
.banner.practice { background: rgba(201, 138, 29, .10); border-color: rgba(201, 138, 29, .35); }
.banner .key { margin-left: auto; }
.note { display: flex; gap: .5rem; align-items: flex-start; background: var(--warn-soft); padding: .55rem .85rem; border-radius: var(--radius-s); font-size: .84rem; }
.master-grid { list-style: none; padding: 12px; margin: .9rem 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 7px;
  background: var(--sunk); border: 1px dashed var(--rim); border-radius: var(--radius); box-shadow: var(--inset); }
.master-grid li { display: flex; align-items: baseline; gap: .45rem; padding: .35rem .5rem; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--pill); }
.mg-n { color: var(--muted); font-size: .7rem; min-width: 1.4em; text-align: right; }
.mg-g { font-size: 1.1rem; font-weight: 700; color: var(--ink); }
.plain-list { padding-left: 0; list-style: none; }
.plain-list li { display: flex; gap: .55rem; align-items: center; padding: .2rem 0; }

/* ---------- the reports' periods: three labelled rows, the day stepper, and the transactions ---------- */
.period-rows { display: flex; flex-direction: column; gap: 10px; }
.period-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: center; }
.period-row .eyebrow { color: var(--brass-ink); }
.day-step { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.day-step .day-label { font: 600 1rem/1.3 var(--serif); letter-spacing: .02em; min-width: 15em; text-align: center; color: var(--ink); }
.day-step .day-pick { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; font-weight: 600; color: var(--muted); }
.day-step .day-pick input { width: auto; min-height: 34px; padding: .3rem .6rem; }
.custom-range { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.grid.tx td:first-child { white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@media (max-width: 700px) { .period-row { grid-template-columns: 1fr; gap: 6px; } .day-step .day-pick { margin-left: 0; } .day-step .day-label { min-width: 0; text-align: left; } }

/* ---------- the foot of every page, as Ingenium's: the emblem, the name, the maker ---------- */
.app-foot { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 8px; max-width: 1300px; margin: 34px auto 0; padding: 22px 16px 26px; color: var(--muted); font-size: 11.5px; text-align: center; }
.app-foot .seal { width: 18px; height: 18px; flex: none; }
.app-foot .sep { opacity: .5; }
.about-foot { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.6; }
.guide-foot { margin: 18px 0 0; padding-top: 12px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--muted); text-align: center; }
.alert-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.alert-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--sunk); }
.alert-list li span:nth-child(2) { flex: 1; min-width: 0; }
/* ---------- the panel of the right press: copy, cut, paste, select ---------- */
/* the edit menu of the right press: the Offline Project's (Carpe Diem's #cd-em-menu), in Lakay's Dawn */
#cd-em-menu { position: fixed; z-index: 4000; min-width: 220px; max-width: 300px; padding: 8px; border-radius: 14px; box-sizing: border-box;
  background: linear-gradient(180deg, #fffdfb 0%, #f2f0fb 100%); border: 1px solid rgba(60, 50, 120, .13); color: var(--ink);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .75) inset, 0 2px 0 rgba(40, 30, 90, .10), 0 6px 14px rgba(40, 30, 90, .12), 0 14px 30px rgba(40, 30, 90, .12), 0 28px 52px rgba(40, 30, 90, .10);
  font-family: inherit; transform-origin: top left; animation: cdEmOpen .14s cubic-bezier(.34, 1.3, .64, 1) both; }
@keyframes cdEmOpen { from { opacity: 0; transform: scale(.88) translateY(-6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
#cd-em-menu .cd-em-row { display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; min-height: 34px; padding: 6px 12px; border: 0; border-radius: 9px;
  background: transparent; color: inherit; font: 500 13px/1.2 Georgia, serif; cursor: pointer; text-align: left; white-space: nowrap;
  transition: transform .10s cubic-bezier(.34, 1.3, .64, 1), background .12s ease, box-shadow .12s ease; }
#cd-em-menu .cd-em-hint { margin-left: auto; padding-left: 16px; font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); opacity: .85; }
#cd-em-menu .cd-em-row:hover, #cd-em-menu .cd-em-row:focus-visible { outline: none; background: linear-gradient(180deg, rgba(var(--pri-rgb), .12), rgba(var(--pri-rgb), .05));
  transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 3px 8px rgba(40, 30, 90, .10); }
#cd-em-menu .cd-em-row:active { transform: translateY(0); background: rgba(var(--pri-rgb), .16); box-shadow: inset 0 1px 3px rgba(40, 30, 90, .12); }
#cd-em-menu .cd-em-row[aria-disabled="true"] { opacity: .4; cursor: default; transform: none; box-shadow: none; background: transparent; }
#cd-em-menu .cd-em-danger { color: #a63c47; }
#cd-em-menu .cd-em-sep { height: 1px; margin: 5px 8px; background: rgba(40, 30, 90, .10); }
#cd-em-menu .cd-em-note { font: 11px/1.4 Georgia, serif; color: var(--muted); padding: 0 12px; max-width: 240px; white-space: normal; }
#cd-em-menu .cd-em-note:not(:empty) { padding: 4px 12px 2px; }
:root[data-theme="night"] #cd-em-menu { background: linear-gradient(180deg, #2a2b52 0%, #1b1c3c 100%); border-color: rgba(184, 189, 255, .22); color: #eeeefc;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .08) inset, 0 2px 4px rgba(0, 0, 0, .3), 0 10px 24px rgba(0, 0, 0, .36), 0 28px 52px rgba(0, 0, 0, .24); }
:root[data-theme="night"] #cd-em-menu .cd-em-row:hover, :root[data-theme="night"] #cd-em-menu .cd-em-row:focus-visible { background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .04));
  box-shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 3px 8px rgba(0, 0, 0, .28); }
:root[data-theme="night"] #cd-em-menu .cd-em-sep { background: rgba(184, 189, 255, .18); }
:root[data-theme="night"] #cd-em-menu .cd-em-danger { color: #e88a83; }
@media (prefers-reduced-motion: reduce) { #cd-em-menu { animation: none; } }
:root[data-calm="1"] #cd-em-menu { animation: none; }
/* ---------- scroll bars are never shown; every page and panel still scrolls ---------- */
html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
::-webkit-scrollbar { display: none; width: 0; height: 0; background: transparent; }

/* ---------- the ledger: figures set like a ledger, under small caps labels, between hairlines ---------- */
.ledger { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ledger.eight { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ledger .stat { padding: 4px 18px 6px; border-left: 1px solid var(--line); min-width: 0; }
.ledger .stat:nth-child(4n+1) { border-left: 0; padding-left: 2px; }
.ledger.eight .stat:nth-child(n+5) { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 10px; }
.stat { display: flex; flex-direction: column; gap: 3px; }
.stat-label { color: var(--muted); font: 600 .84rem/1.3 var(--sans); display: flex; align-items: center; gap: .4rem; }
.stat-label .emo { font-size: .95rem; }
.stat-value { font-family: var(--serif); font-size: 1.85rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; overflow-wrap: anywhere; color: var(--ink); }
.stat.good .stat-value { color: var(--pri-text); } .stat.bad .stat-value { color: var(--danger); } .stat.warn .stat-value { color: var(--warn); }
.stats-sm { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 0; }
.stats-sm .stat { padding: 2px 14px; border-left: 1px solid var(--line); }
.stats-sm .stat-value { font-size: 1.15rem; }



/* ---------- Home, after Ingenium 6.50's: the hero slab, the day's figures, the rooms as jewelled keys, the counter ---------- */
.hx { display: flex; flex-direction: column; gap: 22px; }
.hx-slab { background: var(--slab-face); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--slab); }
.hx-head { display: grid; grid-template-columns: 92px minmax(0, 1fr) minmax(0, 500px); gap: 14px 22px; align-items: center; padding: 24px 26px; color: var(--ink); }
.hx-seal { width: 92px; height: 92px; display: grid; place-items: center; }
.hx-seal-key { width: 92px; height: 92px; }
.hx-htext { position: relative; min-width: 0; }
.hx-eyebrow { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
.hx-eyebrow h1 { font: 600 12px/1.2 var(--sans); letter-spacing: .28em; text-transform: uppercase; color: var(--pri-text); margin: 0; }
.hx-date { font: 600 10.5px/1.2 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--brass); }
.hx-hello { font: 600 1.875rem/1.12 var(--serif); letter-spacing: .02em; color: var(--ink); margin: 6px 0 0; overflow-wrap: anywhere; }
:root[data-theme="night"] .hx-hello { color: #f5f2fd; }
.hx-lede { font-size: .875rem; line-height: 1.5; color: var(--ink-2); margin: 6px 0 0; max-width: 62ch; }
.hx-next { display: flex; flex-direction: column; gap: 9px; padding: 14px 15px; border-radius: 14px; background: var(--sunk); border: 1px solid var(--line-soft); box-shadow: inset 0 1px 2.5px rgba(40, 22, 68, .06); min-width: 0; }
.hx-next-h { font: 700 10.5px/1.2 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.hx-step { color: var(--ink-2); letter-spacing: .02em; margin: 2px 0 2px; font-size: .875rem; }
.hx-row { display: flex; flex-wrap: wrap; gap: 8px; }
.hx-btn { position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 34px; max-width: 100%; padding: 8px 14px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--face); color: var(--ink); font: 600 .8125rem/1.25 var(--sans); cursor: pointer; text-align: left; box-shadow: var(--pill);
  transition: transform .1s var(--spring), box-shadow .12s ease, color .15s ease; }
.hx-btn .ico { width: 15px; height: 15px; }
.hx-btn .emo { font-size: .95rem; }
.hx-btn:hover { transform: translateY(-2px); box-shadow: var(--pill-hi); }
.hx-btn:active { transform: translateY(1px) scale(.985); box-shadow: var(--press); transition-duration: .06s; }
.hx-btn.pri { color: #fff; border-color: var(--pri-edge); padding: 8px 16px; text-shadow: 0 1px 1px rgba(30, 10, 60, .35); background: linear-gradient(180deg, var(--pri-hi), var(--pri-lo)); box-shadow: var(--psh); }
.hx-btn.pri:hover { box-shadow: var(--pshhi); }
.hx-btn.pri:active { box-shadow: var(--ppress); }
.hx-btn.quiet { min-height: 26px; padding: 2px 8px; font-size: .78rem; color: var(--pri-text); }

/* the day's figures, as a row of counters in one slab */
.hx-today { padding: 16px 20px 16px; }
.hx-sech { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin: 0 2px 12px; }
.hx-sech h2 { font: 600 1.03rem/1.2 var(--serif); letter-spacing: .06em; margin: 0; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.hx-sech p { margin: 0; color: var(--muted); font-size: .8125rem; }
.hx-sech .hx-btn { margin-left: auto; }
.hx-gauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hx-gauge { display: flex; flex-direction: column; gap: 4px; padding: 4px 18px 2px; border-left: 1px solid var(--line); min-width: 0; }
.hx-gauge:first-child { border-left: 0; padding-left: 4px; }
.hx-gauge .g-label { font: 700 10px/1.3 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.hx-gauge .g-value { font: 600 1.9rem/1.1 var(--serif); letter-spacing: .01em; font-variant-numeric: tabular-nums; color: var(--ink); overflow-wrap: anywhere; }
.hx-gauge.good .g-value { color: var(--pri-text); } .hx-gauge.bad .g-value { color: var(--danger); } .hx-gauge.warn .g-value { color: var(--warn); }
.hx-gauge .g-note { font-size: .74rem; color: var(--muted); }

/* the rooms, as Ingenium's jewelled keys */
.hx-keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.hx-key { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 150px; padding: 16px 16px 15px; border-radius: 18px; text-align: left;
  border: 1px solid var(--line); background: var(--face-tilt); color: var(--ink); font: inherit; cursor: pointer; box-shadow: var(--key3d);
  transition: transform .18s var(--spring), box-shadow .18s ease, border-color .18s ease; }
.hx-key:hover { transform: translateY(-4px); box-shadow: var(--key3d-hi); border-color: var(--pri-ring); }
.hx-key:active { transform: translateY(2px) scale(.99); box-shadow: var(--press); transition-duration: .07s; }
.hx-key:focus-visible { outline: 2.5px solid var(--pri-ring); outline-offset: 3px; border-radius: 18px; }
.hx-jewel { width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center; color: #fff; background: var(--jewel); box-shadow: var(--jsh);
  transition: transform .4s var(--spring); }
.hx-jewel .ico { width: 23px; height: 23px; stroke-width: 1.8; }
.hx-key:hover .hx-jewel { transform: translateY(-1px) rotate(-4deg) scale(1.05); }
.hx-kt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hx-kh { font: 600 1.03rem/1.2 var(--serif); letter-spacing: .03em; color: var(--ink); }
.hx-kd { font-size: .8125rem; line-height: 1.42; color: var(--ink-2); }
.hx-km { display: flex; align-items: center; gap: 6px; max-width: 100%; margin-top: auto; font: 650 .72rem/1.5 var(--sans); color: var(--pri-text); }
.hx-km::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .75; flex: none; }
.hx-km.warn { color: var(--warn); } .hx-km.ok { color: var(--ok); } .hx-km:empty { display: none; }
.hx-arrow { position: absolute; top: 13px; right: 13px; color: var(--muted); font-size: 18px; line-height: 1; transition: transform .4s var(--spring), color .2s; }
.hx-key:hover .hx-arrow { transform: translateX(3px); color: var(--pri-text); }

/* at the counter: what is low, the latest sales, and the day's proverb */
.hx-recent { padding: 18px 18px 16px; }
.hx-rcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.hx-rc { display: flex; flex-direction: column; min-width: 0; padding: 12px 10px 10px; border-radius: 14px; background: var(--sunk); border: 1px solid var(--line-soft); box-shadow: inset 0 1px 2.5px rgba(40, 22, 68, .05); }
.hx-rch { display: flex; align-items: center; gap: 8px; margin: 0 4px 10px; }
.hx-rch .ico { width: 16px; height: 16px; color: var(--pri-text); }
.hx-rch h3 { flex: 1; font: 600 .91rem/1.2 var(--serif); letter-spacing: .05em; margin: 0; color: var(--ink); }
.hx-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.hx-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line-soft);
  background: var(--surface); color: var(--ink); font: 500 .8125rem/1.35 var(--sans); text-align: left; box-shadow: 0 1px 0 rgba(40, 22, 68, .06); animation: rise .3s var(--ease) both; }
button.hx-item { cursor: pointer; transition: transform .12s var(--spring), box-shadow .12s ease; }
button.hx-item:hover { transform: translateY(-1px); box-shadow: var(--pill); }
.hx-item .emo { margin-right: 6px; }
.hx-item .hx-i-main { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hx-list li:nth-child(2) .hx-item { animation-delay: .04s; } .hx-list li:nth-child(3) .hx-item { animation-delay: .08s; } .hx-list li:nth-child(4) .hx-item { animation-delay: .12s; }
.hx-empty { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; padding: 6px 6px 4px; color: var(--muted); font-size: .8125rem; line-height: 1.5; }
.hx-proverb { padding: 2px 6px 4px; }
.hx-proverb .pv-ht { font: italic 600 1.06rem/1.4 var(--serif); color: var(--ink); margin: 0; }
.hx-proverb .pv-tr { color: var(--muted); margin: 6px 0 0; font-size: .8125rem; }
.hx-proverb .pv-mark { font: 600 2.4rem/.6 var(--serif); color: var(--brass); display: block; margin: 8px 0 2px; }


/* ---------- the register, inventory, reports, settings and the guide ---------- */
/* ---------- the register ---------- */
.register { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 390px); gap: 16px; align-items: start; }
.reg-pick { display: flex; flex-direction: column; gap: 10px; }
.products { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-height: calc(100vh - 270px); overflow-y: auto; padding: 3px 3px 8px; }
.product { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); grid-template-rows: auto auto auto; column-gap: 9px; row-gap: 2px; align-items: center; text-align: left;
  padding: 10px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--face); color: var(--ink); cursor: pointer; font: inherit; box-shadow: var(--relief);
  transition: transform .14s var(--ease), box-shadow .14s var(--ease), border-color .15s; }
.product:hover { transform: translateY(-2px); box-shadow: var(--relief-hi); border-color: var(--rim); }
.product:active { transform: translateY(1px); box-shadow: var(--relief-down); }
.product.popped { animation: pop .3s var(--ease); }
.p-emo { grid-row: 1 / span 3; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; background: var(--tint); border: 1px solid var(--line); align-self: start; }
.p-name { font-weight: 600; font-size: .9rem; line-height: 1.25; overflow-wrap: anywhere; }
.p-price { font-family: var(--serif); font-weight: 700; font-size: 1.02rem; color: var(--pri-text); }
.p-stock { font-size: .74rem; color: var(--muted); }
.p-stock.warn { color: var(--warn); font-weight: 600; } .p-stock.bad { color: var(--danger); font-weight: 600; }
.plus-one { position: fixed; z-index: 70; pointer-events: none; font: 800 1.1rem var(--sans); color: var(--pri-text); animation: floatUp .7s var(--ease) forwards; }
.empty { padding: .8rem; font-size: .92rem; }
/* the ticket, as a slip of receipt paper */
.reg-ticket { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--parch); border-color: var(--line-2);
  padding: 18px 18px 16px; border-radius: 6px 6px var(--radius) var(--radius); }
.reg-ticket::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 7px;
  background: radial-gradient(circle at 6px 0, transparent 5px, var(--parch) 5.5px) 0 0 / 12px 7px repeat-x; }
:root[data-theme="night"] .reg-ticket { background: var(--parch); }
.reg-ticket h2 { font-size: 1.05rem; }
.ticket-lines { list-style: none; padding: 0; margin: 0; max-height: calc(100vh - 400px); overflow-y: auto; }
.tline { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px dashed var(--line-2); }
.tline.fresh { animation: slideIn .3s var(--ease); }
.t-main { display: flex; flex-direction: column; min-width: 0; }
.t-name { font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
.t-unit { font-size: .76rem; }
.t-warn { color: var(--warn); font-size: .74rem; display: inline-flex; gap: .3rem; align-items: center; }
.t-qty { display: flex; align-items: center; gap: 3px; }
.t-qty .icon-key { width: 26px; height: 26px; }
.t-qty .icon-key .ico { width: 13px; height: 13px; }
.qty { width: 44px !important; min-height: 28px !important; height: 28px; padding: .1rem !important; text-align: center; font-size: .88rem !important; }
.t-amount { font-weight: 700; font-size: .9rem; min-width: 4.2em; }
.tline .icon-key.danger { width: 26px; height: 26px; }
.totals { border-top: 1px solid var(--line-2); padding-top: 6px; font-size: .9rem; }
.trow { display: flex; justify-content: space-between; padding: 2px 0; color: var(--ink-2); }
.trow.total { font-family: var(--serif); font-size: 1.55rem; font-weight: 700; color: var(--ink); padding-top: 8px; margin-top: 4px; border-top: 2px solid var(--ink); }
.trow.total .num { display: inline-block; }
.trow.total .num.bump { animation: pulse .4s var(--ease); }
.pay-row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 4px; }
.due { display: flex; justify-content: space-between; align-items: baseline; font-size: 1rem; margin: 0 0 .6rem; }
.due strong { font-family: var(--serif); font-size: 2rem; }
.quick-cash { display: flex; flex-wrap: wrap; gap: 6px; }
.money-in { font-size: 1.4rem !important; font-family: var(--serif) !important; text-align: right; min-height: 52px !important; }
.change { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; min-height: 1.5em; margin: .3rem 0 0; }
.change.good { color: var(--pri-text); } .change.bad { color: var(--danger); }
.receipt { font-family: var(--mono); font-size: .86rem; background: #FFFFFF; color: #111111; border: 1px solid #DDDDDD; border-radius: 8px; padding: 14px 16px; max-width: 360px; margin: .6rem auto 0; box-shadow: 0 4px 12px rgba(0, 0, 0, .1); }
.r-head { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; margin-bottom: 8px; }
.receipt table { width: 100%; border-collapse: collapse; }
.receipt td { padding: 2px 0; vertical-align: top; }
.r-totals { border-top: 1px dashed #999999; margin-top: 6px; padding-top: 4px; }
.r-total td { font-weight: 700; font-size: 1rem; }
.r-by, .r-note, .r-thanks, .r-build { text-align: center; margin: .3rem 0; }
.r-build { color: #666666; font-size: .74rem; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
.confetti span { position: absolute; top: -40px; font-family: var(--emoji); font-size: 1.5rem; animation: fall var(--t, 1.8s) cubic-bezier(.25, .6, .4, 1) var(--d, 0s) forwards; }

/* ---------- inventory and reports ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .search-row { flex: 1 1 280px; }
.toolbar select { width: auto; min-width: 190px; min-height: 40px; }
.table-wrap { overflow-x: auto; }
.card.table-wrap { padding: 4px 6px; }
.grid { width: 100%; border-collapse: collapse; font-size: .9rem; }
.grid th { text-align: left; font: 600 .82rem/1.25 var(--sans); color: var(--muted); padding: .7rem .7rem .55rem; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.grid td { padding: .5rem .7rem; border-bottom: 1px solid var(--line); }
.grid tbody tr:last-child td { border-bottom: 0; }
.grid tbody tr { transition: background .12s; }
.grid tbody tr:hover { background: var(--tint); }
.grid.compact td, .grid.compact th { padding: .38rem .6rem; }
.grid th.num, .grid td.num { text-align: right; }
.row-key { all: unset; cursor: pointer; font-weight: 600; color: var(--pri-text); display: inline-flex; gap: .5rem; align-items: center; }
.row-key .emo { font-size: 1rem; }
.row-key span:last-child { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.row-key:hover span:last-child { text-decoration-color: currentColor; }
.row-key:focus-visible { outline: 2px solid var(--brass); }
.inv-foot { margin-top: .5rem; font-size: .86rem; }
.item-top { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: start; }
.big-stock { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px 10px; border-radius: var(--radius); background: var(--tint); border: 1px solid var(--line); color: var(--pri-text); }
.big-stock.warn { background: var(--warn-soft); color: var(--warn); } .big-stock.bad { background: var(--danger-soft); color: var(--danger); }
.big-stock span { font: 600 .84rem/1.2 var(--sans); }
.big-stock .emo { font-size: 1.3rem; }
.big-stock strong { font-family: var(--serif); font-size: 2.3rem; line-height: 1.05; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px; margin: 0; }

.fact dd { margin: .1rem 0 0; overflow-wrap: anywhere; font-size: .92rem; }
.item-keys { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin: 14px 0 4px; }
.history { list-style: none; padding: 0; margin: .4rem 0 0; max-height: 280px; overflow-y: auto; }

.rep-sec { margin-top: 14px; }
.rep-sec .label-caps { margin-bottom: .35rem; }
.bar { display: inline-block; width: 150px; max-width: 30vw; height: 8px; border-radius: 5px; background: var(--tray); vertical-align: middle; box-shadow: var(--inset); overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--pri), var(--pri-hi)); animation: grow .7s var(--ease) both; transform-origin: left; }

/* ---------- settings and guide ---------- */
.set-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.set-sec { margin-bottom: 12px; scroll-margin-top: 16px; }
.row-keys { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: .5rem; }

/* ---------- dialogs and messages: the sign-in's own card, with its walls ---------- */
.layer { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px;

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.dialog { --dlg-end: #f7f5fa; width: 100%; max-width: 520px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; color: var(--ink); border-radius: 22px;
  background: linear-gradient(180deg, var(--surface), var(--surface-2) 62%, var(--dlg-end));

  animation: ildIn .42s cubic-bezier(.22, .8, .3, 1) both; }

@keyframes ildIn { 0% { opacity: 0; transform: translateY(12px) scale(.955); } 62% { opacity: 1; transform: translateY(-2px) scale(1.008); } 100% { opacity: 1; transform: none; } }
.dialog.wide { max-width: 860px; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 20px 22px 6px; }

.dialog-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 12px 22px 20px; }

.toast.warn::before { background: var(--warn); }

.about-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 4px 0 6px; }

.display-rows { display: flex; flex-direction: column; gap: 14px; }
.display-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.display-row > span { font-weight: 600; color: var(--ink); font-size: .86rem; }

/* ---------- the Author Studio ---------- */
/* ---------- the Author Studio ---------- */
.studio { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }
.studio-index { list-style: none; padding: 0 0 0 12px; margin: 4px 0 0; display: flex; flex-direction: column; gap: 1px; border-left: 1px solid var(--line-2); position: sticky; top: 16px; }
.studio-pane { padding: 20px 24px 22px; }
.studio-h { display: flex; align-items: center; gap: .5rem; font-size: 1.35rem; }
.studio-intro { font-family: var(--serif); font-style: italic; color: var(--ink-2); margin: .35rem 0 1rem; max-width: 62ch; line-height: 1.6; }
.studio-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; margin: 8px 0; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); box-shadow: var(--relief); animation: rise .3s var(--ease) both; }
.studio-row > .emo { font-size: 1.25rem; }
.studio-row strong { font-weight: 650; }
.studio-foot { margin-top: 1rem; font-size: .86rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: .8rem; }
.studio-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 22px; align-items: start; }
.studio-langs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 10px; }
.studio-preview { position: sticky; top: 16px; background: var(--tray); border: 1px dashed var(--line-2); border-radius: 14px; padding: 14px; box-shadow: var(--inset); }
.pv-door { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 14px 8px 10px; background: var(--surface); border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--sh-card); }
.pv-name { font-family: var(--serif); font-weight: 700; font-size: 1.7rem; line-height: 1.1; margin-top: .5rem; color: #2C3270; overflow-wrap: anywhere; }
:root[data-theme="night"] .pv-name { color: #E2CF9F; }
.pv-store { font-family: var(--serif); font-weight: 700; font-size: .95rem; margin-top: .4rem; }
.pv-door .seal-ring { margin: 4px 0 2px; }
.pv-door .door-rule span { width: 34px; }
.status-chip { display: inline-flex; align-items: center; gap: .45rem; height: 28px; padding: 0 12px; border-radius: 999px; font: 600 .78rem var(--sans); color: var(--pri-text); background: var(--tint); border: 1px solid var(--line-2); }
.status-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pri); box-shadow: 0 0 0 3px var(--pri-soft); }
.word-tools { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.word-tools .field { margin: 0; }
.studio-pane > .search-row { margin: 6px 0 8px; }
.studio-pane > .chips { margin-bottom: 10px; }
.word-list { display: flex; flex-direction: column; gap: 6px; }
.word-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) 32px; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.word-row.changed { border-color: var(--brass); background: var(--parch); }
.word-row.edited { border-style: dashed; border-color: var(--pri); }
.word-orig { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: .86rem; color: var(--ink-2); }
.word-orig span:last-child { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.word-key { font-family: var(--mono); font-size: .68rem; color: var(--muted); letter-spacing: .02em; }
.word-row input, .word-row textarea { min-height: 36px; font-size: .9rem; }
.palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
.palette-card { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-2);
  background: var(--face); box-shadow: var(--relief); transition: transform .12s var(--ease), box-shadow .12s; }
.palette-card:hover { transform: translateY(-2px); box-shadow: var(--relief-hi); }
.palette-card[aria-checked="true"] { border-color: var(--pri); box-shadow: var(--relief), 0 0 0 3px var(--pri-soft); }
.palette-card:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.palette-card strong { font-size: .92rem; }
.swatches { display: flex; gap: 5px; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }



/* ---------- narrow screens ---------- */
@media (max-width: 1150px) {
  .register { grid-template-columns: 1fr; } .reg-ticket { position: static; } .products { max-height: none; } .ticket-lines { max-height: none; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .hx-head { grid-template-columns: 92px minmax(0, 1fr); } .hx-next { grid-column: 1 / -1; }
  .hx-keys { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hx-rcols { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .shell { flex-direction: column; align-items: stretch; padding: 0 calc(10px + env(safe-area-inset-right, 0px)) 0 calc(10px + env(safe-area-inset-left, 0px)); }
  .dock, :root[data-fold="1"] .dock { position: static; width: 100%; flex: 0 0 auto; max-height: none; margin-top: 34px; padding: 4px 2px 8px; flex-direction: row; align-items: center; gap: 3px;
    overflow-x: auto; overflow-y: visible; border-bottom: 1.5px solid rgba(var(--pri-rgb), .3); scroll-snap-type: x proximity; }
  .dock-brand { flex: 0 0 auto; min-height: 0; padding: 0 6px 0 0; } .dock-brand .cl-chev { display: none; } .brand .storename { display: none; }
  .grp-label { display: none; }
  .nav-btn { width: auto; flex: 0 0 auto; padding: 7px 11px; white-space: nowrap; scroll-snap-align: start; }
  .nav-btn[aria-current="page"]::before { display: none; } .nav-btn[aria-current="page"] { background: var(--pri-soft); }

  box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 2px 0 rgba(40, 30, 90, .08), 0 10px 22px rgba(40, 30, 90, .14), 0 26px 50px rgba(40, 30, 90, .16);

/* EMPORIUM | Copyright (c) 2026 Yannie D. Forest. All rights reserved. NO LICENCE IS GRANTED. See LICENCE.txt.
   The door and the sign-in, after Ingenium 6.50's own (its .intro-door and its sign-in, r197): the same card, the
   same corner switches, the same emblem disc, the same raised key, the same dialogs and their numbered grid. Ingenium's
   colour tokens are kept under their own names (--i-*), so that they never touch the rest of Emporium's. */

.intro-door, #lockDoor {
  --i-accent: var(--pri-text); --i-accent-bright: var(--pri-hi); --i-accent-deep: var(--pri-lo); --i-line-rgb: var(--pri-rgb); --i-accent-soft: var(--pri-soft);
  --i-card-hi: #ffffff; --i-card-lo: #f9f7fc; --i-fam-rgb: 40, 22, 68; --i-hairline: rgba(34, 26, 46, .10);
  --i-ink-1: #221a2e; --i-ink-2: #4a4358; --i-ink-3: #6c6579; --i-input-bg: rgba(34, 26, 46, .03);
  --i-pop: inset 0 -1.5px 0 rgba(40, 22, 68, .13), 0 2px 0 rgba(40, 22, 68, .25), 0 4px 5px rgba(40, 22, 68, .16), 0 9px 14px rgba(40, 22, 68, .10);
  --i-well: inset 0 1px 2.5px rgba(40, 22, 68, .08);
  --i-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --i-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
:root[data-theme="night"] .intro-door, :root[data-theme="night"] #lockDoor {
  --i-accent: var(--pri-text); --i-accent-bright: #d0c6f8; --i-accent-deep: #a79bea; --i-line-rgb: var(--pri-rgb); --i-accent-soft: var(--pri-soft);
  --i-card-hi: #28233a; --i-card-lo: #231e33; --i-hairline: rgba(196, 186, 244, .11);
  --i-ink-1: #f3eefb; --i-ink-2: #d3c9e3; --i-ink-3: #a99cc1; --i-input-bg: rgba(10, 6, 18, .32);
  --i-pop: inset 0 1px 0 rgba(255, 255, 255, .07), inset 0 -2px 0 rgba(0, 0, 0, .45), 0 2px 0 rgba(0, 0, 0, .75), 0 4px 5px rgba(0, 0, 0, .50), 0 9px 14px rgba(0, 0, 0, .36);
  --i-well: inset 0 1px 3px rgba(0, 0, 0, .40);
}

/* ---------- the introduction door ---------- */
.intro-door { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 400; display: flex; align-items: center; justify-content: center; overflow: auto;
  padding: calc(20px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));
  font-family: var(--i-sans); color: var(--i-ink-1); background: var(--bg); }
:root[data-theme="night"] .intro-door { background: var(--bg); }
.intro-door[hidden] { display: none !important; }
/* The app behind the door, as Ingenium shows its own: here a still drawing of the rooms, frosted. */
.intro-ghost { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; display: grid; grid-template-columns: 220px 1fr; gap: 26px; padding: 18px 26px; opacity: .9; }
.intro-ghost i { display: block; border-radius: 16px; background: #ffffff; box-shadow: 0 1px 0 rgba(40, 22, 68, .06), 0 6px 14px rgba(40, 22, 68, .06); }
.intro-ghost .g-rail { display: flex; flex-direction: column; gap: 12px; padding-top: 64px; }
.intro-ghost .g-rail i { height: 30px; border-radius: 10px; background: rgba(var(--pri-rgb), .10); box-shadow: none; }
.intro-ghost .g-rail i:first-child { background: rgba(var(--pri-rgb), .22); }
.intro-ghost .g-main { display: grid; grid-template-rows: 44px 150px 1fr; gap: 22px; }
.intro-ghost .g-main i:first-child { background: rgba(var(--pri-rgb), .08); box-shadow: none; }
.intro-ghost .g-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.intro-ghost .g-row i { min-height: 220px; }
.intro-ghost .g-dot { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: rgba(160, 120, 230, .32); }
:root[data-theme="night"] .intro-ghost i { background: #1c1829; box-shadow: none; }
:root[data-theme="night"] .intro-ghost .g-rail i, :root[data-theme="night"] .intro-ghost .g-main i:first-child { background: rgba(var(--pri-rgb), .10); }
.intro-frost { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none;
  background: radial-gradient(620px 520px at 50% 46%, rgba(var(--pri-rgb), .14), transparent 70%), radial-gradient(520px 380px at 50% 100%, rgba(176, 135, 62, .08), transparent 70%), rgba(245, 243, 250, .76);
  backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%); }
:root[data-theme="night"] .intro-frost { background: radial-gradient(620px 520px at 50% 46%, rgba(95, 72, 187, .20), transparent 70%), rgba(9, 7, 18, .80); }
@media (max-width: 760px) { .intro-ghost { grid-template-columns: 1fr; } .intro-ghost .g-rail { display: none; } .intro-ghost .g-row { grid-template-columns: 1fr; } }

.intro-card { position: relative; isolation: isolate; width: min(440px, 92vw); text-align: center; padding: 34px 32px 24px; border-radius: 26px; margin: auto;
  border: 1px solid rgba(var(--i-fam-rgb), .10); background: var(--i-card-hi);
  box-shadow: 0 1px 0 rgba(var(--i-fam-rgb), .08), 0 4px 7px rgba(var(--i-fam-rgb), .08), 0 20px 36px rgba(var(--i-fam-rgb), .12), 0 38px 72px rgba(var(--i-fam-rgb), .10);
  animation: introRise .45s ease; }
:root[data-theme="night"] .intro-card { border-color: rgba(196, 186, 244, .14); background: #1f1b2e;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 4px 7px rgba(0, 0, 0, .45), 0 20px 36px rgba(0, 0, 0, .5), 0 38px 72px rgba(0, 0, 0, .45); }
@keyframes introRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.intro-door.ild-card-away .intro-card { opacity: 0; transform: scale(.985); pointer-events: none; transition: opacity .22s ease, transform .22s ease; }

/* the corner switches: the look on the right, as Ingenium's; the language on the left, in the same pill */
.intro-corner { position: absolute; top: 15px; right: 15px; z-index: 8; }
.intro-corner.intro-corner-l { right: auto; left: 15px; }
.i-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--i-hairline); background: var(--i-input-bg); box-shadow: var(--i-well); }
:root[data-theme="night"] .i-seg { background: rgba(10, 6, 18, .35); }
.i-seg .seg-btn { appearance: none; -webkit-appearance: none; min-width: 26px; min-height: 24px; padding: 2px 8px; border: 1px solid transparent; border-radius: 999px; margin: 0;
  font: 12px/1 var(--i-sans); display: inline-flex; align-items: center; justify-content: center; color: var(--i-ink-3); background: transparent; box-shadow: none; cursor: pointer;
  transition: color .15s ease; }
.i-seg .seg-btn:hover { color: var(--i-accent); }
.i-seg .seg-btn.active { color: var(--i-accent); font-weight: 700; background: var(--i-card-hi); border-color: var(--i-hairline); box-shadow: var(--i-pop); }
:root[data-theme="night"] .i-seg .seg-btn.active { background: #28233a; color: #d0c6f8; }
.i-seg .seg-btn:focus-visible { outline: 2px solid var(--i-accent); outline-offset: 2px; }
.i-seg .seg-btn.lang { font-size: 11px; letter-spacing: .04em; font-weight: 600; }

/* the emblem in its disc */
.intro-seal { width: fit-content; margin: 4px auto 16px; padding: 0; border: 0; background: transparent; border-radius: 50%; cursor: pointer; display: flex; justify-content: center;
  animation: sealDoorIn .62s cubic-bezier(.34, 1.56, .64, 1); transition: transform .22s cubic-bezier(.34, 1.56, .64, 1), filter .22s ease; }
.intro-seal:focus-visible { outline: 2.5px solid var(--i-accent); outline-offset: 4px; }
@keyframes sealDoorIn { 0% { opacity: 0; transform: scale(.82); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
@keyframes sealKnock { 0% { transform: scale(.9); } 45% { transform: scale(1.12) rotate(-4deg); } 100% { transform: scale(1) rotate(0); } }

/* the disc's own colours (also used by the emblem in the side menu and the top bar) */
.seal3d .s4-breath { animation: s4Breath 4s ease-in-out infinite .62s; }
@keyframes s4Breath { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }

    ["about.p1", "Lakay is the store's own app for stock, sales and reports. It works with no connection and keeps everything sealed on this device.", "Lakay est l'application du magasin pour le stock, les ventes et les rapports. Elle fonctionne sans connexion et garde tout scellé sur cet appareil.", "Lakay se aplikasyon magazen an pou stòk, vant ak rapò. Li mache san entènèt e li kenbe tout bagay sele sou aparèy sa a."],
    ["about.rights", "All rights reserved. No licence is granted beyond the use the author allows.", "Tous droits réservés. Aucune licence n'est accordée au-delà de l'usage permis par l'auteur.", "Tout dwa rezève. Pa gen lisans anplis itilizasyon otè a pèmèt."],
    ["about.p2", "Each release lists the SHA-256 fingerprint of every file, so a download can be checked.", "Chaque version indique l'empreinte SHA-256 de chaque fichier, pour vérifier un téléchargement.", "Chak vèsyon bay anprent SHA-256 chak fichye, pou yo ka verifye sa yo telechaje."],
    ["set.eraseP", "Removes the store and its books from this device only. Backups and other devices are not touched.", "Retire le magasin et ses livres de cet appareil seulement. Les sauvegardes et les autres appareils ne sont pas touchés.", "Retire magazen an ak liv li yo sou aparèy sa a sèlman. Kopi sekirite ak lòt aparèy pa chanje."],

    ["set.eraseWarn", "This cannot be undone on this device. Save a backup first if you may need these books.", "C'est irréversible sur cet appareil. Faites d'abord une sauvegarde si vous pourriez avoir besoin de ces livres.", "Ou p ap ka defèt sa sou aparèy sa a. Fè yon kopi anvan si w ka bezwen liv sa yo."],
