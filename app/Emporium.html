/* EMPORIUM | Copyright (c) 2026 Yannie D. Forest. All rights reserved. NO LICENCE IS GRANTED. See LICENCE.txt.
   Emporium's own dress, in the manner of Carpe Diem and Ingenium. By day: light pastels (lavender, sky, peach, butter,
   rose) on a soft lavender grey, with an indigo between Carpe Diem's blue and Ingenium's purple, and a rose coral for the
   keys that matter most. By night: dark academia (walnut and leather, parchment ink, oxblood keys, brass). Keys and
   cards stand out in relief (a lit top edge, a shadowed lip and soft shadows, as in the family), lift under the pointer
   and sink when pressed. No green. All motion stops in Calm mode, or when the device asks for less motion. */
:root {
  --bg: #F6F4F8; --bg2: #EEEAF3; --panel: #FFFFFF; --panel2: #FAF9FC; --tray: #F1EEF6; --rail: #F3F0F8;
  --ink: #1F2329; --ink2: #474C59; --muted: #626877;
  --acc: #4A55A2; --acc-deep: #3A4488; --acc-hi: #6370C2; --on-acc: #FFFFFF; --acc-soft: rgba(74, 85, 162, .10); --acc-text: #3A4488;
  --hero-a: #DE7B67; --hero-b: #C45B49; --hero-c: #A9473A; --on-hero: #FFFFFF;
  --gold: #B8913F; --gold-hi: #E2C27A; --gold-ink: #75561A; --gold-soft: rgba(184, 145, 63, .15);
  --p-lav: #ECE6FA; --p-sky: #E2EFFA; --p-peach: #FDEADF; --p-butter: #FBF2D6; --p-rose: #F9E1E6; --p-lilac: #F1E4F7;
  --good: #3A4488; --warn: #8A5A00; --warn-soft: rgba(214, 151, 32, .16); --bad: #B3261E; --bad-soft: rgba(179, 38, 30, .09);
  --edge: rgba(74, 85, 162, .14); --edge2: rgba(74, 85, 162, .26); --rim: rgba(74, 85, 162, .42);
  --key-face: linear-gradient(180deg, #FFFFFF, #F7F6FB);
  --relief: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -2px 0 rgba(36, 40, 80, .10), 0 2px 0 rgba(36, 40, 80, .24), 0 4px 6px rgba(36, 40, 80, .12), 0 10px 18px rgba(36, 40, 80, .09);
  --relief-hover: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -2px 0 rgba(36, 40, 80, .10), 0 3px 0 rgba(36, 40, 80, .24), 0 8px 12px rgba(36, 40, 80, .14), 0 18px 28px rgba(36, 40, 80, .10);
  --relief-down: inset 0 2px 5px rgba(36, 40, 80, .22), inset 0 -1px 0 rgba(255, 255, 255, .5), 0 1px 0 rgba(36, 40, 80, .16);
  --card-relief: inset 0 1px 0 rgba(255, 255, 255, .9), 0 1px 0 rgba(36, 40, 80, .08), 0 6px 16px rgba(36, 40, 80, .07), 0 18px 34px rgba(36, 40, 80, .05);
  --card-lift: inset 0 1px 0 rgba(255, 255, 255, .95), 0 2px 0 rgba(36, 40, 80, .10), 0 12px 24px rgba(36, 40, 80, .12), 0 26px 44px rgba(36, 40, 80, .07);
  --inset: inset 0 2px 4px rgba(36, 40, 80, .09);
  --radius: 18px; --radius-s: 12px; --key-h: 46px;
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", "Iowan Old Style", Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, "Roboto Mono", monospace;
  --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
:root[data-theme="night"] {
  --bg: #141210; --bg2: #1A1714; --panel: #1E1B17; --panel2: #25211C; --tray: #171411; --rail: #171411;
  --ink: #ECE7DE; --ink2: #D2C9BA; --muted: #A89F92;
  --acc: #D4B67A; --acc-deep: #E6CF9C; --acc-hi: #8E3440; --on-acc: #F4EDE0; --acc-soft: rgba(212, 182, 122, .12); --acc-text: #E2C88F;
  --hero-a: #E2C27A; --hero-b: #C9A35A; --hero-c: #A9803A; --on-hero: #1E1A12;
  --gold: #C9A964; --gold-hi: #E2C78A; --gold-ink: #E2C88F; --gold-soft: rgba(201, 169, 100, .14);
  --p-lav: #2A2430; --p-sky: #222A31; --p-peach: #312620; --p-butter: #302A1C; --p-rose: #31211F; --p-lilac: #2B2330;
  --good: #E2C88F; --warn: #F0C26A; --warn-soft: rgba(240, 194, 106, .13); --bad: #F2A096; --bad-soft: rgba(242, 160, 150, .12);
  --edge: rgba(201, 169, 100, .14); --edge2: rgba(201, 169, 100, .26); --rim: rgba(201, 169, 100, .45);
  --key-face: linear-gradient(180deg, #2C2722, #231F1B);
  --relief: inset 0 1px 0 rgba(255, 240, 210, .07), inset 0 -2px 0 rgba(0, 0, 0, .45), 0 2px 0 rgba(0, 0, 0, .78), 0 5px 7px rgba(0, 0, 0, .52), 0 11px 18px rgba(0, 0, 0, .38);
  --relief-hover: inset 0 1px 0 rgba(255, 240, 210, .09), inset 0 -2px 0 rgba(0, 0, 0, .45), 0 3px 0 rgba(0, 0, 0, .78), 0 8px 12px rgba(0, 0, 0, .52), 0 18px 28px rgba(0, 0, 0, .4);
  --relief-down: inset 0 3px 7px rgba(0, 0, 0, .58), inset 0 -1px 0 rgba(255, 240, 210, .05), 0 1px 0 rgba(0, 0, 0, .45);
  --card-relief: inset 0 1px 0 rgba(255, 240, 210, .05), 0 1px 0 rgba(0, 0, 0, .6), 0 8px 18px rgba(0, 0, 0, .44), 0 20px 36px rgba(0, 0, 0, .3);
  --card-lift: inset 0 1px 0 rgba(255, 240, 210, .07), 0 2px 0 rgba(0, 0, 0, .62), 0 14px 26px rgba(0, 0, 0, .5), 0 28px 46px rgba(0, 0, 0, .34);
  --inset: inset 0 2px 5px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
:root[data-size="l"] { font-size: 18px; }
:root[data-size="xl"] { font-size: 20px; }
:root[data-calm="1"] { --key-h: 54px; }
:root[data-calm="1"] *, :root[data-calm="1"] *::before, :root[data-calm="1"] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 400 1rem/1.55 var(--sans);
  background: radial-gradient(1100px 600px at 0% 0%, var(--p-lav), transparent 60%), radial-gradient(900px 520px at 100% 0%, var(--p-peach), transparent 58%), var(--bg); background-attachment: fixed; }
:root[data-theme="night"] body { background: radial-gradient(1000px 560px at 0% 0%, rgba(142, 52, 64, .16), transparent 60%), radial-gradient(900px 520px at 100% 0%, rgba(201, 169, 100, .10), transparent 58%), var(--bg); background-attachment: fixed; }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); line-height: 1.2; text-wrap: balance; }
h1 { font-size: 2rem; font-variant: small-caps; letter-spacing: .03em; margin: 0; font-weight: 700; }
h2 { font-size: 1.3rem; margin: 0 0 .6rem; font-weight: 700; }
h3 { font-size: 1.12rem; margin: 1.2rem 0 .5rem; }
p { margin: .4rem 0; }
a { color: var(--acc-text); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.ico { width: 1.2em; height: 1.2em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.22em; }
.emo { font-family: var(--emoji); font-style: normal; font-weight: 400; line-height: 1; display: inline-block; flex: none; }
.mono { font-family: var(--mono); letter-spacing: .06em; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .9rem; margin: .25rem 0 0; }
.small { font-size: .85rem; }
.hidden { display: none !important; }
.req { color: var(--hero-c); }

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0% { transform: scale(1); } 35% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0) scale(1); } to { opacity: 0; transform: translate(-50%, -48px) scale(1.3); } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(-1.5deg); } }
@keyframes shine { 0% { transform: translateX(-130%) rotate(25deg); } 55%, 100% { transform: translateX(260%) rotate(25deg); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-10deg) scale(1.08); } 75% { transform: rotate(9deg) scale(1.08); } }
@keyframes drift { 0% { background-position: 0% 0%, 100% 0%, 0 0; } 100% { background-position: 14% 8%, 86% 10%, 0 0; } }
@keyframes fall { 0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(0deg); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate3d(var(--dx, 0), 105vh, 0) rotate(var(--rot, 360deg)); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
#room > * { animation: rise .45s var(--ease) both; }
#room > *:nth-child(2) { animation-delay: .04s; } #room > *:nth-child(3) { animation-delay: .08s; } #room > *:nth-child(4) { animation-delay: .12s; }
#room > *:nth-child(5) { animation-delay: .16s; } #room > *:nth-child(6) { animation-delay: .2s; } #room > *:nth-child(n+7) { animation-delay: .24s; }

/* ---------- keys: raised; they lift under the pointer and sink when pressed ---------- */
.key { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: var(--key-h); padding: .55rem 1.15rem;
  border-radius: 999px; border: 1px solid var(--rim); background: var(--key-face); color: var(--acc-text);
  font: 650 1rem/1.2 var(--sans); cursor: pointer; box-shadow: var(--relief); text-align: center;
  transition: transform .14s var(--ease), box-shadow .14s var(--ease), filter .2s ease; }
.key:hover { transform: translateY(-1.5px); box-shadow: var(--relief-hover); }
.key:hover .emo { animation: wiggle .5s ease; }
.key:active { transform: translateY(1px); box-shadow: var(--relief-down); }
.key:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: var(--relief-down); }
.key.primary { background: linear-gradient(180deg, var(--acc-hi), var(--acc) 55%, var(--acc-deep)); color: var(--on-acc); border-color: rgba(20, 24, 70, .45); }
:root[data-theme="night"] .key.primary { background: linear-gradient(180deg, #9E3E4B, #8E3440 50%, #6E2330); color: #F4EDE0; border-color: rgba(201, 169, 100, .55); }
.key.hero { background: linear-gradient(180deg, var(--hero-a), var(--hero-b) 52%, var(--hero-c)); color: var(--on-hero); border-color: rgba(110, 40, 30, .45); text-shadow: 0 1px 0 rgba(0, 0, 0, .12); }
:root[data-theme="night"] .key.hero { border-color: rgba(120, 90, 30, .7); text-shadow: 0 1px 0 rgba(255, 240, 200, .25); }
.key.danger { color: var(--bad); border-color: var(--bad); }
.key.big { min-height: 58px; font-size: 1.1rem; padding: .8rem 1.5rem; }
.key.huge { min-height: 70px; font-size: 1.35rem; width: 100%; border-radius: var(--radius); }
.key.small { min-height: 36px; font-size: .9rem; padding: .3rem .85rem; }
.key .emo { font-size: 1.25em; }
.key.big .emo, .key.huge .emo { font-size: 1.45em; }
.icon-key { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--edge2);
  background: var(--key-face); color: var(--ink2); cursor: pointer; flex: none; box-shadow: var(--relief); transition: transform .12s var(--ease), box-shadow .12s; }
.icon-key:hover { transform: translateY(-1px); box-shadow: var(--relief-hover); }
.icon-key:active { transform: translateY(1px); box-shadow: var(--relief-down); }
.icon-key.danger { color: var(--bad); }
.link { background: none; border: 0; padding: .3rem .1rem; color: var(--acc-text); font: 600 .95rem var(--sans); cursor: pointer; display: inline-flex; gap: .4em; align-items: center; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--edge2); }
.link:hover { text-decoration-color: currentColor; }
.link.danger { color: var(--bad); }
.tip-key { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gold);
  background: radial-gradient(circle at 35% 30%, #FFFBEA, var(--p-butter) 75%); cursor: pointer; flex: none; padding: 0; font-size: 1rem; box-shadow: var(--relief); transition: transform .14s var(--ease); }
:root[data-theme="night"] .tip-key { background: radial-gradient(circle at 35% 30%, #4A3F25, #2B2618 75%); }
.tip-key:hover { transform: translateY(-1px) rotate(-8deg); }
.tip-key:active { transform: translateY(1px); box-shadow: var(--relief-down); }
.chip { border: 1px solid var(--edge2); background: var(--key-face); color: var(--ink2); border-radius: 999px; padding: .4rem .95rem;
  font: 600 .92rem var(--sans); cursor: pointer; min-height: 40px; box-shadow: var(--relief); display: inline-flex; gap: .4em; align-items: center; transition: transform .12s var(--ease), box-shadow .12s; }
.chip:hover { transform: translateY(-1px); box-shadow: var(--relief-hover); }
.chip:active { transform: translateY(1px); box-shadow: var(--relief-down); }
.chip[aria-pressed="true"] { background: linear-gradient(180deg, var(--acc-hi), var(--acc) 60%, var(--acc-deep)); color: var(--on-acc); border-color: transparent; }
:root[data-theme="night"] .chip[aria-pressed="true"] { background: linear-gradient(180deg, #9E3E4B, #6E2330); color: #F4EDE0; border-color: rgba(201, 169, 100, .5); }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chips.static { list-style: none; padding: 0; margin: .4rem 0 1rem; }
.chips.static .chip { cursor: default; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 999px; background: var(--tray); border: 1px solid var(--edge); box-shadow: var(--inset); }
.seg button { border: 0; background: transparent; color: var(--ink2); padding: .4rem .9rem; border-radius: 999px; font: 600 .9rem var(--sans); cursor: pointer; display: inline-flex; gap: .35em; align-items: center; min-height: 36px; transition: background .2s, transform .12s; }
.seg button[aria-checked="true"] { background: var(--key-face); color: var(--acc-text); box-shadow: var(--relief); }
.badge { display: inline-block; min-width: 2.3em; padding: .12rem .6rem; border-radius: 999px; font-weight: 700; font-size: .88rem; text-align: center; background: var(--p-sky); color: var(--acc-text); }
.badge.ok { background: var(--p-lav); color: var(--acc-text); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: .3rem; margin: .7rem 0; min-width: 0; }
.label-row { display: flex; align-items: center; gap: .5rem; }
label, .label { font-weight: 650; color: var(--ink2); margin: 0; }
input[type=text], input[type=password], input[type=search], input[type=number], input[type=date], select, textarea {
  font: 1rem/1.4 var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--edge2); border-radius: var(--radius-s);
  padding: .65rem .85rem; min-height: var(--key-h); width: 100%; box-shadow: var(--inset); transition: border-color .15s, box-shadow .15s; }

.grid th.num, .grid td.num { text-align: right; }
.row-key { all: unset; cursor: pointer; font-weight: 650; color: var(--acc-text); display: inline-flex; gap: .5rem; align-items: center; }
.row-key .emo { font-size: 1.15rem; }
.row-key span:last-child { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--edge2); }
.row-key:hover span:last-child { text-decoration-color: currentColor; }
.row-key:focus-visible { outline: 3px solid var(--gold); }
.inv-foot { margin-top: .6rem; }
.item-top { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 18px; align-items: start; }
.big-stock { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; border-radius: var(--radius); background: var(--p-sky); color: var(--acc-text); box-shadow: var(--relief); }
.big-stock.warn { background: var(--p-butter); color: var(--warn); } .big-stock.bad { background: var(--p-rose); color: var(--bad); }
.big-stock .emo { font-size: 2rem; }
.big-stock strong { font-family: var(--serif); font-size: 2.6rem; line-height: 1.1; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px 16px; margin: 0; }
.fact dt { color: var(--muted); font-size: .85rem; font-weight: 650; }
.fact dd { margin: 0; overflow-wrap: anywhere; }
.item-keys { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 4px; }
.history { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
.history li { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) auto; gap: 10px; padding: .45rem 0; border-bottom: 1px solid var(--edge); font-size: .93rem; }
.period-card { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.custom-range { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.custom-range .field { margin: 0; flex: 0 1 200px; }
.rep-range { margin: 0 0 .8rem; display: flex; gap: .5rem; align-items: center; }
.rep-sec { margin-top: 14px; }
.rep-sec h3 { margin-top: 0; display: flex; gap: .5rem; align-items: center; }
.bar { display: inline-block; width: 170px; max-width: 30vw; height: 12px; border-radius: 7px; background: var(--tray); vertical-align: middle; box-shadow: var(--inset); overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--acc), var(--gold) 70%, var(--hero-a)); animation: grow .8s var(--ease) both; transform-origin: left; }
.stamp { color: var(--muted); font-size: .82rem; margin-top: 1rem; font-family: var(--mono); overflow-wrap: anywhere; }
.print-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }

/* ---------- settings and guide ---------- */
.set-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.set-sec { margin-bottom: 14px; scroll-margin-top: 16px; }
.row-keys { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: .6rem; }
.good-line { color: var(--acc-text); font-weight: 700; display: flex; gap: .5rem; align-items: center; }
.bad-line { color: var(--bad); font-weight: 700; display: flex; gap: .5rem; align-items: center; }
.about { display: flex; gap: 18px; align-items: flex-start; }
.guide { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 16px; align-items: start; }
.guide-side { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 16px; }
.guide-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.guide-key { all: unset; display: flex; gap: .6rem; align-items: center; cursor: pointer; padding: .55rem .8rem; border-radius: 12px; font-weight: 600; color: var(--ink2); transition: transform .14s var(--ease), background .2s; }
.guide-key .emo { font-size: 1.2rem; }
.guide-key:hover { background: var(--p-lav); transform: translateX(3px); }
:root[data-theme="night"] .guide-key:hover { background: rgba(201, 169, 100, .08); }
.guide-key[aria-current="true"] { background: linear-gradient(180deg, var(--panel), var(--panel2)); color: var(--acc-text); box-shadow: var(--relief); }
.guide-key:focus-visible { outline: 3px solid var(--gold); }
.guide-article { max-width: 72ch; outline: none; }
.guide-article h2 { display: flex; align-items: center; gap: .5rem; font-size: 1.6rem; }
.guide-article h2 .emo { font-size: 1.5em; }
.guide-article p { line-height: 1.75; }
.tip-box { display: flex; gap: .7rem; align-items: flex-start; background: var(--p-butter); border-left: 4px solid var(--gold); padding: .75rem 1rem; border-radius: 10px; margin: 1rem 0; }
.tip-box .emo { font-size: 1.4rem; }
.tip-text { font-size: 1.05rem; line-height: 1.65; }

.layer { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(30, 28, 50, .38); backdrop-filter: blur(3px); animation: rise .2s ease both; }
:root[data-theme="night"] .layer { background: rgba(8, 6, 4, .62); }
.dialog { width: 100%; max-width: 530px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: linear-gradient(180deg, var(--panel), var(--panel2)); color: var(--ink);
  border-radius: 24px; border: 1px solid var(--edge2); box-shadow: 0 2px 0 rgba(36, 40, 80, .18), 0 30px 80px rgba(0, 0, 0, .3); animation: rise .32s var(--ease) both; }
.dialog.wide { max-width: 880px; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 18px 22px 6px; }
.dialog-head h2 { margin: 0; display: flex; gap: .5rem; align-items: center; }
.dialog-body { padding: 6px 22px 12px; overflow-y: auto; }
.dialog-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--edge); }

.toast { display: flex; gap: .6rem; align-items: flex-start; padding: .8rem 1rem; border-radius: 16px; background: linear-gradient(180deg, #4F5AA8, #3A4488); color: #FFFFFF; box-shadow: 0 2px 0 rgba(0, 0, 0, .2), 0 12px 28px rgba(36, 40, 80, .28);

:root[data-theme="night"] .toast { background: linear-gradient(180deg, #2E2822, #221E1A); color: #F4EDE0; }
.toast .emo { font-size: 1.15rem; }
.toast.bad { background: linear-gradient(180deg, #9A2A1D, #7E1D14); color: #FFFFFF; }

@media (max-width: 1100px) {
  .register { grid-template-columns: 1fr; }
  .reg-ticket { position: static; }
  .products { max-height: none; }
  .ticket-lines { max-height: none; }
}
.nav-key .short { display: none; }
@media (max-width: 900px) {

  .rail-foot { margin: 0; padding: 0; border: 0; }

  .nav-key:hover { transform: none; }
  .nav-tile { width: 32px; height: 30px; font-size: 1.1rem; border-radius: 10px; }
  .nav-key span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-key .long { display: none; }
  .nav-key .short { display: block; }
  .lock-key { width: 44px; flex: none; }

  .guide-side { position: static; }

  .stat-value { font-size: 1.35rem; }
  .stat-emo { width: 32px; height: 32px; font-size: 1.1rem; }
  .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .actions .key { padding-left: .9rem; font-size: 1rem; }
}

/* ---------- printing: only what was asked for ---------- */
#print { display: none; }
@media print {

  html.printing body { background: #FFFFFF !important; }
  html.printing #print { display: block; color: #000000; }

  .print-card { text-align: center; font-family: var(--serif); }

  .print-card .master-grid li { box-shadow: none; }
  .report.for-print .stat { box-shadow: none; border: 1px solid #999999; }

  @page { margin: 12mm; }
}

    ["set.verifyIntro", "Reads every line of the ledger, checks each fingerprint, and works out every stock figure again from the start.", "Lit chaque ligne du registre, vérifie chaque empreinte et recalcule chaque stock depuis le début.", "Li chak liy nan rejis la, verifye chak anprent, epi refè kalkil chak stòk depi nan kòmansman."],
    ["set.verifyKey", "Verify the books", "Vérifier les livres", "Verifye liv yo"], ["set.verifying", "Verifying…", "Vérification…", "N ap verifye…"],
    ["set.verifyOk", "The books are whole: {n} lines, every fingerprint and every stock figure agree.", "Les livres sont intacts : {n} lignes, chaque empreinte et chaque stock concordent.", "Liv yo antye: {n} liy, chak anprent ak chak stòk dakò."],
    ["set.verifyBad", "{n} problems found. Save a backup and contact the person who looks after Emporium.", "{n} problèmes trouvés. Faites une sauvegarde et contactez la personne qui s'occupe d'Emporium.", "Nou jwenn {n} pwoblèm. Fè yon kopi epi kontakte moun k ap okipe Emporium."],
    ["set.line", "line", "ligne", "liy"], ["problem.order", "A line is out of order", "Une ligne n'est pas à sa place", "Yon liy pa nan plas li"],
    ["problem.chain", "A fingerprint does not match the line before", "Une empreinte ne correspond pas à la ligne précédente", "Yon anprent pa koresponn ak liy anvan an"],
    ["problem.unreadable", "A sealed entry cannot be opened", "Une entrée scellée ne s'ouvre pas", "Gen yon antre sele ki pa louvri"], ["problem.head", "The last line is not the one expected", "La dernière ligne n'est pas celle attendue", "Dènye liy lan pa sa nou t ap tann nan"],
    ["problem.missing", "An item has no history", "Un article n'a pas d'historique", "Yon atik pa gen istwa"], ["problem.extra", "The history holds an unknown item", "L'historique contient un article inconnu", "Istwa a gen yon atik nou pa konnen"],
    ["problem.differs", "A figure differs from its history", "Un chiffre diffère de son historique", "Yon chif pa menm ak istwa li"], ["problem.receive", "A delivery does not add up", "Une réception ne concorde pas", "Yon resepsyon pa kadre"],
    ["problem.adjust", "A correction does not add up", "Une correction ne concorde pas", "Yon koreksyon pa kadre"],
    ["set.used", "The books take {mb} MB on this device.", "Les livres occupent {mb} Mo sur cet appareil.", "Liv yo pran {mb} MB sou aparèy sa a."],
    ["set.kept", "The device has agreed to keep them permanently.", "L'appareil a accepté de les garder durablement.", "Aparèy la dakò kenbe yo nèt."],
    ["set.notKept", "The browser may clear them if the device runs out of room. Save backups often.", "Le navigateur peut les effacer si l'appareil manque de place. Sauvegardez souvent.", "Navigatè a ka efase yo si aparèy la manke espas. Fè kopi souvan."],
    ["set.keptUnknown", "Save backups often.", "Sauvegardez souvent.", "Fè kopi souvan."],
    ["about.p1", "Emporium is the store's own app for stock, sales and reports. It works with no connection and keeps everything sealed on this device.", "Emporium est l'application du magasin pour le stock, les ventes et les rapports. Elle fonctionne sans connexion et garde tout scellé sur cet appareil.", "Emporium se aplikasyon magazen an pou stòk, vant ak rapò. Li mache san entènèt e li kenbe tout bagay sele sou aparèy sa a."],
    ["about.rights", "All rights reserved. No licence is granted beyond the use the author allows.", "Tous droits réservés. Aucune licence n'est accordée au-delà de l'usage permis par l'auteur.", "Tout dwa rezève. Pa gen lisans anplis itilizasyon otè a pèmèt."],
    ["about.p2", "Each release lists the SHA-256 fingerprint of every file, so a download can be checked.", "Chaque version indique l'empreinte SHA-256 de chaque fichier, pour vérifier un téléchargement.", "Chak vèsyon bay anprent SHA-256 chak fichye, pou yo ka verifye sa yo telechaje."],
    ["set.eraseP", "Removes the store and its books from this device only. Backups and other devices are not touched.", "Retire le magasin et ses livres de cet appareil seulement. Les sauvegardes et les autres appareils ne sont pas touchés.", "Retire magazen an ak liv li yo sou aparèy sa a sèlman. Kopi sekirite ak lòt aparèy pa chanje."],
    ["set.eraseKey", "Erase from this device", "Effacer de cet appareil", "Efase sou aparèy sa a"],
    ["set.eraseWarn", "This cannot be undone on this device. Save a backup first if you may need these books.", "C'est irréversible sur cet appareil. Faites d'abord une sauvegarde si vous pourriez avoir besoin de ces livres.", "Ou p ap ka defèt sa sou aparèy sa a. Fè yon kopi anvan si w ka bezwen liv sa yo."],
    ["set.eraseType", "Type the store's name: {name}", "Tapez le nom du magasin : {name}", "Tape non magazen an: {name}"], ["set.eraseNameWrong", "The name is not the same.", "Le nom ne correspond pas.", "Non an pa menm."],

    /* the Guidebook */
    ["guide.search", "Search the Guidebook", "Chercher dans le guide", "Chèche nan gid la"], ["guide.searchPh", "Search", "Chercher", "Chèche"], ["guide.none", "No article matches.", "Aucun article ne correspond.", "Pa gen atik ki koresponn."],
    ["guide.start.t", "Getting started", "Pour commencer", "Pou kòmanse"],
    ["guide.start.b", "Emporium keeps the store's stock, sales and reports on this device. It works with no connection.\nBegin with the first steps on Home: set the sales tax, add your items, receive their stock, ring up a sale, and save a backup.\nEach page has small tip keys beside the controls. Press one when something is not clear.", "Emporium garde le stock, les ventes et les rapports du magasin sur cet appareil. Il fonctionne sans connexion.\nCommencez par les premiers pas de l'Accueil : la taxe, les articles, la réception du stock, une vente, puis une sauvegarde.\nChaque page a de petites touches de conseil à côté des commandes. Appuyez sur l'une d'elles quand quelque chose n'est pas clair.", "Emporium kenbe stòk, vant ak rapò magazen an sou aparèy sa a. Li mache san entènèt.\nKòmanse ak premye pa yo sou Akèy: mete taks la, ajoute atik ou yo, resevwa stòk yo, fè yon vant, epi fè yon kopi sekirite.\nChak paj gen ti bouton konsèy bò kote kontwòl yo. Peze youn lè yon bagay pa klè."],
    ["guide.start.tip", "Work through the first steps in order. Each one takes only a minute.", "Suivez les premiers pas dans l'ordre. Chacun ne prend qu'une minute.", "Fè premye pa yo nan lòd. Chak pran yon minit sèlman."],
    ["guide.door.t", "The door and your password", "La porte et votre mot de passe", "Pòt la ak modpas ou"],
    ["guide.door.b", "The door is the first page. The owner's password opens the books.\nThe store locks itself after the minutes you choose in Settings, and when you press Lock now. A sale in progress is kept while it is locked.\nAfter five wrong passwords, the door asks you to wait a little before trying again.", "La porte est la première page. Le mot de passe du propriétaire ouvre les livres.\nLe magasin se verrouille après les minutes choisies dans les Réglages, et quand vous appuyez sur Verrouiller. Une vente en cours est gardée.\nAprès cinq mots de passe erronés, la porte demande d'attendre un peu.", "Pòt la se premye paj la. Modpas mèt la louvri liv yo.\nMagazen an fèmen pou kont li apre kantite minit ou chwazi nan Reglaj, epi lè w peze Fèmen kounye a. Vant k ap fèt la rete.\nApre senk move modpas, pòt la mande w tann yon ti moman."],
    ["guide.door.tip", "Lock the store whenever you step away from the counter.", "Verrouillez le magasin chaque fois que vous quittez le comptoir.", "Fèmen magazen an chak fwa w kite kontwa a."],
    ["guide.master.t", "The Master Key", "La Clé maîtresse", "Kle Mèt la"],
    ["guide.master.b", "The Master Key is a code of 52 characters shown once, when the store is set up. It opens the books if the password is forgotten, and lets you choose a new password.\nKeep the printed card in a safe, away from the store's computers. Anyone who holds it can open the books.\nYou can make a new Master Key in Settings. The old card stops working once the new key is confirmed.", "La Clé maîtresse est un code de 52 caractères affiché une seule fois, à la configuration. Elle ouvre les livres si le mot de passe est oublié et permet d'en choisir un nouveau.\nGardez la carte imprimée dans un coffre, loin des ordinateurs du magasin. Quiconque la détient peut ouvrir les livres.\nVous pouvez créer une nouvelle Clé maîtresse dans les Réglages. L'ancienne carte cesse de fonctionner dès que la nouvelle est confirmée.", "Kle Mèt la se yon kòd 52 karaktè ki parèt yon sèl fwa, lè yo prepare magazen an. Li louvri liv yo si yo bliye modpas la, epi li pèmèt ou chwazi yon nouvo modpas.\nKenbe kat enprime a nan yon kòf, lwen òdinatè magazen an. Nenpòt moun ki gen l ka louvri liv yo.\nOu ka fè yon nouvo Kle Mèt nan Reglaj. Ansyen kat la sispann mache depi nouvo kle a konfime."],
    ["guide.master.tip", "Never keep the Master Key on a phone or a computer.", "Ne gardez jamais la Clé maîtresse sur un téléphone ou un ordinateur.", "Pa janm kenbe Kle Mèt la nan yon telefòn oswa yon òdinatè."],
    ["guide.sale.t", "Ringing up a sale", "Enregistrer une vente", "Fè yon vant"],
    ["guide.sale.b", "Open the Register. Scan a barcode, or type part of a name and choose the item. Each press adds one more.\nChange a quantity with the minus and plus keys, or type it. The cross removes a line.\nPress Take cash. Type the cash received, or press a quick amount. Emporium shows the change to give. Complete the sale, then print the receipt if the customer wants one.", "Ouvrez la Caisse. Scannez un code-barres, ou tapez une partie du nom et choisissez l'article. Chaque appui en ajoute un.\nChangez une quantité avec les touches moins et plus, ou tapez-la. La croix retire une ligne.\nAppuyez sur Encaisser en espèces. Tapez la somme reçue, ou un montant rapide. Emporium affiche la monnaie à rendre. Terminez la vente, puis imprimez le reçu si le client le souhaite.", "Louvri Kès la. Eskane yon kòd ba, oswa tape yon pati nan non an epi chwazi atik la. Chak fwa w peze, li ajoute youn.\nChanje kantite a ak bouton mwens ak plis, oswa tape l. Kwa a retire yon liy.\nPeze Pran lajan kach. Tape lajan ou resevwa a, oswa peze yon kantite rapid. Emporium montre monnen pou remèt la. Fini vant lan, epi enprime resi a si kliyan an vle l."],
    ["guide.sale.tip", "With a barcode scanner, keep the search box selected: each scan adds the item.", "Avec un lecteur de code-barres, gardez la recherche sélectionnée : chaque lecture ajoute l'article.", "Ak yon eskanè kòd ba, kite bwat rechèch la seleksyone: chak eskanè ajoute atik la."],
    ["guide.items.t", "Adding items", "Ajouter des articles", "Ajoute atik"],
    ["guide.items.b", "In Inventory, press Add an item. Give it a name, a category and a price. The cost is what you paid for one. It is needed to work out profit.\nA barcode lets the scanner find the item. The reorder level puts the item on the low stock list when it falls that low.\nUse Save and add another to enter many items quickly.", "Dans l'Inventaire, appuyez sur Ajouter un article. Donnez un nom, une catégorie et un prix. Le coût est ce que vous avez payé pour un article. Il sert à calculer le bénéfice.\nUn code-barres permet au lecteur de trouver l'article. Le seuil de commande place l'article dans le stock bas quand il descend jusque-là.\nUtilisez Enregistrer et en ajouter un autre pour saisir vite beaucoup d'articles.", "Nan Envantè, peze Ajoute yon atik. Ba l yon non, yon kategori ak yon pri. Pri achte a se sa ou peye pou youn. Li nesesè pou kalkile benefis.\nYon kòd ba pèmèt eskanè a jwenn atik la. Nivo pou kòmande a mete atik la nan stòk ki ba lè li desann rive la.\nSèvi ak Anrejistre epi ajoute yon lòt pou antre anpil atik vit."],
    ["guide.items.tip", "Enter the cost for every item. Without it, the profit of that item is not counted.", "Saisissez le coût de chaque article. Sans lui, le bénéfice de l'article n'est pas compté.", "Mete pri achte pou chak atik. San li, benefis atik sa a pa konte."],
    ["guide.receive.t", "Receiving stock", "Recevoir du stock", "Resevwa stòk"],
    ["guide.receive.b", "When a delivery arrives, open the item and press Receive stock. Type how many arrived and what each one cost.\nEmporium keeps the average cost of what is on the shelf, so profit stays right when prices change.\nThe supplier and the invoice number help later, when you check a delivery.", "À l'arrivée d'une livraison, ouvrez l'article et appuyez sur Recevoir du stock. Tapez combien sont arrivés et le coût de chacun.\nEmporium garde le coût moyen de ce qui est en rayon, pour que le bénéfice reste juste quand les prix changent.\nLe fournisseur et le numéro de facture aident plus tard, pour vérifier une livraison.", "Lè yon livrezon rive, louvri atik la epi peze Resevwa machandiz. Tape konbyen ki rive ak pri achte chak.\nEmporium kenbe pri mwayen sa ki sou etajè a, pou benefis la rete jis lè pri yo chanje.\nFounisè a ak nimewo fakti a ede pita, lè w ap verifye yon livrezon."],
    ["guide.receive.tip", "Receive stock on the day it arrives, so the books always match the shelves.", "Recevez le stock le jour de son arrivée, pour que les livres correspondent toujours aux rayons.", "Resevwa stòk la jou li rive a, pou liv yo toujou menm ak etajè yo."],
    ["guide.correct.t", "Correcting stock", "Corriger le stock", "Korije stòk"],
    ["guide.correct.b", "When the shelf and the books disagree, open the item and press Correct the stock. Choose to remove or to add, how many, and the reason.\nEvery correction stays in the item's history with the person, the time and the reason. Removals are counted as losses in the reports.\nNothing is ever deleted: a mistake is put right by a new correction.", "Quand le rayon et les livres ne concordent pas, ouvrez l'article et appuyez sur Corriger le stock. Choisissez retirer ou ajouter, la quantité et la raison.\nChaque correction reste dans l'historique avec la personne, l'heure et la raison. Les retraits comptent comme pertes dans les rapports.\nRien n'est jamais effacé : une erreur se corrige par une nouvelle correction.", "Lè etajè a ak liv yo pa dakò, louvri atik la epi peze Korije stòk la. Chwazi retire oswa ajoute, konbyen, ak rezon an.\nChak koreksyon rete nan istwa atik la ak moun nan, lè a ak rezon an. Sa yo retire konte kòm pèt nan rapò yo.\nAnyen pa janm efase: yon erè korije ak yon nouvo koreksyon."],
    ["guide.correct.tip", "Count a few shelves every week. Small differences found early are easy to explain.", "Comptez quelques rayons chaque semaine. Les petits écarts trouvés tôt s'expliquent facilement.", "Konte kèk etajè chak semèn. Ti diferans ou jwenn bonè fasil pou eksplike."],
    ["guide.reports.t", "Reading the reports", "Lire les rapports", "Li rapò yo"],
    ["guide.reports.b", "Choose a period: today, this week, this month, or any dates. Emporium works out the sales, the tax collected, the cost of what was sold and the gross profit.\nThe tables show the best sellers, the categories, the busy hours, the items that are not selling, and the losses.\nThe CSV keys save files for your accountant. The line at the foot names the build and the last ledger line used.", "Choisissez une période : aujourd'hui, cette semaine, ce mois, ou des dates précises. Emporium calcule les ventes, la taxe perçue, le coût des articles vendus et le bénéfice brut.\nLes tableaux montrent les meilleures ventes, les catégories, les heures chargées, les articles qui ne se vendent pas et les pertes.\nLes touches CSV enregistrent des fichiers pour votre comptable. La ligne du bas indique le build et la dernière ligne du registre utilisée.", "Chwazi yon peryòd: jodi a, semèn sa a, mwa sa a, oswa nenpòt dat. Emporium kalkile vant yo, taks ou ranmase, pri achte sa ki vann ak benefis brit la.\nTablo yo montre sa ki vann plis, kategori yo, lè ki gen plis moun, atik ki pa vann ak pèt yo.\nBouton CSV yo anrejistre fichye pou kontab ou. Liy anba a bay build la ak dènye liy rejis la yo itilize."],
    ["guide.reports.tip", "Look at the items that are not selling once a month. They hold money that could buy what does sell.", "Regardez une fois par mois les articles qui ne se vendent pas. Ils immobilisent de l'argent qui pourrait acheter ce qui se vend.", "Gade atik ki pa vann yo yon fwa pa mwa. Yo kenbe lajan ki ta ka achte sa ki vann."],
    ["guide.backup.t", "Backups", "Sauvegardes", "Kopi sekirite"],
    ["guide.backup.b", "In Settings, Save a backup now writes one sealed file with all the books. It opens only with the password or the Master Key that were valid that day.\nKeep backups on a USB key, and another copy outside the store. A backup can bring the store back on a new computer.\nRestoring checks every line of the backup before anything on the device is replaced.", "Dans les Réglages, Sauvegarder maintenant écrit un fichier scellé avec tous les livres. Il ne s'ouvre qu'avec le mot de passe ou la Clé maîtresse valables ce jour-là.\nGardez les sauvegardes sur une clé USB, et une autre copie hors du magasin. Une sauvegarde peut ramener le magasin sur un nouvel ordinateur.\nLa restauration vérifie chaque ligne avant de remplacer quoi que ce soit.", "Nan Reglaj, Fè yon kopi kounye a ekri yon fichye sele ak tout liv yo. Li louvri sèlman ak modpas la oswa Kle Mèt ki te bon jou sa a.\nKenbe kopi sou yon kle USB, ak yon lòt kopi andeyò magazen an. Yon kopi ka remete magazen an sou yon nouvo òdinatè.\nLè w ap remete l, Emporium verifye chak liy anvan li ranplase anyen."],
    ["guide.backup.tip", "Save a backup at closing time, every day.", "Faites une sauvegarde à la fermeture, chaque jour.", "Fè yon kopi lè w ap fèmen, chak jou."],
    ["guide.sealed.t", "What is sealed", "Ce qui est scellé", "Sa ki sele"],
    ["guide.sealed.b", "Every item, price, cost, stock figure, sale, receipt, setting and ledger line is sealed with the store's key, which only your password or the Master Key can open.\nNot sealed: the store's name shown at the door, the build number, and the technical facts needed to open the seal.\nThere is no Emporium server. Your books stay on your devices.", "Chaque article, prix, coût, stock, vente, reçu, réglage et ligne du registre est scellé avec la clé du magasin, que seuls votre mot de passe ou la Clé maîtresse peuvent ouvrir.\nNon scellés : le nom du magasin affiché à la porte, le numéro de build et les données techniques nécessaires pour ouvrir le sceau.\nIl n'y a pas de serveur Emporium. Vos livres restent sur vos appareils.", "Chak atik, pri, pri achte, stòk, vant, resi, reglaj ak liy rejis sele ak kle magazen an, epi se sèlman modpas ou oswa Kle Mèt la ki ka louvri l.\nSa ki pa sele: non magazen an ki parèt sou pòt la, nimewo build la, ak enfòmasyon teknik ki nesesè pou louvri sele a.\nPa gen sèvè Emporium. Liv ou yo rete sou aparèy ou yo."],
    ["guide.sealed.tip", "Choose a long password. It is the lock on everything.", "Choisissez un mot de passe long. C'est la serrure de tout.", "Chwazi yon modpas ki long. Se li ki kadna tout bagay."],
    ["guide.verify.t", "Verifying the books", "Vérifier les livres", "Verifye liv yo"],
    ["guide.verify.b", "Every change is one line in the ledger, and each line carries the fingerprint of the line before it. Changing an old line would break the chain.\nIn Settings, Verify the books reads every line, checks every fingerprint, and works out each stock figure again from the start.\nIf a problem is found, save a backup and ask for help before changing anything.", "Chaque changement est une ligne du registre, et chaque ligne porte l'empreinte de la précédente. Modifier une ancienne ligne romprait la chaîne.\nDans les Réglages, Vérifier les livres lit chaque ligne, contrôle chaque empreinte et recalcule chaque stock depuis le début.\nSi un problème apparaît, faites une sauvegarde et demandez de l'aide avant de changer quoi que ce soit.", "Chak chanjman se yon liy nan rejis la, e chak liy pote anprent liy anvan l. Si yo chanje yon ansyen liy, chèn nan ta kase.\nNan Reglaj, Verifye liv yo li chak liy, tcheke chak anprent, epi refè kalkil chak stòk depi nan kòmansman.\nSi gen yon pwoblèm, fè yon kopi epi mande èd anvan w chanje anyen."],
    ["guide.verify.tip", "Verify the books once a week, and before an audit.", "Vérifiez les livres une fois par semaine, et avant un audit.", "Verifye liv yo yon fwa pa semèn, ak anvan yon odit."],
    ["guide.display.t", "Language and display", "Langue et affichage", "Lang ak afichaj"],
    ["guide.display.b", "Emporium speaks English, French and Kreyòl. Change the language at the door or in Settings, at any time.\nDay, Night and Auto change the light of every page at once. Auto follows the device.\nIn Settings you can make the text larger, and turn on Calm mode: no motion, quieter colours and larger keys.", "Emporium parle anglais, français et kreyòl. Changez de langue à la porte ou dans les Réglages, à tout moment.\nJour, Nuit et Auto changent la lumière de toutes les pages à la fois. Auto suit l'appareil.\nDans les Réglages, vous pouvez agrandir le texte et activer le mode calme : sans animation, couleurs plus douces, touches plus grandes.", "Emporium pale angle, franse ak kreyòl. Chanje lang lan sou pòt la oswa nan Reglaj, nenpòt lè.\nJou, Lannwit ak Otomatik chanje limyè tout paj yo an menm tan. Otomatik swiv aparèy la.\nNan Reglaj ou ka fè tèks la pi gwo, epi limen Mòd kalm: san mouvman, koulè pi dous ak bouton pi gwo."],
    ["guide.display.tip", "Each person at the register can choose the language they read best.", "Chaque personne à la caisse peut choisir la langue qu'elle lit le mieux.", "Chak moun nan kès la ka chwazi lang li li pi byen."],
    ["guide.build.t", "Which build am I running", "Quel build est-ce que j'utilise", "Ki build m ap itilize"],
    ["guide.build.b", "Every version of Emporium has a build number. It is on the door, in the menu, in About, on every receipt and at the foot of every report.\nEach release on GitHub lists the fingerprint of every file, so you can check that a download is exactly what was built.", "Chaque version d'Emporium a un numéro de build. Il figure sur la porte, dans le menu, dans À propos, sur chaque reçu et au bas de chaque rapport.\nChaque publication sur GitHub indique l'empreinte de chaque fichier, pour vérifier qu'un téléchargement est exactement ce qui a été construit.", "Chak vèsyon Emporium gen yon nimewo build. Li sou pòt la, nan meni an, nan Konsènan, sou chak resi ak anba chak rapò.\nChak piblikasyon sou GitHub bay anprent chak fichye, pou w ka verifye sa w telechaje a se egzakteman sa ki te konstwi a."],
    ["guide.build.tip", "When you report a problem, give the build number.", "Quand vous signalez un problème, donnez le numéro de build.", "Lè w ap rapòte yon pwoblèm, bay nimewo build la."],
    ["guide.limits.t", "What Emporium does not do", "Ce qu'Emporium ne fait pas", "Sa Emporium pa fè"],
    ["guide.limits.b", "Emporium does not file taxes, move money, or replace the systems of RIA, CAM, Unitransfer or Boss Revolution. It keeps the store's own records.\nWhile the store is open, anyone at the device can see the screen. Lock it when you step away.\nNo program is proof against every attack. Keep the computer up to date, and do not install unknown programs on it.", "Emporium ne déclare pas les impôts, ne transfère pas d'argent et ne remplace pas les systèmes de RIA, CAM, Unitransfer ou Boss Revolution. Il tient les registres du magasin.\nQuand le magasin est ouvert, toute personne devant l'appareil voit l'écran. Verrouillez-le quand vous vous éloignez.\nAucun programme n'est à l'abri de toutes les attaques. Tenez l'ordinateur à jour et n'y installez pas de programmes inconnus.", "Emporium pa deklare taks, li pa voye lajan, li pa ranplase sistèm RIA, CAM, Unitransfer oswa Boss Revolution. Li kenbe dosye magazen an.\nLè magazen an louvri, nenpòt moun devan aparèy la ka wè ekran an. Fèmen l lè w ap deplase.\nPa gen pwogram ki pwoteje kont tout atak. Kenbe òdinatè a ajou, epi pa enstale pwogram ou pa konnen sou li."],
    ["guide.limits.tip", "Ask your accountant to read the first month's reports with you.", "Demandez à votre comptable de lire avec vous les rapports du premier mois.", "Mande kontab ou li rapò premye mwa a avè w."],

    var cur = ui.input({ type: "password", id: "cpCur", autocomplete: "current-password" }), p1 = ui.input({ type: "password", id: "cpNew1", autocomplete: "new-password" }), p2 = ui.input({ type: "password", id: "cpNew2", autocomplete: "new-password" });
    ui.dialog({ title: t("set.changePw"), focus: "#cpCur", body: [ui.field("set.currentPw", cur, { required: true }), ui.field("setup.password", p1, { required: true, tip: "tip.password" }), ui.field("setup.password2", p2, { required: true })],
      actions: [{ label: t("cancel") }, { label: t("save"), kind: "primary", id: "cpSave", onClick: function (close, btn) {
        var a = C.passwordAdvice(p1.value);
        if (!cur.value) { ui.fieldError(cur, t("door.needPassword")); return false; }
        if (!a.ok) { ui.fieldError(p1, t(a.key)); return false; }
        if (p1.value !== p2.value) { ui.fieldError(p2, t("setup.noMatch")); return false; }
        btn.disabled = true;
        B.changePassword(cur.value, p1.value).then(function () { close(); ui.toast(t("set.pwChanged"), "good"); }, function (e) {
          btn.disabled = false; if (e && e.code === "wrong") ui.fieldError(cur, t("door.wrong")); else { ui.toast(t("door.problem"), "bad"); console.error(e); }
        });
        return false;
      } }] });
  }
  function newMaster() {
    var cur = ui.input({ type: "password", id: "nmPw", autocomplete: "current-password" });
    ui.dialog({ title: t("set.newMaster"), focus: "#nmPw", body: [h("p", null, t("set.newMasterP")), ui.field("set.currentPw", cur, { required: true })],
      actions: [{ label: t("cancel") }, { label: t("next"), kind: "primary", id: "nmNext", onClick: function (close, btn) {
        if (!cur.value) { ui.fieldError(cur, t("door.needPassword")); return false; }
        btn.disabled = true;
        B.prepareNewMaster(cur.value).then(function (prep) { cur.value = ""; close(); showNewMaster(prep); }, function (e) {
          btn.disabled = false; if (e && e.code === "wrong") ui.fieldError(cur, t("door.wrong")); else { ui.toast(t("door.problem"), "bad"); console.error(e); }
        });
        return false;
      } }] });
  }
  function showNewMaster(prep) {
    var groups = C.groups(prep.code), a = 1 + Math.floor(Math.random() * 6), b = 7 + Math.floor(Math.random() * 6);
    var ga = ui.input({ id: "nmA", maxlength: "4", class: "mono" }), gb = ui.input({ id: "nmB", maxlength: "4", class: "mono" });

      h("p.hint", null, t("set.newMasterConfirm")), h("div.pair", null, [ui.field(t("setup.group", { n: a }), ga), ui.field(t("setup.group", { n: b }), gb)])],
      actions: [{ label: t("set.newMasterCancel"), onClick: function (close) { close(); ui.toast(t("set.newMasterKept"), "good"); } },
        { label: t("setup.print"), icon: "print", onClick: function () { E.door.printMaster(prep.code, B.state().settings.storeName); return false; } },
        { label: t("set.newMasterSave"), kind: "primary", id: "nmSave", onClick: function (close, btn) {
          if (C.cleanMasterText(ga.value) !== groups[a - 1]) { ui.fieldError(ga, t("setup.groupWrong")); return false; }
          if (C.cleanMasterText(gb.value) !== groups[b - 1]) { ui.fieldError(gb, t("setup.groupWrong")); return false; }
          btn.disabled = true;
          prep.finish().then(function () { close(); ui.toast(t("set.newMasterDone"), "good"); }, function (e) { btn.disabled = false; ui.toast(t("door.problem"), "bad"); console.error(e); });
          return false;
        } }] });
  }
  function erase() {
    var st = B.state(), pw = ui.input({ type: "password", id: "erPw", autocomplete: "current-password" }), nm = ui.input({ id: "erName" });
    ui.dialog({ title: t("set.erase"), alert: true, focus: "#erPw", body: [h("p", null, t("set.eraseWarn")), ui.field("set.currentPw", pw, { required: true }), ui.field(t("set.eraseType", { name: st.settings.storeName }), nm, { required: true })],
      actions: [{ label: t("cancel") }, { label: t("set.eraseKey"), kind: "danger", id: "erGo", onClick: function (close, btn) {
        if (nm.value.trim() !== st.settings.storeName) { ui.fieldError(nm, t("set.eraseNameWrong")); return false; }
        btn.disabled = true;
        B.erase(pw.value).then(function () { close(); }, function (e) { btn.disabled = false; if (e && e.code === "wrong") ui.fieldError(pw, t("door.wrong")); else { ui.toast(t("door.problem"), "bad"); console.error(e); } });
        return false;

  /* ---------- the Guidebook ---------- */
  var ARTICLES = ["start", "door", "master", "sale", "items", "receive", "correct", "reports", "backup", "sealed", "verify", "display", "build", "limits"];
  var ART_EMO = { start: "🌟", door: "🚪", master: "🗝️", sale: "🛒", items: "🏷️", receive: "🚚", correct: "✏️", reports: "📊", backup: "💾", sealed: "🔐", verify: "🛡️", display: "🎨", build: "🔢", limits: "🧭" };
  ui.rooms.guide = function (main) {
    var q = ui.input({ id: "guideSearch", type: "search", placeholder: t("guide.searchPh"), "aria-label": t("guide.search") });
    var list = h("ul.guide-list", { id: "guideList" }), art = h("article.guide-article.card", { id: "guideArticle", tabindex: "-1" });
    main.appendChild(ui.roomHead("room.guide", null));
    main.appendChild(h("div.guide", null, [h("div.guide-side", null, [h("div.search-row", null, [U.icon("search"), q]), list]), art]));
    function show(id) {
      U.clear(art);
      var paras = t("guide." + id + ".b").split("\n");
      art.appendChild(h("h2", null, [ui.emo(ART_EMO[id]), t("guide." + id + ".t")]));
      paras.forEach(function (p) { art.appendChild(h("p", null, p)); });
      art.appendChild(h("div.tip-box", null, [ui.emo("💡"), h("p", null, [h("strong", null, t("tip") + ": "), t("guide." + id + ".tip")])]));
      var ra = ui.readAloud(t("guide." + id + ".t") + ". " + paras.join(" ") + " " + t("guide." + id + ".tip")); if (ra) art.appendChild(ra);
      Array.prototype.forEach.call(list.querySelectorAll("button"), function (b) { if (b.getAttribute("data-a") === id) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); });
    }
    function draw() {
      U.clear(list);
      var n = U.norm(q.value), first = null;
      ARTICLES.forEach(function (id) {
        var hay = U.norm(t("guide." + id + ".t") + " " + t("guide." + id + ".b") + " " + t("guide." + id + ".tip"));
        if (n && hay.indexOf(n) < 0) return;
        if (!first) first = id;
        list.appendChild(h("li", null, h("button.guide-key", { type: "button", "data-a": id, onclick: function () { show(id); art.focus(); } }, [ui.emo(ART_EMO[id]), t("guide." + id + ".t")])));
      });
      if (!first) list.appendChild(h("li.muted", null, t("guide.none")));
      return first;
    }
    q.addEventListener("input", U.debounce(function () { var f = draw(); if (f) show(f); }, 120));
    show(draw() || "start");
  };
})();

  E.app = {
    opened: function (fresh) {
      ui.applyLook(); ui.shell();
