/* EMPORIUM | Copyright (c) 2026 Yannie D. Forest. All rights reserved. NO LICENCE IS GRANTED. See LICENCE.txt.
   Emporium's dress: one family of colours. By day, lavender mist, white and a deep indigo (between Carpe Diem's blue
   and Ingenium's purple), with brass from Inkwell for rims and small accents; every pastel is a tint of the indigo or of
   parchment. By night, a midnight library: ink-dark surfaces with an indigo cast, parchment ink, brass keys. Keys are
   compact raised pills at the Forge's scale; cards stand in soft relief; motion is gentle and stops in Calm mode. */
:root {
  --bg: #F3F2F8; --bg-wash: #E9E6F4;
  --surface: #FFFFFF; --surface-2: #FAF9FD; --tray: #EEECF6;
  --tint: #F2F0FA; --tint-2: #E6E3F5; --parch: #FBF8F1; --parch-2: #F2EADB;
  --ink: #1D2033; --ink-2: #464A63; --muted: #646780;
  --pri: #3F4797; --pri-hi: #4D56AA; --pri-lo: #353C82; --on-pri: #FFFFFF; --pri-text: #3A428E; --pri-soft: rgba(63, 71, 151, .08); --pri-ring: rgba(63, 71, 151, .24);
  --brass: #A8864E; --brass-hi: #E3CFA2; --brass-ink: #775C2A; --brass-soft: rgba(168, 134, 78, .14);
  --danger: #B3262D; --danger-soft: rgba(179, 38, 45, .08); --warn: #8C5E10; --warn-soft: rgba(201, 140, 40, .14);
  --line: rgba(45, 50, 110, .10); --line-2: rgba(45, 50, 110, .18); --rim: rgba(63, 71, 151, .26);
  --face: linear-gradient(180deg, #FFFFFF 0%, #F6F5FB 100%);
  --relief: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1.5px 0 rgba(30, 34, 80, .07), 0 1px 0 rgba(30, 34, 80, .17), 0 2px 4px rgba(30, 34, 80, .08), 0 6px 12px rgba(30, 34, 80, .06);
  --relief-hi: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1.5px 0 rgba(30, 34, 80, .07), 0 2px 0 rgba(30, 34, 80, .17), 0 5px 9px rgba(30, 34, 80, .10), 0 12px 20px rgba(30, 34, 80, .07);
  --relief-down: inset 0 2px 4px rgba(30, 34, 80, .16), inset 0 -1px 0 rgba(255, 255, 255, .6), 0 1px 0 rgba(30, 34, 80, .10);
  --card: inset 0 1px 0 rgba(255, 255, 255, .9), 0 1px 0 rgba(30, 34, 80, .06), 0 4px 12px rgba(30, 34, 80, .05), 0 14px 30px rgba(30, 34, 80, .05);
  --card-hi: inset 0 1px 0 rgba(255, 255, 255, .95), 0 2px 0 rgba(30, 34, 80, .07), 0 10px 22px rgba(30, 34, 80, .09), 0 24px 44px rgba(30, 34, 80, .06);
  --inset: inset 0 1.5px 3px rgba(30, 34, 80, .08);
  --radius: 16px; --radius-s: 10px; --key-h: 36px;
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", "Iowan Old Style", Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, "Roboto Mono", monospace;
  --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
:root[data-theme="night"] {
  --bg: #101119; --bg-wash: #171A2A;
  --surface: #181A26; --surface-2: #1C1F2D; --tray: #13151E;
  --tint: #1E2134; --tint-2: #262A42; --parch: #1D1B22; --parch-2: #26222A;
  --ink: #ECE6D6; --ink-2: #CCC6B8; --muted: #9F9AAE;
  --pri: #CDAA68; --pri-hi: #DDBE80; --pri-lo: #B08E50; --on-pri: #1B1A14; --pri-text: #DCC08A; --pri-soft: rgba(205, 170, 104, .10); --pri-ring: rgba(205, 170, 104, .30);
  --brass: #B89A63; --brass-hi: #E2CC9C; --brass-ink: #DCC08A; --brass-soft: rgba(205, 170, 104, .12);
  --danger: #F0928A; --danger-soft: rgba(240, 146, 138, .12); --warn: #E2B65E; --warn-soft: rgba(226, 182, 94, .12);
  --line: rgba(214, 191, 140, .10); --line-2: rgba(214, 191, 140, .19); --rim: rgba(205, 170, 104, .36);
  --face: linear-gradient(180deg, #23263A 0%, #1C1F2F 100%);
  --relief: inset 0 1px 0 rgba(255, 245, 220, .06), inset 0 -1.5px 0 rgba(0, 0, 0, .4), 0 1px 0 rgba(0, 0, 0, .7), 0 3px 5px rgba(0, 0, 0, .45), 0 8px 14px rgba(0, 0, 0, .3);
  --relief-hi: inset 0 1px 0 rgba(255, 245, 220, .08), inset 0 -1.5px 0 rgba(0, 0, 0, .4), 0 2px 0 rgba(0, 0, 0, .7), 0 6px 10px rgba(0, 0, 0, .45), 0 14px 24px rgba(0, 0, 0, .32);
  --relief-down: inset 0 2px 6px rgba(0, 0, 0, .55), inset 0 -1px 0 rgba(255, 245, 220, .04), 0 1px 0 rgba(0, 0, 0, .4);
  --card: inset 0 1px 0 rgba(255, 245, 220, .04), 0 1px 0 rgba(0, 0, 0, .55), 0 6px 16px rgba(0, 0, 0, .35), 0 18px 34px rgba(0, 0, 0, .25);
  --card-hi: inset 0 1px 0 rgba(255, 245, 220, .06), 0 2px 0 rgba(0, 0, 0, .6), 0 12px 24px rgba(0, 0, 0, .45), 0 26px 44px rgba(0, 0, 0, .3);
  --inset: inset 0 2px 4px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
:root[data-size="l"] { font-size: 18px; }
:root[data-size="xl"] { font-size: 20px; }
:root[data-calm="1"] { --key-h: 42px; }
:root[data-calm="1"] *, :root[data-calm="1"] *::before, :root[data-calm="1"] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media (pointer: coarse) { :root { --key-h: 42px; } }

* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 400 .97rem/1.55 var(--sans); background: radial-gradient(1200px 640px at 0% -10%, var(--bg-wash), transparent 62%), var(--bg); background-attachment: fixed; }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.85rem; letter-spacing: .005em; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: .35rem 0; }
a { color: var(--pri-text); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 8px; }
.ico { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
.emo { font-family: var(--emoji); font-style: normal; font-weight: 400; line-height: 1; display: inline-block; flex: none; }
.mono { font-family: var(--mono); letter-spacing: .06em; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .86rem; margin: .2rem 0 0; }
.small { font-size: .85rem; }
.hidden { display: none !important; }
.req { color: var(--danger); }
.label-caps { font: 700 1rem/1.3 var(--serif); color: var(--ink); display: flex; align-items: center; gap: .45rem; margin: 0 0 .55rem; }
.label-caps .emo { font-size: 1rem; }

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pup { 0% { opacity: 0; transform: translateY(12px) scale(.97); } 60% { opacity: 1; transform: translateY(-2px) scale(1.005); } 100% { transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0% { transform: scale(1); } 35% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0) scale(1); } to { opacity: 0; transform: translate(-50%, -44px) scale(1.25); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes shine { 0% { transform: translateX(-130%) rotate(25deg); } 55%, 100% { transform: translateX(260%) rotate(25deg); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg) scale(1.06); } 75% { transform: rotate(8deg) scale(1.06); } }
@keyframes fall { 0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(0deg); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate3d(var(--dx, 0), 105vh, 0) rotate(var(--rot, 360deg)); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
#room > * { animation: rise .4s var(--ease) both; }
#room > *:nth-child(2) { animation-delay: .03s; } #room > *:nth-child(3) { animation-delay: .06s; } #room > *:nth-child(4) { animation-delay: .09s; }
#room > *:nth-child(5) { animation-delay: .12s; } #room > *:nth-child(n+6) { animation-delay: .15s; }

/* ---------- keys: compact raised pills ---------- */
.key { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .45em; height: var(--key-h); padding: 0 14px; white-space: nowrap;
  border-radius: 999px; border: 1px solid var(--rim); background: var(--face); color: var(--pri-text); font: 600 .875rem/1 var(--sans); cursor: pointer;
  box-shadow: var(--relief); transition: transform .12s var(--ease), box-shadow .12s var(--ease), filter .15s; }
.key:hover { transform: translateY(-1px); box-shadow: var(--relief-hi); }
.key:hover .emo { animation: wiggle .45s ease; }
.key:active { transform: translateY(1px); box-shadow: var(--relief-down); }
.key:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: var(--relief-down); }
.key.primary { background: linear-gradient(180deg, var(--pri-hi), var(--pri) 55%, var(--pri-lo)); color: var(--on-pri); border-color: transparent; }
:root[data-theme="night"] .key.primary { border-color: rgba(120, 90, 40, .6); }
.key.danger { color: var(--danger); border-color: var(--danger); }
.key.lg { height: 44px; padding: 0 20px; font-size: .95rem; }
.key.sm { height: 30px; padding: 0 11px; font-size: .8rem; }
.key .emo { font-size: 1.05rem; }
.key.lg .emo { font-size: 1.15rem; }
.icon-key { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--rim);
  background: var(--face); color: var(--ink-2); cursor: pointer; flex: none; box-shadow: var(--relief); transition: transform .12s var(--ease), box-shadow .12s; padding: 0; }
.icon-key:hover { transform: translateY(-1px); box-shadow: var(--relief-hi); }
.icon-key:active { transform: translateY(1px); box-shadow: var(--relief-down); }
.icon-key.danger { color: var(--danger); }
.icon-key .ico { width: 16px; height: 16px; }
.link { background: none; border: 0; padding: .2rem 0; color: var(--pri-text); font: 600 .9rem var(--sans); cursor: pointer; display: inline-flex; gap: .4em; align-items: center; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }

  font: 600 .82rem/1 var(--sans); cursor: pointer; box-shadow: var(--relief); display: inline-flex; gap: .4em; align-items: center; white-space: nowrap; transition: transform .12s var(--ease), box-shadow .12s; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: .28rem; margin: .6rem 0; min-width: 0; }

  font: .95rem/1.4 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-s);
  padding: .5rem .75rem; min-height: 40px; width: 100%; box-shadow: var(--inset); transition: border-color .15s, box-shadow .15s; }

.inline { display: flex; align-items: flex-end; gap: .7rem; flex-wrap: wrap; }
.inline .field { flex: 1 1 240px; margin: 0; }
.search-row { display: flex; align-items: center; gap: .5rem; background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px; padding: 0 .4rem 0 .9rem; color: var(--muted); box-shadow: var(--inset); }

.search-row input { border: 0; background: transparent !important; outline: none; min-height: 42px; padding-left: .1rem; font-size: .98rem; box-shadow: none !important; }
.search-row:focus-within { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-soft); }

/* ---------- the door ---------- */
.door { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right)) 18px max(16px, env(safe-area-inset-left));
  background: radial-gradient(900px 560px at 50% -10%, var(--bg-wash), transparent 64%), var(--bg); }

  box-shadow: 0 2px 4px rgba(30, 34, 80, .07), 0 12px 24px rgba(30, 34, 80, .06), 0 30px 60px rgba(30, 34, 80, .08), 0 60px 120px rgba(30, 34, 80, .10), inset 0 1px 0 #FFFFFF;
  padding: 32px 38px 26px; text-align: center; animation: pup .55s var(--ease) both; }

.seal-ring { display: inline-flex; border-radius: 50%; outline: 1.5px solid var(--brass); outline-offset: 5px; margin: 6px 0 4px; }
.seal-wrap { position: relative; display: inline-block; border-radius: 50%; overflow: hidden; animation: bob 6s ease-in-out infinite; filter: drop-shadow(0 8px 12px rgba(30, 34, 80, .25)); line-height: 0; }
.seal-wrap::after { content: ""; position: absolute; top: -20%; left: 0; width: 34%; height: 140%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent); animation: shine 6.5s ease-in-out 1.2s infinite; pointer-events: none; }
.brand { font-size: 2.9rem; font-variant: normal; letter-spacing: .02em; line-height: 1; margin-top: .65rem; color: #2C3270; }
:root[data-theme="night"] .brand { color: #E2CF9F; background: linear-gradient(180deg, #F2E4BF 0%, #D9C08A 55%, #B99A5E 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.door-rule { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; }
.door-rule span { width: 52px; height: 1px; background: linear-gradient(90deg, transparent, var(--brass)); }
.door-rule span:last-child { background: linear-gradient(90deg, var(--brass), transparent); }

.door-store { font-family: var(--serif); font-weight: 700; font-size: 1.1rem; margin: .8rem 0 0; }

.door-links { display: flex; flex-direction: column; align-items: center; gap: .1rem; margin-top: .5rem; }

  background: var(--parch); border: 1px dashed var(--brass); border-radius: var(--radius); box-shadow: var(--inset); }

/* ---------- the shell: the side menu after the Forge's own ---------- */
.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }

  color: var(--ink-2); font: 500 .92rem var(--sans); cursor: pointer; text-align: left; transition: color .15s ease, background .15s ease; }

:root[data-fold="1"] .rail-fold { position: static; margin-left: 4px; }

/* ---------- the rooms ---------- */
.page { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: .6rem 1rem; flex-wrap: wrap; padding: 12px clamp(16px, 3vw, 40px) 10px; max-width: 1440px; width: 100%; border-bottom: 1px solid var(--line); }

.store-name { font-family: var(--serif); font-weight: 700; font-size: 1.22rem; line-height: 1.1; color: var(--ink); overflow-wrap: anywhere; }
:root[data-theme="night"] .store-name { color: #E2CF9F; }
.store-sub { font: italic 400 .84rem/1.3 var(--serif); color: var(--brass-ink); margin-top: 1px; }
.more-key { display: none !important; }

.prov-wrap { margin-top: 14px; }
.room-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; padding-bottom: .9rem; border-bottom: 1px solid var(--line); }
.room-title { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; }
.room-title > .emo { font-size: 1.55rem; }
.room-sub { color: var(--muted); margin: .3rem 0 0; font-size: .9rem; flex-basis: 100%; }
.room-tools { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.mast { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; justify-content: flex-end; }
.mast .when { font-size: .8rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; padding: 0 .3rem; }
.kbd-hint { color: var(--muted); font-size: .78rem; }
.card { background: linear-gradient(180deg, var(--surface), var(--surface-2)); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--card); padding: 16px 18px; min-width: 0; }
.card.inset { box-shadow: var(--inset); background: var(--tray); }

.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }

.banner { display: flex; gap: .55rem; align-items: center; background: var(--parch); border: 1px solid var(--brass); color: var(--ink); padding: .6rem .9rem; border-radius: var(--radius-s); font-weight: 600; font-size: .92rem; margin-bottom: 12px; }

/* ---------- the ledger: figures set like a ledger, under small caps labels, between hairlines ---------- */
.ledger { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* ---------- home ---------- */

.proverb { display: flex; gap: 14px; align-items: flex-start; background: linear-gradient(180deg, var(--parch), var(--surface)); border-color: var(--line-2); }

.proverb-ht { font-family: var(--serif); font-style: italic; font-size: 1.12rem; margin: .1rem 0 0; color: var(--ink); }

.steps-list { list-style: none; padding: 0; margin: .2rem 0 0; display: grid; gap: 4px; counter-reset: step; }

.steps-list .tick { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 .72rem var(--sans); color: var(--brass-ink); border: 1px solid var(--brass); background: var(--parch); flex: none; }

.list { list-style: none; padding: 0; margin: 0; }

/* ---------- the register ---------- */
.register { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 390px); gap: 16px; align-items: start; }
.reg-pick { display: flex; flex-direction: column; gap: 10px; }
.products { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-height: calc(100vh - 270px); overflow-y: auto; padding: 3px 3px 8px; }
.product { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); grid-template-rows: auto auto auto; column-gap: 9px; row-gap: 2px; align-items: center; text-align: left;
  padding: 10px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--face); color: var(--ink); cursor: pointer; font: inherit; box-shadow: var(--relief);
  transition: transform .14s var(--ease), box-shadow .14s var(--ease), border-color .15s; }
.product:hover { transform: translateY(-2px); box-shadow: var(--relief-hi); border-color: var(--rim); }
.product:active { transform: translateY(1px); box-shadow: var(--relief-down); }
.product.popped { animation: pop .3s var(--ease); }
.p-emo { grid-row: 1 / span 3; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; background: var(--tint); border: 1px solid var(--line); align-self: start; }
.p-name { font-weight: 600; font-size: .9rem; line-height: 1.25; overflow-wrap: anywhere; }
.p-price { font-family: var(--serif); font-weight: 700; font-size: 1.02rem; color: var(--pri-text); }
.p-stock { font-size: .74rem; color: var(--muted); }
.p-stock.warn { color: var(--warn); font-weight: 600; } .p-stock.bad { color: var(--danger); font-weight: 600; }
.plus-one { position: fixed; z-index: 70; pointer-events: none; font: 800 1.1rem var(--sans); color: var(--pri-text); animation: floatUp .7s var(--ease) forwards; }
.empty { padding: .8rem; font-size: .92rem; }
/* the ticket, as a slip of receipt paper */
.reg-ticket { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--parch); border-color: var(--line-2);
  padding: 18px 18px 16px; border-radius: 6px 6px var(--radius) var(--radius); }
.reg-ticket::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 7px;
  background: radial-gradient(circle at 6px 0, transparent 5px, var(--parch) 5.5px) 0 0 / 12px 7px repeat-x; }
:root[data-theme="night"] .reg-ticket { background: var(--parch); }
.reg-ticket h2 { font-size: 1.05rem; }
.ticket-lines { list-style: none; padding: 0; margin: 0; max-height: calc(100vh - 400px); overflow-y: auto; }
.tline { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px dashed var(--line-2); }
.tline.fresh { animation: slideIn .3s var(--ease); }
.t-main { display: flex; flex-direction: column; min-width: 0; }
.t-name { font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
.t-unit { font-size: .76rem; }
.t-warn { color: var(--warn); font-size: .74rem; display: inline-flex; gap: .3rem; align-items: center; }
.t-qty { display: flex; align-items: center; gap: 3px; }
.t-qty .icon-key { width: 26px; height: 26px; }
.t-qty .icon-key .ico { width: 13px; height: 13px; }
.qty { width: 44px !important; min-height: 28px !important; height: 28px; padding: .1rem !important; text-align: center; font-size: .88rem !important; }
.t-amount { font-weight: 700; font-size: .9rem; min-width: 4.2em; }
.tline .icon-key.danger { width: 26px; height: 26px; }
.totals { border-top: 1px solid var(--line-2); padding-top: 6px; font-size: .9rem; }
.trow { display: flex; justify-content: space-between; padding: 2px 0; color: var(--ink-2); }
.trow.total { font-family: var(--serif); font-size: 1.55rem; font-weight: 700; color: var(--ink); padding-top: 8px; margin-top: 4px; border-top: 2px solid var(--ink); }
.trow.total .num { display: inline-block; }
.trow.total .num.bump { animation: pulse .4s var(--ease); }
.pay-row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 4px; }
.due { display: flex; justify-content: space-between; align-items: baseline; font-size: 1rem; margin: 0 0 .6rem; }
.due strong { font-family: var(--serif); font-size: 2rem; }
.quick-cash { display: flex; flex-wrap: wrap; gap: 6px; }
.money-in { font-size: 1.4rem !important; font-family: var(--serif) !important; text-align: right; min-height: 52px !important; }
.change { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; min-height: 1.5em; margin: .3rem 0 0; }
.change.good { color: var(--pri-text); } .change.bad { color: var(--danger); }
.receipt { font-family: var(--mono); font-size: .86rem; background: #FFFFFF; color: #111111; border: 1px solid #DDDDDD; border-radius: 8px; padding: 14px 16px; max-width: 360px; margin: .6rem auto 0; box-shadow: 0 4px 12px rgba(0, 0, 0, .1); }
.r-head { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; margin-bottom: 8px; }
.receipt table { width: 100%; border-collapse: collapse; }
.receipt td { padding: 2px 0; vertical-align: top; }
.r-totals { border-top: 1px dashed #999999; margin-top: 6px; padding-top: 4px; }
.r-total td { font-weight: 700; font-size: 1rem; }
.r-by, .r-note, .r-thanks, .r-build { text-align: center; margin: .3rem 0; }
.r-build { color: #666666; font-size: .74rem; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
.confetti span { position: absolute; top: -40px; font-family: var(--emoji); font-size: 1.5rem; animation: fall var(--t, 1.8s) cubic-bezier(.25, .6, .4, 1) var(--d, 0s) forwards; }

/* ---------- inventory and reports ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .search-row { flex: 1 1 280px; }
.toolbar select { width: auto; min-width: 190px; min-height: 40px; }
.table-wrap { overflow-x: auto; }
.card.table-wrap { padding: 4px 6px; }
.grid { width: 100%; border-collapse: collapse; font-size: .9rem; }
.grid th { text-align: left; font: 600 .82rem/1.25 var(--sans); color: var(--muted); padding: .7rem .7rem .55rem; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.grid td { padding: .5rem .7rem; border-bottom: 1px solid var(--line); }
.grid tbody tr:last-child td { border-bottom: 0; }
.grid tbody tr { transition: background .12s; }
.grid tbody tr:hover { background: var(--tint); }
.grid.compact td, .grid.compact th { padding: .38rem .6rem; }
.grid th.num, .grid td.num { text-align: right; }
.row-key { all: unset; cursor: pointer; font-weight: 600; color: var(--pri-text); display: inline-flex; gap: .5rem; align-items: center; }
.row-key .emo { font-size: 1rem; }
.row-key span:last-child { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.row-key:hover span:last-child { text-decoration-color: currentColor; }
.row-key:focus-visible { outline: 2px solid var(--brass); }
.inv-foot { margin-top: .5rem; font-size: .86rem; }
.item-top { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: start; }
.big-stock { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px 10px; border-radius: var(--radius); background: var(--tint); border: 1px solid var(--line); color: var(--pri-text); }
.big-stock.warn { background: var(--warn-soft); color: var(--warn); } .big-stock.bad { background: var(--danger-soft); color: var(--danger); }
.big-stock span { font: 600 .84rem/1.2 var(--sans); }
.big-stock .emo { font-size: 1.3rem; }
.big-stock strong { font-family: var(--serif); font-size: 2.3rem; line-height: 1.05; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px; margin: 0; }
.fact dt { color: var(--muted); font: 600 .8rem/1.3 var(--sans); }
.fact dd { margin: .1rem 0 0; overflow-wrap: anywhere; font-size: .92rem; }
.item-keys { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin: 14px 0 4px; }
.history { list-style: none; padding: 0; margin: .4rem 0 0; max-height: 280px; overflow-y: auto; }
.history li { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) auto; gap: 10px; padding: .4rem 0; border-bottom: 1px solid var(--line); font-size: .86rem; }
.period-card { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.custom-range { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.custom-range .field { margin: 0; flex: 0 1 190px; }
.rep-range { margin: 0 0 .7rem; display: flex; gap: .5rem; align-items: center; font-size: 1.15rem; }
.rep-sec { margin-top: 14px; }
.rep-sec .label-caps { margin-bottom: .35rem; }
.bar { display: inline-block; width: 150px; max-width: 30vw; height: 8px; border-radius: 5px; background: var(--tray); vertical-align: middle; box-shadow: var(--inset); overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--pri), var(--pri-hi)); animation: grow .7s var(--ease) both; transform-origin: left; }
:root[data-theme="night"] .bar-fill { background: linear-gradient(90deg, var(--pri-lo), var(--pri-hi)); }
.stamp { color: var(--muted); font-size: .76rem; margin-top: 1rem; font-family: var(--mono); overflow-wrap: anywhere; }
.print-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }

/* ---------- settings and guide ---------- */
.set-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.set-sec { margin-bottom: 12px; scroll-margin-top: 16px; }
.row-keys { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: .5rem; }
.good-line { color: var(--pri-text); font-weight: 700; display: flex; gap: .5rem; align-items: center; }
.bad-line { color: var(--danger); font-weight: 700; display: flex; gap: .5rem; align-items: center; }
.about { display: flex; gap: 18px; align-items: flex-start; }
.guide { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
.guide-side { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 16px; }
.guide-list { list-style: none; padding: 0 0 0 12px; margin: 0; display: flex; flex-direction: column; gap: 1px; border-left: 1px solid var(--line-2); }
.guide-key { all: unset; position: relative; display: flex; gap: .55rem; align-items: center; cursor: pointer; padding: .42rem .6rem; border-radius: 8px; font-weight: 500; font-size: .9rem; color: var(--ink-2); transition: background .15s, color .15s; }
.guide-key .emo { font-size: .95rem; }
.guide-key:hover { background: var(--pri-soft); color: var(--pri-text); }
.guide-key[aria-current="true"] { color: var(--pri-text); font-weight: 700; }
.guide-key[aria-current="true"]::before { content: ""; position: absolute; left: -14.5px; top: 50%; transform: translateY(-50%); width: 4px; height: 18px; border-radius: 2px; background: var(--pri); }
.guide-key:focus-visible { outline: 2px solid var(--brass); }
.guide-article { max-width: 70ch; outline: none; padding: 22px 26px; }
.guide-article h2 { display: flex; align-items: center; gap: .5rem; font-size: 1.45rem; margin-bottom: .6rem; }
.guide-article p { line-height: 1.75; font-family: var(--serif); font-size: 1.04rem; }
.tip-box { display: flex; gap: .65rem; align-items: flex-start; background: var(--parch); border-left: 3px solid var(--brass); padding: .65rem .9rem; border-radius: 8px; margin: 1rem 0; font-size: .92rem; }
.tip-box .emo { font-size: 1.1rem; }
.tip-text { font-size: 1rem; line-height: 1.65; font-family: var(--serif); }

/* ---------- dialogs and messages ---------- */
.layer { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(24, 26, 50, .34); backdrop-filter: blur(3px); animation: rise .18s ease both; }
:root[data-theme="night"] .layer { background: rgba(5, 5, 10, .6); }
.dialog { width: 100%; max-width: 500px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: linear-gradient(180deg, var(--surface), var(--surface-2)); color: var(--ink);
  border-radius: 20px; border: 1px solid var(--line-2); box-shadow: 0 2px 0 rgba(30, 34, 80, .14), 0 30px 80px rgba(0, 0, 0, .28); animation: pup .32s var(--ease) both; }
.dialog.wide { max-width: 840px; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 16px 20px 8px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { display: flex; gap: .5rem; align-items: center; font-size: 1.2rem; }
.dialog-body { padding: 10px 20px 12px; overflow-y: auto; }
.dialog-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 60; display: flex; flex-direction: column; gap: 8px; max-width: min(400px, calc(100vw - 32px)); }
.toast { display: flex; gap: .55rem; align-items: center; padding: .6rem .9rem; border-radius: 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-left: 3px solid var(--pri);
  box-shadow: var(--card-hi); font-weight: 600; font-size: .88rem; animation: toastIn .3s var(--ease) both; transition: opacity .35s ease, transform .35s ease; }
.toast .emo { font-size: 1rem; }
.toast.bad { border-left-color: var(--danger); }
.toast.warn { border-left-color: var(--warn); }
.toast.going { opacity: 0; transform: translateY(8px); }

/* ---------- the Author Studio ---------- */
.studio { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }
.studio-index { list-style: none; padding: 0 0 0 12px; margin: 4px 0 0; display: flex; flex-direction: column; gap: 1px; border-left: 1px solid var(--line-2); position: sticky; top: 16px; }
.studio-pane { padding: 20px 24px 22px; }
.studio-h { display: flex; align-items: center; gap: .5rem; font-size: 1.35rem; }
.studio-intro { font-family: var(--serif); font-style: italic; color: var(--ink-2); margin: .35rem 0 1rem; max-width: 62ch; line-height: 1.6; }
.studio-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; margin: 8px 0; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); box-shadow: var(--relief); animation: rise .3s var(--ease) both; }
.studio-row > .emo { font-size: 1.25rem; }
.studio-row strong { font-weight: 650; }
.studio-foot { margin-top: 1rem; font-size: .86rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: .8rem; }
.studio-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 22px; align-items: start; }
.studio-langs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 10px; }
.studio-preview { position: sticky; top: 16px; background: var(--tray); border: 1px dashed var(--line-2); border-radius: 14px; padding: 14px; box-shadow: var(--inset); }
.pv-door { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 14px 8px 10px; background: var(--surface); border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--card); }
.pv-name { font-family: var(--serif); font-weight: 700; font-size: 1.7rem; line-height: 1.1; margin-top: .5rem; color: #2C3270; overflow-wrap: anywhere; }
:root[data-theme="night"] .pv-name { color: #E2CF9F; }
.pv-store { font-family: var(--serif); font-weight: 700; font-size: .95rem; margin-top: .4rem; }
.pv-door .seal-ring { margin: 4px 0 2px; }
.pv-door .door-rule span { width: 34px; }
.status-chip { display: inline-flex; align-items: center; gap: .45rem; height: 28px; padding: 0 12px; border-radius: 999px; font: 600 .78rem var(--sans); color: var(--pri-text); background: var(--tint); border: 1px solid var(--line-2); }
.status-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pri); box-shadow: 0 0 0 3px var(--pri-soft); }
.word-tools { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.word-tools .field { margin: 0; }
.studio-pane > .search-row { margin: 6px 0 8px; }
.studio-pane > .chips { margin-bottom: 10px; }
.word-list { display: flex; flex-direction: column; gap: 6px; }
.word-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) 32px; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.word-row.changed { border-color: var(--brass); background: var(--parch); }
.word-row.edited { border-style: dashed; border-color: var(--pri); }
.word-orig { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: .86rem; color: var(--ink-2); }
.word-orig span:last-child { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.word-key { font-family: var(--mono); font-size: .68rem; color: var(--muted); letter-spacing: .02em; }
.word-row input, .word-row textarea { min-height: 36px; font-size: .9rem; }
.palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
.palette-card { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-2);
  background: var(--face); box-shadow: var(--relief); transition: transform .12s var(--ease), box-shadow .12s; }
.palette-card:hover { transform: translateY(-2px); box-shadow: var(--relief-hi); }
.palette-card[aria-checked="true"] { border-color: var(--pri); box-shadow: var(--relief), 0 0 0 3px var(--pri-soft); }
.palette-card:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.palette-card strong { font-size: .92rem; }
.swatches { display: flex; gap: 5px; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }

/* ---------- the matched sets of colours (the Author Studio's Look) ---------- */
:root[data-palette="royal"] { --bg: #F2F5F8; --bg-wash: #E3ECF3; --tint: #EEF4F9; --tint-2: #DDE9F2; --tray: #EBF0F5; --pri: #1B5E8C; --pri-hi: #2470A5; --pri-lo: #164D74; --pri-text: #175680; --pri-soft: rgba(27, 94, 140, .08); --pri-ring: rgba(27, 94, 140, .24); --rim: rgba(27, 94, 140, .26); --line: rgba(20, 60, 100, .10); --line-2: rgba(20, 60, 100, .18); }
:root[data-palette="amethyst"] { --bg: #F5F3F8; --bg-wash: #ECE5F6; --tint: #F3EFFA; --tint-2: #E8E0F6; --tray: #EFEBF6; --pri: #5B3FA8; --pri-hi: #6B4FBC; --pri-lo: #4C3390; --pri-text: #553A9E; --pri-soft: rgba(91, 63, 168, .08); --pri-ring: rgba(91, 63, 168, .24); --rim: rgba(91, 63, 168, .26); --line: rgba(70, 45, 130, .10); --line-2: rgba(70, 45, 130, .18); }
:root[data-palette="burgundy"] { --bg: #F7F3F2; --bg-wash: #F0E4E2; --tint: #F8F0EF; --tint-2: #EEDFDD; --tray: #F2EAE8; --pri: #7A2E3B; --pri-hi: #8C3747; --pri-lo: #662532; --pri-text: #74293A; --pri-soft: rgba(122, 46, 59, .08); --pri-ring: rgba(122, 46, 59, .24); --rim: rgba(122, 46, 59, .26); --line: rgba(100, 40, 50, .10); --line-2: rgba(100, 40, 50, .18); }
:root[data-palette="graphite"] { --bg: #F4F4F5; --bg-wash: #E8E8EB; --tint: #F1F1F3; --tint-2: #E3E4E8; --tray: #EEEEF1; --pri: #3A4150; --pri-hi: #4A5263; --pri-lo: #2F3542; --pri-text: #353C4A; --pri-soft: rgba(58, 65, 80, .08); --pri-ring: rgba(58, 65, 80, .24); --rim: rgba(58, 65, 80, .26); --line: rgba(40, 45, 60, .10); --line-2: rgba(40, 45, 60, .18); }
:root[data-theme="night"][data-palette="royal"] { --bg: #0E1318; --bg-wash: #142231; --surface: #151C24; --surface-2: #19212B; --tray: #11171D; --tint: #1A2531; --tint-2: #22303F; --face: linear-gradient(180deg, #1E2935 0%, #18212B 100%); }
:root[data-theme="night"][data-palette="amethyst"] { --bg: #120F18; --bg-wash: #1F1730; --surface: #1A1622; --surface-2: #1F1A29; --tray: #15111B; --tint: #241C30; --tint-2: #2E243D; --face: linear-gradient(180deg, #2A2236 0%, #211B2B 100%); }
:root[data-theme="night"][data-palette="burgundy"] { --bg: #141011; --bg-wash: #2A1719; --surface: #1D1718; --surface-2: #221B1C; --tray: #171213; --tint: #2A1E20; --tint-2: #352528; --face: linear-gradient(180deg, #2C2224 0%, #231B1D 100%); }
:root[data-theme="night"][data-palette="graphite"] { --bg: #111214; --bg-wash: #1C1E22; --surface: #191A1D; --surface-2: #1E1F23; --tray: #141517; --tint: #222429; --tint-2: #2B2E34; --face: linear-gradient(180deg, #26282D 0%, #1F2125 100%); }
:root[data-theme="night"][data-palette] { --pri: #CDAA68; --pri-hi: #DDBE80; --pri-lo: #B08E50; --on-pri: #1B1A14; --pri-text: #DCC08A; --pri-soft: rgba(205, 170, 104, .10); --pri-ring: rgba(205, 170, 104, .30); --rim: rgba(205, 170, 104, .36); --line: rgba(214, 191, 140, .10); --line-2: rgba(214, 191, 140, .19); }
:root[data-palette="royal"] .brand, :root[data-palette="royal"] .pv-name { color: #154A70; }
:root[data-palette="amethyst"] .brand, :root[data-palette="amethyst"] .pv-name { color: #452D86; }
:root[data-palette="burgundy"] .brand, :root[data-palette="burgundy"] .pv-name { color: #5E2230; }
:root[data-palette="graphite"] .brand, :root[data-palette="graphite"] .pv-name { color: #2A303C; }
:root[data-theme="night"] .brand { color: #E2CF9F; }
:root[data-density="comfortable"] { --key-h: 42px; }
:root[data-density="comfortable"] .nav-key { min-height: 44px; }

/* ---------- narrow screens ---------- */
@media (max-width: 1150px) {
  .register { grid-template-columns: 1fr; }
  .reg-ticket { position: static; }
  .products { max-height: none; }
  .ticket-lines { max-height: none; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
}
.nav-key .short { display: none; }
@media (max-width: 900px) {
  .shell, :root[data-fold="1"] .shell { grid-template-columns: minmax(0, 1fr); padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  .toolbar select { min-width: 0; flex: 1 1 160px; }
  .rail { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; z-index: 40; flex-direction: row; align-items: stretch; gap: 0;
    padding: 4px max(4px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
    border-right: 0; border-top: 1px solid var(--line-2); overflow: visible; background: var(--surface); box-shadow: 0 -4px 14px rgba(30, 34, 80, .07); }
  .rail-brand, .build-line, .rail-rule { display: none; }
  .rail-keys { flex-direction: row; flex: 1; justify-content: space-around; gap: 0; min-width: 0; margin: 0; padding: 0; border: 0; }
  .rail-foot { margin: 0; padding: 0; display: flex; }
  .nav-key { flex: 1 1 0; min-width: 0; flex-direction: column; gap: 2px; padding: .35rem 0 .3rem; font-size: .68rem; letter-spacing: -.01em; min-height: 54px; justify-content: center; text-align: center; border-radius: 10px; }
  .nav-key[aria-current="page"]::before { left: 50%; top: 0; transform: translateX(-50%); width: 20px; height: 3px; }
  .nav-emo { font-size: 1.1rem; width: auto; }
  .nav-key span.long, .nav-key span.short { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-key .long { display: none; }
  .nav-key .short { display: block; }
  .lock-key { width: 46px; flex: none; }
  .lock-key span.long, .lock-key span.short { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .two, .form-grid, .guide, .item-top, .grid-3, .studio, .studio-split, .studio-langs { grid-template-columns: 1fr; }
  .studio-index, .studio-preview { position: static; }
  .word-row { grid-template-columns: minmax(0, 1fr) 32px; }

  .guide-side { position: static; }
  h1 { font-size: 1.55rem; }
  .door-card { padding: 24px 18px; }
  .ledger, .ledger.eight { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 12px; }

  .ledger.eight .stat:nth-child(n+5) { border-top: 0; margin-top: 0; padding-top: 4px; }
  .stat-value { font-size: 1.4rem; }
  .topbar { padding-top: 10px; }

  .more-key { display: flex !important; width: auto; flex: 1 1 0; }
}
@media (max-width: 520px) { .pair { grid-template-columns: 1fr; } .history li { grid-template-columns: 1fr; gap: 2px; } .topbar .when { display: none; } }

/* ---------- printing: only what was asked for ---------- */
#print { display: none; }
@media print {
  html.printing body > *:not(#print) { display: none !important; }
  html.printing body { background: #FFFFFF !important; }
  html.printing #print { display: block; color: #000000; }
  html.printing #print .receipt { border: 0; max-width: 80mm; margin: 0; box-shadow: none; }
  .print-card { text-align: center; font-family: var(--serif); }
  .print-card .master-grid { border: 1px solid #000000; box-shadow: none; background: #FFFFFF; }
  .print-card .master-grid li { box-shadow: none; }
  .report.for-print .stat { box-shadow: none; }
  * { animation: none !important; }
  @page { margin: 12mm; }
}

   The door and the sign-in, after Ingenium 6.50's own (its .intro-door and its sign-in, r197): the same card, the

  --i-pop: inset 0 -1.5px 0 rgba(40, 22, 68, .13), 0 2px 0 rgba(40, 22, 68, .25), 0 4px 5px rgba(40, 22, 68, .16), 0 9px 14px rgba(40, 22, 68, .10);
  --i-well: inset 0 1px 2.5px rgba(40, 22, 68, .08);

}

  --i-accent: #b79ce6; --i-accent-bright: #d4c2f4; --i-accent-deep: #9a7ad8; --i-line-rgb: 183, 156, 230; --i-accent-soft: rgba(183, 156, 230, .15);
  --i-card-hi: #2a2239; --i-card-lo: #251e33; --i-hairline: rgba(205, 184, 240, .11);
  --i-ink-1: #f3eefb; --i-ink-2: #d3c9e3; --i-ink-3: #a99cc1; --i-input-bg: rgba(10, 6, 18, .32);
  --i-pop: inset 0 1px 0 rgba(255, 255, 255, .07), inset 0 -2px 0 rgba(0, 0, 0, .45), 0 2px 0 rgba(0, 0, 0, .75), 0 4px 5px rgba(0, 0, 0, .50), 0 9px 14px rgba(0, 0, 0, .36);
  --i-well: inset 0 1px 3px rgba(0, 0, 0, .40);
}

/* ---------- the introduction door ---------- */
.intro-door { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 400; display: flex; align-items: center; justify-content: center; overflow: auto;
  padding: calc(20px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));

.intro-door[hidden] { display: none !important; }
/* The app behind the door, as Ingenium shows its own: here a still drawing of the rooms, frosted. */
.intro-ghost { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; display: grid; grid-template-columns: 220px 1fr; gap: 26px; padding: 18px 26px; opacity: .9; }
.intro-ghost i { display: block; border-radius: 16px; background: #ffffff; box-shadow: 0 1px 0 rgba(40, 22, 68, .06), 0 6px 14px rgba(40, 22, 68, .06); }

.intro-ghost .g-rail i:first-child { background: rgba(106, 63, 181, .22); }
.intro-ghost .g-main { display: grid; grid-template-rows: 44px 150px 1fr; gap: 22px; }
.intro-ghost .g-main i:first-child { background: rgba(106, 63, 181, .08); box-shadow: none; }
.intro-ghost .g-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.intro-ghost .g-row i { min-height: 220px; }
.intro-ghost .g-dot { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: rgba(160, 120, 230, .32); }
:root[data-theme="night"] .intro-ghost i { background: #1d1729; box-shadow: none; }
:root[data-theme="night"] .intro-ghost .g-rail i, :root[data-theme="night"] .intro-ghost .g-main i:first-child { background: rgba(183, 156, 230, .10); }
.intro-frost { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none;
  background: radial-gradient(620px 520px at 50% 46%, rgba(179, 155, 234, .22), transparent 70%), rgba(244, 240, 250, .74);
  backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%); }
:root[data-theme="night"] .intro-frost { background: radial-gradient(620px 520px at 50% 46%, rgba(106, 63, 181, .20), transparent 70%), rgba(9, 6, 15, .80); }
@media (max-width: 760px) { .intro-ghost { grid-template-columns: 1fr; } .intro-ghost .g-rail { display: none; } .intro-ghost .g-row { grid-template-columns: 1fr; } }

.intro-card { position: relative; isolation: isolate; width: min(440px, 92vw); text-align: center; padding: 34px 32px 24px; border-radius: 26px; margin: auto;
  border: 1px solid rgba(var(--i-fam-rgb), .10); background: var(--i-card-hi);
  box-shadow: 0 1px 0 rgba(var(--i-fam-rgb), .08), 0 4px 7px rgba(var(--i-fam-rgb), .08), 0 20px 36px rgba(var(--i-fam-rgb), .12), 0 38px 72px rgba(var(--i-fam-rgb), .10);
  animation: introRise .45s ease; }
:root[data-theme="night"] .intro-card { border-color: rgba(205, 184, 240, .14); background: #211b2c;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 4px 7px rgba(0, 0, 0, .45), 0 20px 36px rgba(0, 0, 0, .5), 0 38px 72px rgba(0, 0, 0, .45); }
@keyframes introRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.intro-door.ild-card-away .intro-card { opacity: 0; transform: scale(.985); pointer-events: none; transition: opacity .22s ease, transform .22s ease; }

/* the corner switches: the look on the right, as Ingenium's; the language on the left, in the same pill */
.intro-corner { position: absolute; top: 15px; right: 15px; z-index: 8; }
.intro-corner.intro-corner-l { right: auto; left: 15px; }
.i-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--i-hairline); background: var(--i-input-bg); box-shadow: var(--i-well); }

.i-seg .seg-btn { appearance: none; -webkit-appearance: none; min-width: 26px; min-height: 24px; padding: 2px 8px; border: 1px solid transparent; border-radius: 999px; margin: 0;
  font: 12px/1 var(--i-sans); display: inline-flex; align-items: center; justify-content: center; color: var(--i-ink-3); background: transparent; box-shadow: none; cursor: pointer;
  transition: color .15s ease; }
.i-seg .seg-btn:hover { color: var(--i-accent); }
.i-seg .seg-btn.active { color: var(--i-accent); font-weight: 700; background: var(--i-card-hi); border-color: var(--i-hairline); box-shadow: var(--i-pop); }

.i-seg .seg-btn.lang { font-size: 11px; letter-spacing: .04em; font-weight: 600; }

/* the emblem in its disc */
.intro-seal { width: fit-content; margin: 4px auto 16px; padding: 0; border: 0; background: transparent; border-radius: 50%; cursor: pointer; display: flex; justify-content: center;
  filter: drop-shadow(0 1px 1px rgba(28, 22, 40, .14)) drop-shadow(0 3px 5px rgba(28, 22, 40, .10));
  animation: sealDoorIn .62s cubic-bezier(.34, 1.56, .64, 1); transition: transform .22s cubic-bezier(.34, 1.56, .64, 1), filter .22s ease; }
.intro-seal svg { display: block; width: 112px; height: 112px; overflow: visible; }
.intro-seal:hover { transform: translateY(-2px) scale(1.04); filter: drop-shadow(0 1.5px 1.5px rgba(28, 22, 40, .14)) drop-shadow(0 6px 8px rgba(28, 22, 40, .11)); }
.intro-seal:active { transform: translateY(1px) scale(.96); transition-duration: .05s; filter: drop-shadow(0 .5px .5px rgba(28, 22, 40, .18)) drop-shadow(0 1.5px 2.5px rgba(28, 22, 40, .12)); }
:root[data-theme="night"] .intro-seal { filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .50)) drop-shadow(0 3px 6px rgba(0, 0, 0, .34)); }

.intro-seal:focus-visible { outline: 2.5px solid var(--i-accent); outline-offset: 4px; }
.intro-seal.knock { animation: sealKnock .5s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes sealDoorIn { 0% { opacity: 0; transform: scale(.82); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
@keyframes sealKnock { 0% { transform: scale(.9); } 45% { transform: scale(1.12) rotate(-4deg); } 100% { transform: scale(1) rotate(0); } }

/* the disc's own colours (also used by the emblem in the side menu and the top bar) */
.seal3d .s4-breath { animation: s4Breath 4s ease-in-out infinite .62s; }
@keyframes s4Breath { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }

/* ---------- the sign-in and the dialogs (Ingenium's r197) ---------- */
#lockDoor { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 18px; box-sizing: border-box; overflow: auto;
  background: #f5f3f7; color: #221a2e; font: 15px/1.5 var(--i-sans);
  --ild-face-a: #ffffff; --ild-face-b: #f7f5fa; --ild-wall: #d3cbe0; --ild-ink: #221a2e; --ild-soft: rgba(70, 58, 92, .78); --ild-line: rgba(91, 70, 144, .30); --ild-fam: 40, 22, 68; --ild-field: #ffffff; --ild-acc: #5b4690; }

  --ild-line: rgba(190, 170, 230, .34); --ild-fam: 0, 0, 0; --ild-field: #1d1728; --ild-acc: #c9b8ee; }

  background: linear-gradient(180deg, var(--ild-face-a), var(--ild-face-b) 62%, color-mix(in srgb, var(--ild-face-b) 93%, var(--ild-wall)));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45), inset 2px 0 0 rgba(255, 255, 255, .25), inset -2px 0 0 var(--ild-wall), inset 0 -3px 0 var(--ild-wall), 0 0 0 1px rgba(var(--ild-fam), .10),
    0 2px 3px rgba(var(--ild-fam), .10), 0 9px 12px -7px rgba(var(--ild-fam), .18), 0 22px 40px -14px rgba(var(--ild-fam), .26);
  animation: ildIn .46s cubic-bezier(.22, .8, .3, 1) both; }
@keyframes ildIn { 0% { opacity: 0; transform: translateY(12px) scale(.955); } 62% { opacity: 1; transform: translateY(-2px) scale(1.008); } 100% { opacity: 1; transform: none; } }
#lockDoor h1 { margin: 0 0 2px; font: 700 26px/1.15 var(--i-serif); text-align: center; letter-spacing: .01em; }

  border: 1px solid var(--ild-line); background: var(--ild-field); color: var(--ild-ink); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .08); min-height: 0; }
#lockDoor textarea { resize: vertical; font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; letter-spacing: .06em; }

#lockDoor .ild-keys { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; align-items: center; margin-top: 14px; }

#lockDoor .ild-key { font: 600 14px/1 var(--i-sans); padding: 11px 18px; border-radius: 12px; cursor: pointer; color: #fff; border: 1px solid #4b2a86;
  background: linear-gradient(180deg, #7348be, #5d37a1); text-shadow: 0 1px 1px rgba(30, 10, 60, .35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 2px 0 #3a2070, 0 4px 6px rgba(var(--ild-fam), .24), 0 9px 16px rgba(var(--ild-fam), .16); transition: filter .16s ease, box-shadow .16s ease; }

    ["set.eraseWarn", "This cannot be undone on this device. Save a backup first if you may need these books.", "C'est irréversible sur cet appareil. Faites d'abord une sauvegarde si vous pourriez avoir besoin de ces livres.", "Ou p ap ka defèt sa sou aparèy sa a. Fè yon kopi anvan si w ka bezwen liv sa yo."],
    ["set.eraseType", "Type the store's name: {name}", "Tapez le nom du magasin : {name}", "Tape non magazen an: {name}"], ["set.eraseNameWrong", "The name is not the same.", "Le nom ne correspond pas.", "Non an pa menm."],

    /* the Guidebook */
    ["guide.search", "Search the Guidebook", "Chercher dans le guide", "Chèche nan gid la"], ["guide.searchPh", "Search", "Chercher", "Chèche"], ["guide.none", "No article matches.", "Aucun article ne correspond.", "Pa gen atik ki koresponn."],
    ["guide.start.t", "Getting started", "Pour commencer", "Pou kòmanse"],
    ["guide.start.b", "Emporium keeps the store's stock, sales and reports on this device. It works with no connection.\nBegin with the first steps on Home: set the sales tax, add your items, receive their stock, ring up a sale, and save a backup.\nEach page has small tip keys beside the controls. Press one when something is not clear.", "Emporium garde le stock, les ventes et les rapports du magasin sur cet appareil. Il fonctionne sans connexion.\nCommencez par les premiers pas de l'Accueil : la taxe, les articles, la réception du stock, une vente, puis une sauvegarde.\nChaque page a de petites touches de conseil à côté des commandes. Appuyez sur l'une d'elles quand quelque chose n'est pas clair.", "Emporium kenbe stòk, vant ak rapò magazen an sou aparèy sa a. Li mache san entènèt.\nKòmanse ak premye pa yo sou Akèy: mete taks la, ajoute atik ou yo, resevwa stòk yo, fè yon vant, epi fè yon kopi sekirite.\nChak paj gen ti bouton konsèy bò kote kontwòl yo. Peze youn lè yon bagay pa klè."],
    ["guide.start.tip", "Work through the first steps in order. Each one takes only a minute.", "Suivez les premiers pas dans l'ordre. Chacun ne prend qu'une minute.", "Fè premye pa yo nan lòd. Chak pran yon minit sèlman."],
    ["guide.door.t", "The door and your password", "La porte et votre mot de passe", "Pòt la ak modpas ou"],
    ["guide.door.b", "The door is the first page. The owner's password opens the books.\nThe store locks itself after the minutes you choose in Settings, and when you press Lock now. A sale in progress is kept while it is locked.\nAfter five wrong passwords, the door asks you to wait a little before trying again.", "La porte est la première page. Le mot de passe du propriétaire ouvre les livres.\nLe magasin se verrouille après les minutes choisies dans les Réglages, et quand vous appuyez sur Verrouiller. Une vente en cours est gardée.\nAprès cinq mots de passe erronés, la porte demande d'attendre un peu.", "Pòt la se premye paj la. Modpas mèt la louvri liv yo.\nMagazen an fèmen pou kont li apre kantite minit ou chwazi nan Reglaj, epi lè w peze Fèmen kounye a. Vant k ap fèt la rete.\nApre senk move modpas, pòt la mande w tann yon ti moman."],
    ["guide.door.tip", "Lock the store whenever you step away from the counter.", "Verrouillez le magasin chaque fois que vous quittez le comptoir.", "Fèmen magazen an chak fwa w kite kontwa a."],
    ["guide.master.t", "The Master Key", "La Clé maîtresse", "Kle Mèt la"],
    ["guide.master.b", "The Master Key is a code of 52 characters shown once, when the store is set up. It opens the books if the password is forgotten, and lets you choose a new password.\nKeep the printed card in a safe, away from the store's computers. Anyone who holds it can open the books.\nYou can make a new Master Key in Settings. The old card stops working once the new key is confirmed.", "La Clé maîtresse est un code de 52 caractères affiché une seule fois, à la configuration. Elle ouvre les livres si le mot de passe est oublié et permet d'en choisir un nouveau.\nGardez la carte imprimée dans un coffre, loin des ordinateurs du magasin. Quiconque la détient peut ouvrir les livres.\nVous pouvez créer une nouvelle Clé maîtresse dans les Réglages. L'ancienne carte cesse de fonctionner dès que la nouvelle est confirmée.", "Kle Mèt la se yon kòd 52 karaktè ki parèt yon sèl fwa, lè yo prepare magazen an. Li louvri liv yo si yo bliye modpas la, epi li pèmèt ou chwazi yon nouvo modpas.\nKenbe kat enprime a nan yon kòf, lwen òdinatè magazen an. Nenpòt moun ki gen l ka louvri liv yo.\nOu ka fè yon nouvo Kle Mèt nan Reglaj. Ansyen kat la sispann mache depi nouvo kle a konfime."],
    ["guide.master.tip", "Never keep the Master Key on a phone or a computer.", "Ne gardez jamais la Clé maîtresse sur un téléphone ou un ordinateur.", "Pa janm kenbe Kle Mèt la nan yon telefòn oswa yon òdinatè."],
    ["guide.sale.t", "Ringing up a sale", "Enregistrer une vente", "Fè yon vant"],
    ["guide.sale.b", "Open the Register. Scan a barcode, or type part of a name and choose the item. Each press adds one more.\nChange a quantity with the minus and plus keys, or type it. The cross removes a line.\nPress Take cash. Type the cash received, or press a quick amount. Emporium shows the change to give. Complete the sale, then print the receipt if the customer wants one.", "Ouvrez la Caisse. Scannez un code-barres, ou tapez une partie du nom et choisissez l'article. Chaque appui en ajoute un.\nChangez une quantité avec les touches moins et plus, ou tapez-la. La croix retire une ligne.\nAppuyez sur Encaisser en espèces. Tapez la somme reçue, ou un montant rapide. Emporium affiche la monnaie à rendre. Terminez la vente, puis imprimez le reçu si le client le souhaite.", "Louvri Kès la. Eskane yon kòd ba, oswa tape yon pati nan non an epi chwazi atik la. Chak fwa w peze, li ajoute youn.\nChanje kantite a ak bouton mwens ak plis, oswa tape l. Kwa a retire yon liy.\nPeze Pran lajan kach. Tape lajan ou resevwa a, oswa peze yon kantite rapid. Emporium montre monnen pou remèt la. Fini vant lan, epi enprime resi a si kliyan an vle l."],
    ["guide.sale.tip", "With a barcode scanner, keep the search box selected: each scan adds the item.", "Avec un lecteur de code-barres, gardez la recherche sélectionnée : chaque lecture ajoute l'article.", "Ak yon eskanè kòd ba, kite bwat rechèch la seleksyone: chak eskanè ajoute atik la."],
    ["guide.items.t", "Adding items", "Ajouter des articles", "Ajoute atik"],
    ["guide.items.b", "In Inventory, press Add an item. Give it a name, a category and a price. The cost is what you paid for one. It is needed to work out profit.\nA barcode lets the scanner find the item. The reorder level puts the item on the low stock list when it falls that low.\nUse Save and add another to enter many items quickly.", "Dans l'Inventaire, appuyez sur Ajouter un article. Donnez un nom, une catégorie et un prix. Le coût est ce que vous avez payé pour un article. Il sert à calculer le bénéfice.\nUn code-barres permet au lecteur de trouver l'article. Le seuil de commande place l'article dans le stock bas quand il descend jusque-là.\nUtilisez Enregistrer et en ajouter un autre pour saisir vite beaucoup d'articles.", "Nan Envantè, peze Ajoute yon atik. Ba l yon non, yon kategori ak yon pri. Pri achte a se sa ou peye pou youn. Li nesesè pou kalkile benefis.\nYon kòd ba pèmèt eskanè a jwenn atik la. Nivo pou kòmande a mete atik la nan stòk ki ba lè li desann rive la.\nSèvi ak Anrejistre epi ajoute yon lòt pou antre anpil atik vit."],
    ["guide.items.tip", "Enter the cost for every item. Without it, the profit of that item is not counted.", "Saisissez le coût de chaque article. Sans lui, le bénéfice de l'article n'est pas compté.", "Mete pri achte pou chak atik. San li, benefis atik sa a pa konte."],
    ["guide.receive.t", "Receiving stock", "Recevoir du stock", "Resevwa stòk"],
    ["guide.receive.b", "When a delivery arrives, open the item and press Receive stock. Type how many arrived and what each one cost.\nEmporium keeps the average cost of what is on the shelf, so profit stays right when prices change.\nThe supplier and the invoice number help later, when you check a delivery.", "À l'arrivée d'une livraison, ouvrez l'article et appuyez sur Recevoir du stock. Tapez combien sont arrivés et le coût de chacun.\nEmporium garde le coût moyen de ce qui est en rayon, pour que le bénéfice reste juste quand les prix changent.\nLe fournisseur et le numéro de facture aident plus tard, pour vérifier une livraison.", "Lè yon livrezon rive, louvri atik la epi peze Resevwa machandiz. Tape konbyen ki rive ak pri achte chak.\nEmporium kenbe pri mwayen sa ki sou etajè a, pou benefis la rete jis lè pri yo chanje.\nFounisè a ak nimewo fakti a ede pita, lè w ap verifye yon livrezon."],
    ["guide.receive.tip", "Receive stock on the day it arrives, so the books always match the shelves.", "Recevez le stock le jour de son arrivée, pour que les livres correspondent toujours aux rayons.", "Resevwa stòk la jou li rive a, pou liv yo toujou menm ak etajè yo."],
    ["guide.correct.t", "Correcting stock", "Corriger le stock", "Korije stòk"],
    ["guide.correct.b", "When the shelf and the books disagree, open the item and press Correct the stock. Choose to remove or to add, how many, and the reason.\nEvery correction stays in the item's history with the person, the time and the reason. Removals are counted as losses in the reports.\nNothing is ever deleted: a mistake is put right by a new correction.", "Quand le rayon et les livres ne concordent pas, ouvrez l'article et appuyez sur Corriger le stock. Choisissez retirer ou ajouter, la quantité et la raison.\nChaque correction reste dans l'historique avec la personne, l'heure et la raison. Les retraits comptent comme pertes dans les rapports.\nRien n'est jamais effacé : une erreur se corrige par une nouvelle correction.", "Lè etajè a ak liv yo pa dakò, louvri atik la epi peze Korije stòk la. Chwazi retire oswa ajoute, konbyen, ak rezon an.\nChak koreksyon rete nan istwa atik la ak moun nan, lè a ak rezon an. Sa yo retire konte kòm pèt nan rapò yo.\nAnyen pa janm efase: yon erè korije ak yon nouvo koreksyon."],
    ["guide.correct.tip", "Count a few shelves every week. Small differences found early are easy to explain.", "Comptez quelques rayons chaque semaine. Les petits écarts trouvés tôt s'expliquent facilement.", "Konte kèk etajè chak semèn. Ti diferans ou jwenn bonè fasil pou eksplike."],
    ["guide.reports.t", "Reading the reports", "Lire les rapports", "Li rapò yo"],
    ["guide.reports.b", "Choose a period: today, this week, this month, or any dates. Emporium works out the sales, the tax collected, the cost of what was sold and the gross profit.\nThe tables show the best sellers, the categories, the busy hours, the items that are not selling, and the losses.\nThe CSV keys save files for your accountant. The line at the foot names the build and the last ledger line used.", "Choisissez une période : aujourd'hui, cette semaine, ce mois, ou des dates précises. Emporium calcule les ventes, la taxe perçue, le coût des articles vendus et le bénéfice brut.\nLes tableaux montrent les meilleures ventes, les catégories, les heures chargées, les articles qui ne se vendent pas et les pertes.\nLes touches CSV enregistrent des fichiers pour votre comptable. La ligne du bas indique le build et la dernière ligne du registre utilisée.", "Chwazi yon peryòd: jodi a, semèn sa a, mwa sa a, oswa nenpòt dat. Emporium kalkile vant yo, taks ou ranmase, pri achte sa ki vann ak benefis brit la.\nTablo yo montre sa ki vann plis, kategori yo, lè ki gen plis moun, atik ki pa vann ak pèt yo.\nBouton CSV yo anrejistre fichye pou kontab ou. Liy anba a bay build la ak dènye liy rejis la yo itilize."],
    ["guide.reports.tip", "Look at the items that are not selling once a month. They hold money that could buy what does sell.", "Regardez une fois par mois les articles qui ne se vendent pas. Ils immobilisent de l'argent qui pourrait acheter ce qui se vend.", "Gade atik ki pa vann yo yon fwa pa mwa. Yo kenbe lajan ki ta ka achte sa ki vann."],
    ["guide.backup.t", "Backups", "Sauvegardes", "Kopi sekirite"],
    ["guide.backup.b", "In Settings, Save a backup now writes one sealed file with all the books. It opens only with the password or the Master Key that were valid that day.\nKeep backups on a USB key, and another copy outside the store. A backup can bring the store back on a new computer.\nRestoring checks every line of the backup before anything on the device is replaced.", "Dans les Réglages, Sauvegarder maintenant écrit un fichier scellé avec tous les livres. Il ne s'ouvre qu'avec le mot de passe ou la Clé maîtresse valables ce jour-là.\nGardez les sauvegardes sur une clé USB, et une autre copie hors du magasin. Une sauvegarde peut ramener le magasin sur un nouvel ordinateur.\nLa restauration vérifie chaque ligne avant de remplacer quoi que ce soit.", "Nan Reglaj, Fè yon kopi kounye a ekri yon fichye sele ak tout liv yo. Li louvri sèlman ak modpas la oswa Kle Mèt ki te bon jou sa a.\nKenbe kopi sou yon kle USB, ak yon lòt kopi andeyò magazen an. Yon kopi ka remete magazen an sou yon nouvo òdinatè.\nLè w ap remete l, Emporium verifye chak liy anvan li ranplase anyen."],
    ["guide.backup.tip", "Save a backup at closing time, every day.", "Faites une sauvegarde à la fermeture, chaque jour.", "Fè yon kopi lè w ap fèmen, chak jou."],
    ["guide.sealed.t", "What is sealed", "Ce qui est scellé", "Sa ki sele"],
    ["guide.sealed.b", "Every item, price, cost, stock figure, sale, receipt, setting and ledger line is sealed with the store's key, which only your password or the Master Key can open.\nNot sealed: the store's name shown at the door, the build number, and the technical facts needed to open the seal.\nThere is no Emporium server. Your books stay on your devices.", "Chaque article, prix, coût, stock, vente, reçu, réglage et ligne du registre est scellé avec la clé du magasin, que seuls votre mot de passe ou la Clé maîtresse peuvent ouvrir.\nNon scellés : le nom du magasin affiché à la porte, le numéro de build et les données techniques nécessaires pour ouvrir le sceau.\nIl n'y a pas de serveur Emporium. Vos livres restent sur vos appareils.", "Chak atik, pri, pri achte, stòk, vant, resi, reglaj ak liy rejis sele ak kle magazen an, epi se sèlman modpas ou oswa Kle Mèt la ki ka louvri l.\nSa ki pa sele: non magazen an ki parèt sou pòt la, nimewo build la, ak enfòmasyon teknik ki nesesè pou louvri sele a.\nPa gen sèvè Emporium. Liv ou yo rete sou aparèy ou yo."],
    ["guide.sealed.tip", "Choose a long password. It is the lock on everything.", "Choisissez un mot de passe long. C'est la serrure de tout.", "Chwazi yon modpas ki long. Se li ki kadna tout bagay."],
    ["guide.verify.t", "Verifying the books", "Vérifier les livres", "Verifye liv yo"],
    ["guide.verify.b", "Every change is one line in the ledger, and each line carries the fingerprint of the line before it. Changing an old line would break the chain.\nIn Settings, Verify the books reads every line, checks every fingerprint, and works out each stock figure again from the start.\nIf a problem is found, save a backup and ask for help before changing anything.", "Chaque changement est une ligne du registre, et chaque ligne porte l'empreinte de la précédente. Modifier une ancienne ligne romprait la chaîne.\nDans les Réglages, Vérifier les livres lit chaque ligne, contrôle chaque empreinte et recalcule chaque stock depuis le début.\nSi un problème apparaît, faites une sauvegarde et demandez de l'aide avant de changer quoi que ce soit.", "Chak chanjman se yon liy nan rejis la, e chak liy pote anprent liy anvan l. Si yo chanje yon ansyen liy, chèn nan ta kase.\nNan Reglaj, Verifye liv yo li chak liy, tcheke chak anprent, epi refè kalkil chak stòk depi nan kòmansman.\nSi gen yon pwoblèm, fè yon kopi epi mande èd anvan w chanje anyen."],
    ["guide.verify.tip", "Verify the books once a week, and before an audit.", "Vérifiez les livres une fois par semaine, et avant un audit.", "Verifye liv yo yon fwa pa semèn, ak anvan yon odit."],
    ["guide.display.t", "Language and display", "Langue et affichage", "Lang ak afichaj"],
    ["guide.display.b", "Emporium speaks English, French and Kreyòl. Change the language at the door or in Settings, at any time.\nDay, Night and Auto change the light of every page at once. Auto follows the device.\nIn Settings you can make the text larger, and turn on Calm mode: no motion, quieter colours and larger keys.", "Emporium parle anglais, français et kreyòl. Changez de langue à la porte ou dans les Réglages, à tout moment.\nJour, Nuit et Auto changent la lumière de toutes les pages à la fois. Auto suit l'appareil.\nDans les Réglages, vous pouvez agrandir le texte et activer le mode calme : sans animation, couleurs plus douces, touches plus grandes.", "Emporium pale angle, franse ak kreyòl. Chanje lang lan sou pòt la oswa nan Reglaj, nenpòt lè.\nJou, Lannwit ak Otomatik chanje limyè tout paj yo an menm tan. Otomatik swiv aparèy la.\nNan Reglaj ou ka fè tèks la pi gwo, epi limen Mòd kalm: san mouvman, koulè pi dous ak bouton pi gwo."],
    ["guide.display.tip", "Each person at the register can choose the language they read best.", "Chaque personne à la caisse peut choisir la langue qu'elle lit le mieux.", "Chak moun nan kès la ka chwazi lang li li pi byen."],
    ["guide.build.t", "Which build am I running", "Quel build est-ce que j'utilise", "Ki build m ap itilize"],
    ["guide.build.b", "Every version of Emporium has a build number. It is on the door, in the menu, in About, on every receipt and at the foot of every report.\nEach release on GitHub lists the fingerprint of every file, so you can check that a download is exactly what was built.", "Chaque version d'Emporium a un numéro de build. Il figure sur la porte, dans le menu, dans À propos, sur chaque reçu et au bas de chaque rapport.\nChaque publication sur GitHub indique l'empreinte de chaque fichier, pour vérifier qu'un téléchargement est exactement ce qui a été construit.", "Chak vèsyon Emporium gen yon nimewo build. Li sou pòt la, nan meni an, nan Konsènan, sou chak resi ak anba chak rapò.\nChak piblikasyon sou GitHub bay anprent chak fichye, pou w ka verifye sa w telechaje a se egzakteman sa ki te konstwi a."],
    ["guide.build.tip", "When you report a problem, give the build number.", "Quand vous signalez un problème, donnez le numéro de build.", "Lè w ap rapòte yon pwoblèm, bay nimewo build la."],
    ["guide.limits.t", "What Emporium does not do", "Ce qu'Emporium ne fait pas", "Sa Emporium pa fè"],
    ["guide.limits.b", "Emporium does not file taxes, move money, or replace the systems of RIA, CAM, Unitransfer or Boss Revolution. It keeps the store's own records.\nWhile the store is open, anyone at the device can see the screen. Lock it when you step away.\nNo program is proof against every attack. Keep the computer up to date, and do not install unknown programs on it.", "Emporium ne déclare pas les impôts, ne transfère pas d'argent et ne remplace pas les systèmes de RIA, CAM, Unitransfer ou Boss Revolution. Il tient les registres du magasin.\nQuand le magasin est ouvert, toute personne devant l'appareil voit l'écran. Verrouillez-le quand vous vous éloignez.\nAucun programme n'est à l'abri de toutes les attaques. Tenez l'ordinateur à jour et n'y installez pas de programmes inconnus.", "Emporium pa deklare taks, li pa voye lajan, li pa ranplase sistèm RIA, CAM, Unitransfer oswa Boss Revolution. Li kenbe dosye magazen an.\nLè magazen an louvri, nenpòt moun devan aparèy la ka wè ekran an. Fèmen l lè w ap deplase.\nPa gen pwogram ki pwoteje kont tout atak. Kenbe òdinatè a ajou, epi pa enstale pwogram ou pa konnen sou li."],
    ["guide.limits.tip", "Ask your accountant to read the first month's reports with you.", "Demandez à votre comptable de lire avec vous les rapports du premier mois.", "Mande kontab ou li rapò premye mwa a avè w."],

    /* Haitian proverbs: the Kreyòl is traditional; the meaning is given in the language of the screen */
    ["prov.label", "A Haitian proverb for today", "Un proverbe haïtien pour aujourd'hui", "Yon pwovèb pou jodi a"],
    ["prov.piti", "Piti piti, zwazo fè nich li.", "Piti piti, zwazo fè nich li.", "Piti piti, zwazo fè nich li."],
    ["prov.piti.m", "Little by little, the bird builds its nest.", "Petit à petit, l'oiseau fait son nid.", "Piti piti, zwazo fè nich li."],
    ["prov.mon", "Dèyè mòn, gen mòn.", "Dèyè mòn, gen mòn.", "Dèyè mòn, gen mòn."],
    ["prov.mon.m", "Beyond the mountains, more mountains.", "Derrière les montagnes, il y a des montagnes.", "Dèyè mòn, gen mòn."],
    ["prov.men", "Men anpil, chay pa lou.", "Men anpil, chay pa lou.", "Men anpil, chay pa lou."],
    ["prov.men.m", "Many hands make the load light.", "Avec beaucoup de mains, la charge n'est pas lourde.", "Men anpil, chay pa lou."],
    ["prov.sak", "Sak vid pa kanpe.", "Sak vid pa kanpe.", "Sak vid pa kanpe."],
    ["prov.sak.m", "An empty sack cannot stand up.", "Un sac vide ne tient pas debout.", "Sak vid pa kanpe."],
    ["prov.woch", "Wòch nan dlo pa konnen doulè wòch nan solèy.", "Wòch nan dlo pa konnen doulè wòch nan solèy.", "Wòch nan dlo pa konnen doulè wòch nan solèy."],
    ["prov.woch.m", "The stone in the water does not know the pain of the stone in the sun.", "La pierre dans l'eau ne connaît pas la peine de la pierre au soleil.", "Wòch nan dlo pa konnen doulè wòch nan solèy."],
    ["prov.lespwa", "Lespwa fè viv.", "Lespwa fè viv.", "Lespwa fè viv."],
    ["prov.lespwa.m", "Hope keeps us going.", "L'espoir fait vivre.", "Lespwa fè viv."],
    ["prov.mapou", "Ti mapou pa grandi anba gwo mapou.", "Ti mapou pa grandi anba gwo mapou.", "Ti mapou pa grandi anba gwo mapou."],
    ["prov.mapou.m", "A young mapou tree does not grow in the shade of a great one.", "Le jeune mapou ne grandit pas à l'ombre du grand.", "Ti mapou pa grandi anba gwo mapou."],
    ["prov.kreyol", "Kreyòl pale, kreyòl konprann.", "Kreyòl pale, kreyòl konprann.", "Kreyòl pale, kreyòl konprann."],
    ["prov.kreyol.m", "Spoken plainly, understood plainly.", "Parlé franchement, compris franchement.", "Kreyòl pale, kreyòl konprann."],

    ["studio.r.look", "Look", "Apparence", "Aparans"], ["studio.r.receipt", "Receipt", "Reçu", "Resi"], ["studio.r.safe", "Safekeeping", "Mise à l'abri", "Sekirite chwa yo"],
    ["studio.start.intro", "Where to begin: choose what you are changing, and this opens the room that changes it.", "Par où commencer : choisissez ce que vous changez, et la salle qui le change s'ouvre.", "Kote pou kòmanse: chwazi sa w ap chanje, epi sal ki chanje l la ap louvri."],
