<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src '@@SCRIPT_HASH@@'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f4f8">
<meta name="application-name" content="Lakay">
<meta name="lakay-build" content="@@BUILD@@">
<!-- LAKAY | Copyright (c) 2026 Yannie D. Forest. All rights reserved. NO LICENCE IS GRANTED. See LICENCE.txt. Build @@BUILD@@ (@@DATE@@). -->
<title>Lakay</title>
<!-- Lakay's logo, inside the page (the page's own policy shows only pictures it carries): the square tile, filled edge to
     edge with the coin's periwinkle, for the shortcuts a browser makes on a home screen; the round coin, on nothing, for the
     tab (named last, so that every browser keeps it for the tab); and the tile for the iPhone and iPad home screen. For a
     website the same pictures also stand beside the page as files, where browsers look for them (app/, release/icons.py). -->
<link rel="icon" type="image/png" sizes="192x192" href="@@ICON_TILE@@">
<link rel="icon" type="image/png" sizes="96x96" href="@@FAVICON@@">
<link rel="apple-touch-icon" sizes="180x180" href="@@TOUCH_ICON@@">
<meta name="apple-mobile-web-app-title" content="Lakay">
<style>
@@CSS@@
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<div id="toasts" aria-live="polite"></div>
<script>@@JS@@</script>
</body>
</html>
