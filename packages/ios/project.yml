#
# Lakay for iPhone and iPad, for XcodeGen: Ingenium 6.0's shell (source/shells/ios),
# built by .github/workflows/ios.yml with Lakay's page in Shell/www.
name: Lakay
options:
  bundleIdPrefix: com.yannieforest
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
targets:
  Shell:
    type: application
    platform: iOS
    sources:
      - path: Shell
        excludes:
          - "www"
          - "www/**"
          - "Icons"
          - "Icons/**"
      - path: Shell/www
        type: folder
        buildPhase: resources
      - path: Shell/Icons
        buildPhase: resources
    dependencies:
      - sdk: WebKit.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannieforest.emporium
        PRODUCT_NAME: Lakay
        INFOPLIST_FILE: Shell/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_OUTPUT_FORMAT: xml
        TARGETED_DEVICE_FAMILY: "1,2"
        COMPRESS_PNG_FILES: NO
        STRIP_PNG_TEXT: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        DEAD_CODE_STRIPPING: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        CODE_SIGN_STYLE: Manual
