name: Lakay for Windows

# Builds the Windows program from app/Lakay.html, tests it on GitHub's
# Windows computer, makes the installer, installs and uninstalls it, scans it
# with Microsoft Defender, and puts it on the Releases page ("Lakay for Windows (latest build)")
# and in this repository's builds/ folder, as the owner's other apps are delivered.
# Made after the Forge's Windows build (FFF, 9s80).

on:
  push:
    paths:
      - 'app/**'
      - 'build.json'
      - 'desktop/**'
      - 'release/publish.py'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Each device's repository holds only its own workflow (release/device_repos.py), so this runs wherever it is,
    # whatever the repository is called: a renamed repository still builds.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep every file exactly as committed
        run: git config --global core.autocrlf false

      - name: Get the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, runs on Node.js 24

      - name: Read the build number
        run: |
          $b = Get-Content build.json -Raw | ConvertFrom-Json
          $build = [int]$b.build
          if ($build -lt 1) { Write-Error "build.json has no build number."; exit 1 }
          @(
            "BUILD=$build"
            "APP_LABEL=Build $build"
            "APP_NUMERIC=1.0.$build.0"
            "SETUP_BASE=Lakay-Windows-Setup"
            "OUT=$env:RUNNER_TEMP\out"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\out" | Out-Null
          "Lakay build $build"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, runs on Node.js 24
        with:
          python-version: '3.12'

      - name: Install the build tools
        # The versions the Forge's Windows build uses (and Inkwell's before it):
        # fixed, so a new release elsewhere cannot change the program unnoticed.
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --only-binary=pyinstaller "pyinstaller==6.22.3" "pywebview==6.2.1" "pythonnet==3.2.0"
          if ($LASTEXITCODE -ne 0) { Write-Error "The build tools could not be installed."; exit 1 }
          python -m pip list | Select-String -Pattern "pyinstaller|pywebview|pythonnet"
          exit 0

      - name: Build Lakay (a program folder)
        run: |
          python -m PyInstaller --noconfirm --clean desktop\windows\emporium.spec 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build-log.txt" | Select-Object -Last 8
          $dir = "$env:GITHUB_WORKSPACE\dist\Lakay"
          $exe = "$dir\Lakay.exe"
          if (-not (Test-Path $exe)) { Write-Error "No program was produced."; exit 1 }
          $v = (Get-Item $exe).VersionInfo
          "Version details: product '$($v.ProductName)', file version $($v.FileVersion), product version '$($v.ProductVersion)', company '$($v.CompanyName)'"
          $files = Get-ChildItem $dir -Recurse -File
          "{0} files, {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
          "PROGRAM_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Check the page inside is the one committed
        run: |
          python -c "import sys,hashlib; a=open(sys.argv[1],'rb').read(); b=open(sys.argv[2],'rb').read(); rec=open(sys.argv[3]).read().split()[0]; h=hashlib.sha256(a).hexdigest(); print('inside', h, 'recorded', rec); sys.exit(0 if a==b and h==rec else 1)" "$env:PROGRAM_DIR\_internal\Lakay.html" "app\Lakay.html" "app\Lakay.html.sha256"
          if ($LASTEXITCODE -ne 0) { Write-Error "The page inside the program is not app/Lakay.html as committed and fingerprinted."; exit 1 }
          exit 0

      - name: Open the program once
        # Starts the program and waits for its own line "start: page ready"
        # (the door drawn), takes a photograph, starts it a second time (that
        # copy must bring the open window forward and end), then closes it the
        # way a person does and checks the ending was clean.
        run: |
          Set-Location $env:PROGRAM_DIR
          $log = "$env:LOCALAPPDATA\Emporium\emporium.log"
          $flag = "$env:LOCALAPPDATA\Emporium\storage\emporium_session.flag"
          Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $flag -ErrorAction SilentlyContinue
          function ReadLog {
            try {
              $fs = [IO.File]::Open($log, 'Open', 'Read', 'ReadWrite')
              try { (New-Object IO.StreamReader($fs)).ReadToEnd() } finally { $fs.Dispose() }
            } catch { '' }
          }
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath ".\Lakay.exe" -PassThru
          $null = $p.Handle
          $text = ''
          while (($clock.Elapsed.TotalSeconds -lt 120) -and -not $p.HasExited) {
            Start-Sleep -Milliseconds 500
            $text = ReadLog
            if ($text -match 'start: page (NOT )?ready') { break }
          }
          "Waited {0:N1} s for the page." -f $clock.Elapsed.TotalSeconds
          if (-not $p.HasExited) { Start-Sleep -Seconds 3 }
          try {
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shots" | Out-Null
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\shots\windows.png")
            "Screenshot taken."
          } catch { "No screenshot: $($_.Exception.Message)" }
          $second = 'not tried'
          if (-not $p.HasExited) {
            $q = Start-Process -FilePath ".\Lakay.exe" -PassThru
            $null = $q.Handle
            $ended = $q.WaitForExit(30000)
            $fwd = (ReadLog) -match 'start: already open; brought its window forward'
            if ($ended -and $q.ExitCode -eq 0 -and $fwd) { $second = 'it brought the open window forward and ended by itself' } else {
              $second = if ($ended) { "it ended with code $($q.ExitCode) without saying it brought the window forward" } else { 'it did NOT end by itself within 30 seconds' }
              if (-not $ended) { Stop-Process -Id $q.Id -Force -ErrorAction SilentlyContinue }
              "::warning::A second start: $second."
            }
            "Second start: $second."
          }
          $alive = -not $p.HasExited
          $clean = $false
          if ($alive) {
            $p.Refresh()
            if ($p.CloseMainWindow() -and $p.WaitForExit(20000)) { "Closed when asked." } else { "Did NOT close when asked, so it was stopped."; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
            if (Test-Path -LiteralPath $flag) { "The close left the mark of a bad ending." } else { $clean = $true; "The close was a clean ending." }
          } else { "EXITED EARLY with code $($p.ExitCode)" }
          "--- what the program recorded ---"
          $text = ReadLog
          if ($text) { $text } else { "(nothing)" }
          $m = [regex]::Match($text, 'start: page ready in ([0-9.]+) s')
          $note = if ($m.Success) { "page ready $($m.Groups[1].Value) s after the program started (a first start, on a computer with no graphics chip)" } else { 'not measured' }
          "START_NOTE=$note" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Add-Content $env:GITHUB_STEP_SUMMARY "### Start on GitHub's Windows computer: $note. Second start: $second."
          if ($text -match 'Traceback') { Write-Error "A fault was recorded."; exit 1 }
          if (-not $alive) { exit 1 }
          if (-not $clean) { Write-Error "Closing the window did not end the program cleanly."; exit 1 }
          if (-not $m.Success) { Write-Error "The page did not say it was ready within 120 seconds. The photograph under Artifacts shows the screen."; exit 1 }
          exit 0

      - name: Make the installer
        run: |
          $find = { Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = & $find }
          if (-not $iscc) { Write-Error "Inno Setup could not be found or installed."; exit 1 }
          "Inno Setup: $($iscc.FullName) $($iscc.VersionInfo.ProductVersion)"
          & $iscc.FullName /Qp "/DAppVersion=$env:APP_LABEL" "/DAppNumeric=$env:APP_NUMERIC" "/DProgramDir=$env:PROGRAM_DIR" "/DOutputDir=$env:OUT" "/DSetupName=$env:SETUP_BASE" "desktop\windows\emporium.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "The installer could not be made."; exit 1 }
          $setup = "$env:OUT\$env:SETUP_BASE.exe"
          if (-not (Test-Path $setup)) { Write-Error "No installer was produced."; exit 1 }
          Get-Item $setup | Format-List Name, Length
          exit 0

      - name: Install it, then uninstall it, silently
        run: |
          $setup = "$env:OUT\$env:SETUP_BASE.exe"
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Lakay'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=$env:RUNNER_TEMP\setup-log.txt" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Write-Error "The installer did not finish within 10 minutes."; exit 1 }
          "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "The installer failed."; exit 1 }
          if (-not (Test-Path "$dir\Lakay.exe")) { Write-Error "The installer did not put the program in $dir."; exit 1 }
          if (-not (Test-Path "$dir\_internal\Lakay.html")) { Write-Error "The installed program has no Lakay.html."; exit 1 }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Lakay.lnk'
          if (-not (Test-Path $lnk)) { Write-Error "No Start menu entry was made."; exit 1 }
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -like 'com.yannieforest.emporium.windows*' }
          if (-not $key) { Write-Error "No entry in Settings, Apps."; exit 1 }
          "Installed in $dir, with a Start menu entry and an entry in Settings, Apps."
          $bk = Join-Path $env:LOCALAPPDATA 'Emporium\backups'
          $kept = @(Get-ChildItem $bk -Directory -Filter 'setup-*' -ErrorAction SilentlyContinue | ForEach-Object Name)
          "Copies of the books made by the installer before it changed anything: $($kept -join ', ')"
          if ($kept.Count -lt 1) { Write-Error "The installer did not copy the books folder first."; exit 1 }
          $un = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          $u = Start-Process -FilePath $un.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\uninstall-log.txt" -PassThru
          $null = $u.WaitForExit(300000)
          for ($i = 0; ($i -lt 90) -and (Test-Path "$dir\Lakay.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\Lakay.exe") { Write-Error "The uninstaller did not remove the program."; exit 1 }
          if (-not (Test-Path "$env:LOCALAPPDATA\Emporium\storage")) { Write-Error "The uninstaller removed the books folder; it must never do that."; exit 1 }
          "Uninstalled: the program is gone and the books folder stayed."
          exit 0

      - name: If the build failed, show why
        if: failure()
        run: |
          foreach ($l in @("$env:RUNNER_TEMP\build-log.txt", "$env:RUNNER_TEMP\setup-log.txt", "$env:RUNNER_TEMP\uninstall-log.txt", "$env:LOCALAPPDATA\Emporium\emporium.log")) { if (Test-Path $l) { "--- $l"; Get-Content $l -Tail 80 } }

      - name: Scan with Microsoft Defender (a detection stops the run)
        # A scan only, as anyone can run one on their own PC: the newest
        # definitions, then the installer and the program folder, reporting
        # what it finds instead of deleting it. GitHub's computers keep
        # Defender's cloud and real-time protection off, so a clean scan is
        # good evidence, not a guarantee.
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          $newer = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($newer) { $mp = $newer.FullName }
          if (-not (Test-Path $mp)) { "DEFENDER_NOTE=Defender scan not measured (MpCmdRun.exe missing)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; "::warning::Defender is not on this computer"; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          if ($LASTEXITCODE -ne 0) { & $mp -SignatureUpdate -MMPC | Out-Host }
          $defs = ''
          try { $defs = "$((Get-MpComputerStatus).AntivirusSignatureVersion)" } catch { }
          $found = @(); $unfinished = $false
          foreach ($t in @($env:OUT, $env:PROGRAM_DIR)) {
            $out = & $mp -Scan -ScanType 3 -File $t -DisableRemediation 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) { "Scanned $t : no threats" }
            elseif ($LASTEXITCODE -eq 2) { $found += $t; "Scanned $t : THREATS FOUND"; $out }
            else { $unfinished = $true; "Scanned $t : the scan did not finish (exit code $LASTEXITCODE)"; $out }
          }
          if ($found.Count -gt 0) { Add-Content $env:GITHUB_STEP_SUMMARY "### Microsoft Defender: DETECTION, nothing published"; Write-Error "Microsoft Defender named a threat. Nothing is published."; exit 1 }
          $note = if ($unfinished) { 'Defender scan not finished' } else { "Microsoft Defender: no detection (definitions $defs)" }
          "DEFENDER_NOTE=$note" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Add-Content $env:GITHUB_STEP_SUMMARY "### $note"
          exit 0

      - name: Put the installer on the Releases page and in builds/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python release\publish.py "$env:OUT\$env:SETUP_BASE.exe" "Windows installer" "$env:DEFENDER_NOTE; $env:START_NOTE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0
