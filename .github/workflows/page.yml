name: Lakay standalone page

# Packs the standalone page (app/Lakay.html with its fingerprint, the
# licence, the READ ME and the documents) and puts it on the build's release.

on:
  push:
    paths:
      - 'app/**'
      - 'build.json'
      - 'docs/**'
      - 'LICENCE.txt'
      - 'release/**'
      - '.github/workflows/page.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page:
    # each device has its own repository; this one builds only in Lakay-Windows
    if: contains(github.repository, 'Lakay-Windows')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Read the build number and check the page's fingerprint
        run: |
          BUILD=$(python3 -c "import json;print(int(json.load(open('build.json'))['build']))")
          DATE=$(python3 -c "import json;print(json.load(open('build.json')).get('date',''))")
          (cd app && sha256sum -c Lakay.html.sha256)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"

      - name: Pack the standalone page
        run: |
          D="Lakay Build $BUILD"
          mkdir -p "out/$D/docs"
          cp app/Lakay.html app/Lakay.html.sha256 LICENCE.txt "out/$D/"
          cp docs/*.md "out/$D/docs/"
          sed -e "s/@@BUILD@@/$BUILD/g" -e "s/@@DATE@@/$DATE/g" "release/READ ME FIRST.txt" > "out/$D/READ ME FIRST.txt"
          (cd out && zip -X -q -r "../Lakay-Standalone-Page.zip" "$D")
          unzip -l "Lakay-Standalone-Page.zip"

      - name: Put it on the build's release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 release/publish.py "Lakay-Standalone-Page.zip" "Standalone page" "Lakay.html inside: SHA-256 $(cut -d' ' -f1 app/Lakay.html.sha256)"
